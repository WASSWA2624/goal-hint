name: goal_hint
description: "Minimal native host for the Goal Hint web application."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.6'

dependencies:
  flutter:
    sdk: flutter
  file_selector: 1.1.0
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.2
  flutter_inappwebview_windows:
    path: packages/flutter_inappwebview_windows
  flutter_inappwebview_platform_interface: 1.3.0+1
  path_provider: 2.1.6
  path: 1.9.1
  url_launcher: 6.3.3
  share_plus: 13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/goal-hint-mark.png
    - assets/branding/goal-hint-mark-inverse.png
