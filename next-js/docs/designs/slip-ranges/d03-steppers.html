<script>
(function () {
  var root = document.querySelector('.d03');
  if (!root) return;

  var EPS = 1e-9;

  function round(n, decimals) { var f = Math.pow(10, decimals); return Math.round(n * f) / f; }

  /* Sensible odds stops: 0.25 below 5, 1 below 20, 5 below 100, then x2 up to the cap. */
  function oddsStops() {
    var stops = [1.01], v;
    for (v = 1.25; v < 5 - EPS; v += 0.25) stops.push(round(v, 2));
    for (v = 5; v < 20; v += 1) stops.push(v);
    for (v = 20; v < 100; v += 5) stops.push(v);
    for (v = 100; v < 100000; v *= 2) stops.push(v);
    stops.push(100000);
    return stops;
  }

  var SPECS = {
    total: { floor: 1.01, ceil: 100000, decimals: 2, stops: oddsStops(), maxStart: 100 },
    teams: { floor: 1, ceil: 8, decimals: 0, stops: [1, 2, 3, 4, 5, 6, 7, 8], maxStart: 7 }
  };

  function parse(text) {
    var t = String(text == null ? '' : text).trim();
    if (!t) return null;
    var n = Number(t);
    return isFinite(n) ? n : null;
  }
  function format(n, spec) {
    if (spec.decimals === 0) return String(Math.round(n));
    return Math.abs(n - Math.round(n)) < EPS ? String(Math.round(n)) : n.toFixed(spec.decimals);
  }
  function clamp(n, spec) { return round(Math.min(spec.ceil, Math.max(spec.floor, n)), spec.decimals); }
  function nextStop(n, stops) { for (var i = 0; i < stops.length; i++) { if (stops[i] > n + EPS) return stops[i]; } return undefined; }
  function prevStop(n, stops) { for (var i = stops.length - 1; i >= 0; i--) { if (stops[i] < n - EPS) return stops[i]; } return undefined; }
  function same(a, b) {
    if (a === b) return true;
    if (a == null || b == null) return false;
    return Math.abs(a - b) < EPS;
  }

  function makeBound(el, kind, spec) {
    if (!el) return null;
    var input = el.querySelector('.d03-value');
    if (!input) return null;
    return {
      el: el, kind: kind, input: input,
      down: el.querySelector('.d03-step[data-dir="-1"]'),
      up: el.querySelector('.d03-step[data-dir="1"]'),
      clear: el.querySelector('.d03-clear'),
      stepper: el.querySelector('.d03-stepper'),
      value: function () { return parse(input.value); },
      set: function (v) { input.value = v === null ? '' : format(v, spec); }
    };
  }

  function setupRange(row) {
    var spec = SPECS[row.getAttribute('data-range')];
    if (!spec) return;
    var min = makeBound(row.querySelector('[data-bound="min"]'), 'min', spec);
    var max = makeBound(row.querySelector('[data-bound="max"]'), 'max', spec);
    if (!min || !max) return;
    var msg = row.querySelector('.d03-msg');

    /* Where a step would land: a number, null (= Any) or undefined (= no move). "Any" sits at the floor for a min and at the ceiling for a max. */
    function target(bound, dir) {
      var cur = bound.value(), t;
      if (bound.kind === 'min') {
        if (dir > 0) {
          t = nextStop(cur === null ? spec.floor : cur, spec.stops);
          return t === undefined ? spec.ceil : Math.min(t, spec.ceil);
        }
        if (cur === null) return undefined;
        t = prevStop(cur, spec.stops);
        return (t === undefined || t <= spec.floor + EPS) ? null : t;
      }
      if (dir < 0) {
        if (cur === null) return spec.maxStart;
        t = prevStop(cur, spec.stops);
        return t === undefined ? spec.floor : Math.max(t, spec.floor);
      }
      if (cur === null) return undefined;
      t = nextStop(cur, spec.stops);
      return (t === undefined || t >= spec.ceil - EPS) ? null : t;
    }

    /* Keep min <= max: a step may meet the other bound but never cross it; from an invalid (typed) state only steps back towards it are allowed. */
    function constrain(bound, t) {
      if (t === null || t === undefined) return t;
      var other = (bound.kind === 'min' ? max : min).value();
      if (other === null) return t;
      var cur = bound.value();
      if (bound.kind === 'min' && t > other + EPS) {
        if (cur === null || cur < other - EPS) return other;
        return t < cur - EPS ? t : undefined;
      }
      if (bound.kind === 'max' && t < other - EPS) {
        if (cur === null || cur > other + EPS) return other;
        return t > cur + EPS ? t : undefined;
      }
      return t;
    }

    function stepTo(bound, dir) {
      var t = constrain(bound, target(bound, dir));
      if (t === undefined || same(t, bound.value())) return undefined;
      return t;
    }
    function step(bound, dir) {
      var t = stepTo(bound, dir);
      if (t === undefined) return;
      bound.set(t);
      refresh();
    }
    function setDisabled(button, disabled) { if (button) button.setAttribute('aria-disabled', disabled ? 'true' : 'false'); }

    function refresh() {
      var mn = min.value(), mx = max.value();
      var invalid = mn !== null && mx !== null && mn > mx + EPS;
      [min, max].forEach(function (b) {
        b.el.setAttribute('data-empty', b.value() === null ? 'true' : 'false');
        setDisabled(b.down, stepTo(b, -1) === undefined);
        setDisabled(b.up, stepTo(b, 1) === undefined);
        b.input.setAttribute('aria-invalid', invalid ? 'true' : 'false');
        if (b.stepper) b.stepper.setAttribute('data-invalid', invalid ? 'true' : 'false');
      });
      if (msg) msg.textContent = invalid ? 'Min is above max' : '';
    }

    function sanitise(bound) {
      var raw = bound.input.value, clean;
      if (spec.decimals > 0) {
        clean = raw.replace(/[^0-9.]/g, '');
        var dot = clean.indexOf('.');
        if (dot !== -1) clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, '');
      } else {
        clean = raw.replace(/\D/g, '');
      }
      if (clean !== raw) bound.input.value = clean;
    }
    function commit(bound) {
      var v = bound.value();
      bound.set(v === null ? null : clamp(v, spec));
      refresh();
    }

    [min, max].forEach(function (b) {
      if (b.down) b.down.addEventListener('click', function () { step(b, -1); });
      if (b.up) b.up.addEventListener('click', function () { step(b, 1); });
      if (b.clear) b.clear.addEventListener('click', function () { b.set(null); refresh(); b.input.focus(); });
      b.input.addEventListener('input', function () { sanitise(b); refresh(); });
      b.input.addEventListener('blur', function () { commit(b); });
      b.input.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
          event.preventDefault();
          commit(b);
          step(b, event.key === 'ArrowUp' ? 1 : -1);
        } else if (event.key === 'Enter') {
          commit(b);
        }
      });
    });

    refresh();
  }

  var rows = root.querySelectorAll('.d03-row[data-range]');
  for (var i = 0; i < rows.length; i++) setupRange(rows[i]);
})();
</script>
