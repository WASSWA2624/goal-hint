<!-- 18 Stacked rows -->
<style>
/* 18 Stacked rows: two slim list rows, label left, "min – max" right, one hairline between them. */
.d18 .d18-targets { margin: 0; border: 0; min-inline-size: 0; }
.d18 .d18-rows { inline-size: 100%; max-inline-size: 23rem; }
.d18 .d18-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-block-size: 30px; padding-block: 2px; }
.d18 .d18-row + .d18-row { border-block-start: 1px solid var(--gh-border); }
.d18 .d18-name { flex: 1 1 auto; min-inline-size: 0; margin: 0; font-size: 0.8125rem; font-weight: 700; line-height: 1.25; color: var(--gh-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d18 .d18-pair { flex: none; display: inline-flex; align-items: center; gap: 6px; }
.d18 .d18-dash { color: var(--gh-muted); font-size: 0.8125rem; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; }
.d18 .d18-row[data-invalid="true"] .d18-dash { color: var(--gh-error); }
.d18 .d18-field { flex: none; inline-size: 4.5rem; min-inline-size: 0; block-size: 26px; padding: 0 6px; border: 1px solid var(--gh-control-border); border-radius: var(--gh-radius);
  background: var(--gh-surface); color: var(--gh-text); font-size: 0.8125rem; font-weight: 700; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.d18 .d18-field::placeholder { font-weight: 400; }
.d18 .d18-field:hover { border-color: var(--gh-text); }
.d18 .d18-field:focus-visible { outline-offset: -1px; border-color: var(--gh-focus); }
.d18 .d18-field[aria-invalid="true"] { border-color: var(--gh-error); color: var(--gh-error); }
@container panel (min-width: 641px) {
  .d18 .gh-form { align-items: center; }
}
@container panel (max-width: 640px) {
  .d18 .d18-rows { max-inline-size: none; }
}
@media (pointer: coarse) {
  .d18 .d18-row { min-block-size: 52px; padding-block: 4px; }
  .d18 .d18-field { block-size: 44px; font-size: 1rem; }
  .d18 .d18-dash { font-size: 1rem; }
}
</style>
<section class="gh-builder d18">
  <!-- KEEP -->
  <header class="gh-head">
    <h1>Slip builder</h1>
    <label class="gh-slips">Number of slips <input type="number" value="3" min="1" max="10" step="1" inputmode="numeric" aria-label="Number of slips"></label>
  </header>
  <div class="gh-panel">
    <form class="gh-form" onsubmit="return false">
      <fieldset class="gh-targets d18-targets">
        <legend class="sr-only">Your slips</legend>
        <div class="d18-rows">
          <div class="d18-row" data-invalid="false">
            <label class="d18-name" for="d18-total-min">Total odds per slip</label>
            <span class="d18-pair">
              <input class="d18-field" id="d18-total-min" name="totalMin" type="number" value="2.5" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" autocomplete="off" aria-label="Total odds per slip, minimum" aria-describedby="d18-total-status">
              <span class="d18-dash" aria-hidden="true">&ndash;</span>
              <input class="d18-field" id="d18-total-max" name="totalMax" type="number" value="" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" autocomplete="off" aria-label="Total odds per slip, maximum" aria-describedby="d18-total-status">
            </span>
            <span class="sr-only" id="d18-total-status" aria-live="polite"></span>
          </div>
          <div class="d18-row" data-invalid="false">
            <label class="d18-name" for="d18-teams-min">Matches per slip</label>
            <span class="d18-pair">
              <input class="d18-field" id="d18-teams-min" name="teamsMin" type="number" value="2" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" autocomplete="off" aria-label="Matches per slip, minimum" aria-describedby="d18-teams-status">
              <span class="d18-dash" aria-hidden="true">&ndash;</span>
              <input class="d18-field" id="d18-teams-max" name="teamsMax" type="number" value="5" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" autocomplete="off" aria-label="Matches per slip, maximum" aria-describedby="d18-teams-status">
            </span>
            <span class="sr-only" id="d18-teams-status" aria-live="polite"></span>
          </div>
        </div>
      </fieldset>
      <!-- KEEP (the three dialog buttons; do not restyle them) -->
      <div class="gh-options">
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match limits</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match Date &amp; Time</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog" data-edited="false">Markets <small aria-hidden="true">4</small></button>
      </div>
      <!-- KEEP -->
      <div class="gh-actions">
        <a class="gh-button" href="#">Reset</a>
        <button type="submit" class="gh-button gh-primary">Build slips</button>
      </div>
    </form>
  </div>
</section>
<script>
(function () {
  var root = document.querySelector('.d18');
  if (!root) return;
  var groups = [
    { min: 'd18-total-min', max: 'd18-total-max', status: 'd18-total-status', lo: 1.01, hi: 100000, dp: 2 },
    { min: 'd18-teams-min', max: 'd18-teams-max', status: 'd18-teams-status', lo: 1, hi: 8, dp: 0 }
  ];
  var MSG = 'Minimum is above maximum. The two values swap when you leave the field.';
  function byId(id) { return root.querySelector('#' + id); }
  function read(el) {
    var s = el ? String(el.value).trim() : '';
    if (s === '') return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function format(n, dp) {
    var f = Math.pow(10, dp);
    return String(Math.round(n * f) / f);
  }
  function clamp(el, g) {
    var n = read(el);
    if (n === null) { el.value = ''; return; }
    n = Math.min(g.hi, Math.max(g.lo, n));
    el.value = format(n, g.dp);
  }
  function check(g) {
    var a = read(g.minEl), b = read(g.maxEl);
    var bad = a !== null && b !== null && a > b;
    var flag = bad ? 'true' : 'false';
    g.minEl.setAttribute('aria-invalid', flag);
    g.maxEl.setAttribute('aria-invalid', flag);
    if (g.row) g.row.setAttribute('data-invalid', flag);
    if (g.statusEl) {
      var msg = bad ? MSG : '';
      if (g.statusEl.textContent !== msg) g.statusEl.textContent = msg;
    }
    if (bad) { g.minEl.title = MSG; g.maxEl.title = MSG; }
    else { g.minEl.removeAttribute('title'); g.maxEl.removeAttribute('title'); }
    return bad;
  }
  function commit(g) {
    clamp(g.minEl, g);
    clamp(g.maxEl, g);
    if (check(g)) {
      var t = g.minEl.value;
      g.minEl.value = g.maxEl.value;
      g.maxEl.value = t;
      check(g);
    }
  }
  groups.forEach(function (g) {
    g.minEl = byId(g.min);
    g.maxEl = byId(g.max);
    g.statusEl = byId(g.status);
    if (!g.minEl || !g.maxEl) return;
    g.row = g.minEl.closest ? g.minEl.closest('.d18-row') : null;
    [g.minEl, g.maxEl].forEach(function (el) {
      el.addEventListener('input', function () { check(g); });
      el.addEventListener('change', function () { commit(g); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && el.value !== '') { e.preventDefault(); el.value = ''; check(g); }
      });
    });
    check(g);
  });
})();
</script>
