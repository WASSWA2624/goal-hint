<!-- 17 Interval brackets -->
<style>
/* 17 Interval brackets: "Total odds [ 2.50 , any ]" reads like maths interval notation. Every selector is scoped to .d17. */
.d17 .d17-targets { margin: 0; border: 0; min-inline-size: 0; }
.d17 .d17-grid { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr); column-gap: 12px; row-gap: 6px; align-items: center; min-inline-size: 0; }
.d17 .d17-row { display: contents; }
.d17 .d17-name { margin: 0; font-size: 0.8125rem; font-weight: 700; line-height: 1.3; white-space: nowrap; cursor: pointer; }
.d17 .d17-sub { font-size: 0.75rem; font-weight: 400; color: var(--gh-muted); }
.d17 .d17-interval { display: inline-flex; align-items: center; gap: 2px; block-size: 32px; min-inline-size: 0; }
.d17 .d17-bracket { flex: none; inline-size: 10px; block-size: auto; align-self: stretch; overflow: visible; color: var(--gh-brand); transition: color .12s ease, opacity .12s ease; }
.d17 .d17-interval[data-min-set="false"] .d17-bracket-open,
.d17 .d17-interval[data-max-set="false"] .d17-bracket-close { opacity: .4; }
.d17 .d17-num { flex: none; inline-size: 6.5ch; block-size: 28px; margin: 0; padding: 0 4px; border: 0; border-block-end: 1px dotted var(--gh-control-border); border-radius: var(--gh-radius);
  background: transparent; color: var(--gh-text); font-size: 1rem; font-weight: 700; line-height: 1; text-align: center; font-variant-numeric: tabular-nums;
  transition: background-color .12s ease, border-color .12s ease; }
.d17 .d17-num::placeholder { font-weight: 500; }
.d17 .d17-num:hover { background: var(--gh-surface-muted); border-block-end-style: solid; border-block-end-color: var(--gh-brand); }
.d17 .d17-num:focus-visible { outline-offset: 0; background: var(--gh-surface); border-block-end-style: solid; border-block-end-color: var(--gh-brand); }
.d17 .d17-comma { flex: none; padding-inline: 2px; color: var(--gh-muted); font-size: 1.125rem; font-weight: 700; line-height: 28px; }
.d17 .d17-interval[data-invalid="true"] .d17-bracket { color: var(--gh-error); opacity: 1; }
.d17 .d17-interval[data-invalid="true"] .d17-num { color: var(--gh-error); border-block-end-style: solid; border-block-end-color: var(--gh-error); }
.d17 .d17-hint { min-inline-size: 0; font-size: 0.6875rem; line-height: 1.3; color: var(--gh-muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .12s ease; }
.d17 .d17-interval:hover + .d17-hint,
.d17 .d17-interval:focus-within + .d17-hint,
.d17 .d17-hint[data-state="error"] { opacity: 1; }
.d17 .d17-hint[data-state="error"] { color: var(--gh-error); font-weight: 700; }

@container panel (max-width: 640px) {
  .d17 .d17-grid { grid-template-columns: minmax(0, 1fr); row-gap: 10px; }
  .d17 .d17-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; row-gap: 3px; align-items: baseline; }
  .d17 .d17-name { grid-area: 1 / 1; }
  .d17 .d17-hint { grid-area: 1 / 2; text-align: end; }
  .d17 .d17-interval { grid-area: 2 / 1 / 3 / 3; display: flex; block-size: 40px; }
  .d17 .d17-num { flex: 1 1 0; inline-size: auto; block-size: 36px; }
  .d17 .d17-comma { line-height: 36px; }
}
@media (pointer: coarse) {
  .d17 .d17-interval { block-size: 44px; }
  .d17 .d17-num { block-size: 40px; }
  .d17 .d17-comma { line-height: 40px; }
}
</style>
<section class="gh-builder d17">
  <!-- KEEP -->
  <header class="gh-head">
    <h1>Slip builder</h1>
    <label class="gh-slips">Number of slips <input type="number" value="3" min="1" max="10" step="1" inputmode="numeric" aria-label="Number of slips"></label>
  </header>
  <div class="gh-panel">
    <form class="gh-form" onsubmit="return false">
      <fieldset class="gh-targets d17-targets">
        <legend class="sr-only">Your slips</legend>
        <div class="d17-grid">
          <div class="d17-row">
            <label class="d17-name" id="d17-odds-name" for="d17-total-min">Total odds <span class="d17-sub">per slip</span></label>
            <div class="d17-interval" role="group" aria-labelledby="d17-odds-name" data-decimals="2" data-min-set="true" data-max-set="false" data-invalid="false">
              <svg class="d17-bracket d17-bracket-open" viewBox="0 0 10 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M9 1H1v30h8" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
              <input class="d17-num" id="d17-total-min" name="totalMin" type="number" inputmode="decimal" min="1.01" max="100000" step="0.01" value="2.50" placeholder="any" data-bound="min" aria-label="Minimum total odds per slip" aria-describedby="d17-odds-hint" autocomplete="off">
              <span class="d17-comma" aria-hidden="true">,</span>
              <input class="d17-num" id="d17-total-max" name="totalMax" type="number" inputmode="decimal" min="1.01" max="100000" step="0.01" value="" placeholder="any" data-bound="max" aria-label="Maximum total odds per slip" aria-describedby="d17-odds-hint" autocomplete="off">
              <svg class="d17-bracket d17-bracket-close" viewBox="0 0 10 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M1 1h8v30H1" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
            </div>
            <span class="d17-hint" id="d17-odds-hint" data-state="help" aria-live="polite">1.01 to 100000 &middot; blank means any</span>
          </div>
          <div class="d17-row">
            <label class="d17-name" id="d17-matches-name" for="d17-teams-min">Matches <span class="d17-sub">per slip</span></label>
            <div class="d17-interval" role="group" aria-labelledby="d17-matches-name" data-decimals="0" data-min-set="true" data-max-set="true" data-invalid="false">
              <svg class="d17-bracket d17-bracket-open" viewBox="0 0 10 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M9 1H1v30h8" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
              <input class="d17-num" id="d17-teams-min" name="teamsMin" type="number" inputmode="numeric" min="1" max="8" step="1" value="2" placeholder="any" data-bound="min" aria-label="Minimum matches per slip" aria-describedby="d17-matches-hint" autocomplete="off">
              <span class="d17-comma" aria-hidden="true">,</span>
              <input class="d17-num" id="d17-teams-max" name="teamsMax" type="number" inputmode="numeric" min="1" max="8" step="1" value="5" placeholder="any" data-bound="max" aria-label="Maximum matches per slip" aria-describedby="d17-matches-hint" autocomplete="off">
              <svg class="d17-bracket d17-bracket-close" viewBox="0 0 10 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M1 1h8v30H1" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
            </div>
            <span class="d17-hint" id="d17-matches-hint" data-state="help" aria-live="polite">1 to 8 &middot; blank means any</span>
          </div>
        </div>
      </fieldset>
      <!-- KEEP (the three dialog buttons; do not restyle them) -->
      <div class="gh-options">
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match limits</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match Date &amp; Time</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog" data-edited="false">Markets <small aria-hidden="true">4</small></button>
      </div>
      <!-- KEEP -->
      <div class="gh-actions">
        <a class="gh-button" href="#">Reset</a>
        <button type="submit" class="gh-button gh-primary">Build slips</button>
      </div>
    </form>
  </div>
</section>
<script>
(function () {
  var root = document.querySelector('.d17');
  if (!root) return;
  var groups = root.querySelectorAll('.d17-interval');
  Array.prototype.forEach.call(groups, function (group) {
    var min = group.querySelector('input[data-bound="min"]');
    var max = group.querySelector('input[data-bound="max"]');
    if (!min || !max) return;
    var lo = Number(min.getAttribute('min'));
    var hi = Number(min.getAttribute('max'));
    if (!isFinite(lo)) lo = -Infinity;
    if (!isFinite(hi) || hi === 0) hi = Infinity;
    var decimals = Number(group.getAttribute('data-decimals')) || 0;
    var next = group.nextElementSibling;
    var hint = next && next.classList && next.classList.contains('d17-hint') ? next : null;
    var help = hint ? hint.textContent : '';

    function read(input) {
      var raw = String(input.value || '').trim();
      if (!raw) return null;
      var n = Number(raw);
      return isFinite(n) ? n : null;
    }
    function format(n) {
      return decimals ? n.toFixed(decimals) : String(Math.round(n));
    }
    /* On commit: blank stays Any; otherwise clamp to the allowed range and tidy the format (2.5 -> 2.50). */
    function settle(input) {
      var n = read(input);
      if (n === null) { input.value = ''; return; }
      n = Math.min(hi, Math.max(lo, n));
      input.value = format(n);
    }
    /* Paint bracket state (set vs open) and flag a crossed interval (min > max). */
    function paint() {
      var a = read(min), b = read(max);
      var crossed = a !== null && b !== null && a > b;
      group.setAttribute('data-min-set', a === null ? 'false' : 'true');
      group.setAttribute('data-max-set', b === null ? 'false' : 'true');
      group.setAttribute('data-invalid', crossed ? 'true' : 'false');
      min.setAttribute('aria-invalid', crossed ? 'true' : 'false');
      max.setAttribute('aria-invalid', crossed ? 'true' : 'false');
      if (hint) {
        var state = crossed ? 'error' : 'help';
        if (hint.getAttribute('data-state') !== state) {
          hint.setAttribute('data-state', state);
          hint.textContent = crossed ? 'Min can’t be above max' : help;
        }
      }
    }
    Array.prototype.forEach.call([min, max], function (input) {
      var focusedAt = 0;
      input.addEventListener('input', paint);
      input.addEventListener('change', function () { settle(input); paint(); });
      /* Focus selects the whole number so typing replaces it and one Backspace clears it back to "any". */
      input.addEventListener('focus', function () {
        focusedAt = Date.now();
        try { input.select(); } catch (e) { /* some engines refuse select() on number inputs */ }
      });
      input.addEventListener('mouseup', function (event) {
        if (Date.now() - focusedAt < 250) event.preventDefault();
      });
    });
    paint();
  });
})();
</script>
