<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap">
<style>
  #gh-share-concepts {
    --gh-page: light-dark(#F0F3F8, #03111F); --gh-paper: light-dark(#FFFFFF, #081B2C);
    --gh-soft: light-dark(#F5F7FA, #0D253B); --gh-ink: light-dark(#15243B, #F4F7FF);
    --gh-muted: light-dark(#53647C, #A8CBEF); --gh-line: light-dark(#D9E1ED, #263D50);
    --gh-blue: light-dark(#2457C5, #00B9F2); --gh-tint: light-dark(#E3ECFF, #073052);
    --gh-green: light-dark(#007754, #70DEA4); --gh-green-soft: light-dark(#E5F4EC, #1C342B);
    --gh-scrim: light-dark(rgb(21 36 59 / 15%), rgb(0 8 20 / 50%));
    font: 400 13px/1.5 Manrope, Arial, sans-serif; color: var(--gh-ink); text-align: start;
  }
  #gh-share-concepts *, #gh-share-concepts *::before, #gh-share-concepts *::after { box-sizing: border-box; }
  #gh-share-concepts [hidden] { display: none !important; }
  #gh-share-concepts button { font: inherit; color: inherit; border-radius: 0; }
  #gh-share-concepts .gh-stage { min-block-size: 790px; padding-block: 8px 20px; }
  #gh-share-concepts .gh-heading { display: flex; align-items: baseline; gap: 12px; margin: 0 100px 16px 0; }
  #gh-share-concepts .gh-heading span { font-size: 11px; color: var(--gh-muted); white-space: nowrap; }
  #gh-share-concepts h2 { margin: 0; font-size: 18px; line-height: 1.4; font-weight: 500; }
  #gh-share-concepts .gh-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-block-size: 34px; padding: 6px 11px; max-inline-size: 100%; background: var(--gh-paper); border: 1px solid var(--gh-line); font-size: 12px; font-weight: 500; white-space: nowrap; }
  #gh-share-concepts .gh-button:hover { background: var(--gh-tint); }
  #gh-share-concepts .gh-quiet { background: transparent; border-color: transparent; color: var(--gh-muted); }
  #gh-share-concepts .gh-primary { background: var(--gh-green); color: light-dark(#FFFFFF, #03111F); border-color: var(--gh-green); }
  #gh-share-concepts .gh-primary:hover { background: var(--gh-green); filter: brightness(.96); }
  #gh-share-concepts .gh-icon { inline-size: 15px; block-size: 15px; flex: none; }
  #gh-share-concepts button:focus-visible { outline: 2px solid var(--gh-blue); outline-offset: 2px; }
  #gh-share-concepts .gh-app { background: var(--gh-page); border: 1px solid var(--gh-line); min-inline-size: 0; }
  #gh-share-concepts .gh-chrome { display: flex; align-items: center; gap: 28px; min-block-size: 50px; padding-inline: 20px; background: var(--gh-paper); border-block-end: 1px solid var(--gh-line); }
  #gh-share-concepts .gh-brand { font-size: 19px; letter-spacing: -.6px; font-weight: 500; white-space: nowrap; }
  #gh-share-concepts .gh-brand em { color: var(--gh-blue); font-style: normal; }
  #gh-share-concepts .gh-nav { display: flex; align-self: stretch; gap: 20px; }
  #gh-share-concepts .gh-nav button { border: 0; border-block-end: 2px solid transparent; padding: 0; background: transparent; color: var(--gh-muted); font-size: 12px; }
  #gh-share-concepts .gh-nav button[aria-current="page"] { border-color: var(--gh-blue); color: var(--gh-blue); }
  #gh-share-concepts .gh-nav button:disabled { opacity: .6; }
  #gh-share-concepts .gh-account { margin-inline-start: auto; color: var(--gh-muted); font-size: 11px; }
  #gh-share-concepts .gh-main { padding: 18px; }
  #gh-share-concepts .gh-page-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-block-end: 14px; }
  #gh-share-concepts .gh-page-title h3 { margin: 0; font-size: 17px; font-weight: 500; }
  #gh-share-concepts .gh-meta { color: var(--gh-muted); font-size: 11px; }
  #gh-share-concepts .gh-builder { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; background: var(--gh-paper); border-block: 1px solid var(--gh-line); padding: 10px 12px; margin-block-end: 12px; font-size: 12px; }
  #gh-share-concepts .gh-builder .gh-button { margin-inline-start: auto; }
  #gh-share-concepts .gh-scene { position: relative; min-block-size: 550px; }
  #gh-share-concepts .gh-slip { background: var(--gh-paper); border-block: 1px solid var(--gh-line); position: relative; min-inline-size: 0; }
  #gh-share-concepts .gh-slip-head { display: flex; align-items: center; gap: 14px; min-block-size: 40px; padding: 3px 8px 3px 12px; }
  #gh-share-concepts .gh-slip-name { font-size: 14px; font-weight: 500; white-space: nowrap; }
  #gh-share-concepts .gh-rank { color: var(--gh-blue); font-size: 11px; margin-inline-start: 8px; font-weight: 400; }
  #gh-share-concepts .gh-facts { display: flex; flex: 1; justify-content: space-between; gap: 12px; padding-inline: 18px; color: var(--gh-muted); font-size: 11px; }
  #gh-share-concepts .gh-facts strong { color: var(--gh-ink); font-size: 13px; font-weight: 500; margin-inline-start: 5px; }
  #gh-share-concepts .gh-share { color: var(--gh-blue); min-block-size: 28px; padding: 3px 8px; }
  #gh-share-concepts .gh-collapse { padding: 4px; inline-size: 26px; min-block-size: 28px; }
  #gh-share-concepts .gh-match-table { border-collapse: collapse; inline-size: 100%; font-size: 12px; }
  #gh-share-concepts .gh-match-table td { border-block-start: 1px solid var(--gh-line); padding: 8px 10px; }
  #gh-share-concepts .gh-time { color: var(--gh-muted); font-size: 11px; inline-size: 92px; white-space: nowrap; }
  #gh-share-concepts .gh-league { color: var(--gh-muted); font-size: 11px; inline-size: 140px; }

  #gh-share-concepts .gh-layer { position: absolute; z-index: 3; inset: 0; background: var(--gh-scrim); padding: 18px; display: flex; align-items: start; justify-content: center; }
  #gh-share-concepts .gh-panel { inline-size: min(590px, 100%); min-inline-size: 0; background: var(--gh-paper); border: 1px solid var(--gh-line); box-shadow: 0 8px 28px rgb(0 8 20 / 9%); }

  #gh-share-concepts .gh-panel-body { padding: 18px; }
  #gh-share-concepts .gh-preview { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 22px; align-items: center; }
  #gh-share-concepts .gh-mat { background: var(--gh-soft); padding: 12px; }
  #gh-share-concepts .gh-ticket { color-scheme: light; background: #FFFFFF; color: #15243B; border: 1px solid #D9E1ED; padding: 14px; font-size: 11px; }
  #gh-share-concepts .gh-ticket-brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-block-end: 10px; border-block-end: 2px solid #2457C5; }
  #gh-share-concepts .gh-ticket-brand b { font-size: 17px; font-weight: 500; color: #2457C5; letter-spacing: -.5px; }
  #gh-share-concepts .gh-ticket-brand span { font-size: 10px; color: #53647C; white-space: nowrap; }
  #gh-share-concepts .gh-ticket-item { padding-block: 9px; border-block-end: 1px solid #E4E9F0; }
  #gh-share-concepts .gh-ticket-item strong { display: block; font-size: 11px; font-weight: 500; margin-block: 2px 3px; }
  #gh-share-concepts .gh-ticket-item small { font-size: 9px; color: #53647C; }
  #gh-share-concepts .gh-ticket-pick { display: flex; justify-content: space-between; gap: 10px; }
  #gh-share-concepts .gh-ticket-pick b { font-weight: 500; }
  #gh-share-concepts .gh-ticket-total { display: flex; justify-content: space-between; align-items: center; padding-block: 8px; color: #53647C; }
  #gh-share-concepts .gh-ticket-total strong { color: #2457C5; font-size: 23px; font-weight: 500; }
  #gh-share-concepts .gh-ticket-footer { border-block-start: 1px solid #D9E1ED; padding-block-start: 8px; color: #53647C; font-size: 9px; overflow-wrap: anywhere; }
  #gh-share-concepts .gh-caption-title { font-size: 16px; font-weight: 500; margin-block-end: 12px; }
  #gh-share-concepts .gh-caption { color: var(--gh-muted); font-size: 12px; overflow-wrap: anywhere; }
  #gh-share-concepts .gh-caption p { margin: 0 0 14px; }
  #gh-share-concepts .gh-links { display: grid; gap: 8px; color: var(--gh-blue); font-size: 11px; }
  #gh-share-concepts .gh-panel-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 18px; border-block-start: 1px solid var(--gh-line); }
  #gh-share-concepts .gh-secondary { display: flex; align-items: center; gap: 4px; }
  #gh-share-concepts .gh-secondary .gh-button { padding-inline: 5px; font-size: 11px; }
  #gh-share-concepts .gh-status { color: var(--gh-muted); font-size: 11px; padding: 0 18px 12px; }
  #gh-share-concepts .gh-status:empty { display: none; }
  #gh-share-concepts .gh-menu { position: absolute; z-index: 4; inset-block-start: 38px; inset-inline-end: 34px; inline-size: 220px; padding: 6px; background: var(--gh-paper); border: 1px solid var(--gh-line); box-shadow: 0 6px 20px rgb(0 8 20 / 10%); }
  #gh-share-concepts .gh-menu .gh-button { inline-size: 100%; justify-content: start; padding: 9px; border: 0; }
  #gh-share-concepts .gh-menu .gh-wa { color: var(--gh-green); }
  #gh-share-concepts .gh-popover { position: absolute; z-index: 4; inset-block-start: 42px; inset-inline-end: 32px; inline-size: min(525px, calc(100% - 24px)); }
  #gh-share-concepts .gh-popover .gh-panel-body { padding: 14px; }
  #gh-share-concepts .gh-popover .gh-preview { gap: 16px; }
  #gh-share-concepts .gh-drawer { inline-size: 310px; margin-inline-start: auto; }
  #gh-share-concepts .gh-drawer .gh-panel-body { padding: 14px; }
  #gh-share-concepts .gh-drawer .gh-preview { grid-template-columns: 1fr; gap: 12px; }
  #gh-share-concepts .gh-drawer .gh-caption-title { font-size: 13px; margin-block-end: 5px; }
  #gh-share-concepts .gh-drawer .gh-caption p { margin-block-end: 6px; }
  #gh-share-concepts .gh-drawer .gh-links { gap: 3px; }
  #gh-share-concepts .gh-drawer .gh-caption p:last-child { display: none; }
  #gh-share-concepts .gh-drawer .gh-panel-actions { padding: 10px 14px; }
  #gh-share-concepts .gh-drawer .gh-primary { inline-size: 100%; }
  #gh-share-concepts .gh-inline { inline-size: 100%; margin-block: 4px; box-shadow: none; }
  #gh-share-concepts .gh-inline .gh-preview { grid-template-columns: minmax(190px, .6fr) minmax(0, 1fr); gap: 28px; }
  #gh-share-concepts .gh-inline .gh-mat { max-inline-size: 290px; }
  #gh-share-concepts .gh-quick { inline-size: min(480px, 100%); }
  #gh-share-concepts .gh-quick .gh-preview { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  #gh-share-concepts .gh-quick .gh-mat { max-inline-size: 270px; margin-inline: auto; }
  #gh-share-concepts .gh-caption-details summary { font-size: 11px; color: var(--gh-blue); }
  #gh-share-concepts .gh-caption-details[open] .gh-caption { margin-block-start: 10px; }
  #gh-share-concepts .gh-split { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; }
  #gh-share-concepts .gh-split .gh-panel { inline-size: 100%; box-shadow: none; }
  #gh-share-concepts .gh-split .gh-league, #gh-share-concepts .gh-split .gh-facts { display: none; }
  #gh-share-concepts .gh-split .gh-share { margin-inline-start: auto; }
  #gh-share-concepts .gh-bottom { inline-size: 100%; margin-block-start: 34px; }
  #gh-share-concepts .gh-bottom .gh-preview { grid-template-columns: 210px minmax(0, 1fr); gap: 32px; }
  #gh-share-concepts .gh-bottom .gh-ticket { padding: 10px; }
  #gh-share-concepts .gh-image-first { inline-size: 350px; }
  #gh-share-concepts .gh-image-first .gh-preview { grid-template-columns: 1fr; gap: 12px; }
  #gh-share-concepts .gh-image-first .gh-caption-title, #gh-share-concepts .gh-image-first .gh-caption p { display: none; }
  #gh-share-concepts .gh-image-first .gh-links { gap: 4px; }
  #gh-share-concepts .gh-image-first .gh-panel-body { padding: 14px 18px; }
  #gh-share-concepts .gh-image-first .gh-primary { inline-size: 100%; }
  #gh-share-concepts .gh-action-strip { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--gh-paper); border-block-end: 1px solid var(--gh-line); }
  #gh-share-concepts .gh-action-strip span { margin-inline-end: auto; color: var(--gh-muted); font-size: 11px; }
  #gh-share-concepts .gh-sheet { inline-size: min(640px, 100%); }
  #gh-share-concepts .gh-sheet .gh-preview { grid-template-columns: 1fr; gap: 16px; }
  #gh-share-concepts .gh-sheet .gh-ticket { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 0 20px; }
  #gh-share-concepts .gh-sheet .gh-ticket-brand { grid-row: 1 / 3; display: block; border: 0; padding-block: 6px; }
  #gh-share-concepts .gh-sheet .gh-ticket-brand span { display: block; padding-block-start: 10px; }
  #gh-share-concepts .gh-sheet .gh-ticket-item { padding-block: 4px; }
  #gh-share-concepts .gh-sheet .gh-ticket-total { grid-column: 1; grid-row: 3 / 4; align-self: end; }
  #gh-share-concepts .gh-sheet .gh-ticket-footer { grid-column: 1 / -1; margin-block-start: 8px; }
  #gh-share-concepts .gh-sheet .gh-caption-title, #gh-share-concepts .gh-sheet .gh-caption p { display: none; }
  #gh-share-concepts .gh-sheet .gh-links { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  #gh-share-concepts .gh-preview-note { color: var(--gh-muted); font-size: 11px; margin-block-start: 12px; }
  @media (max-width: 820px) {
    #gh-share-concepts .gh-stage { min-block-size: 830px; }
    #gh-share-concepts .gh-account, #gh-share-concepts .gh-facts span:last-child { display: none; }
    #gh-share-concepts .gh-chrome { padding-inline: 14px; gap: 22px; }
    #gh-share-concepts .gh-nav { gap: 14px; }
    #gh-share-concepts .gh-main { padding: 12px; }
    #gh-share-concepts .gh-facts { padding-inline: 0; }
    #gh-share-concepts .gh-league { inline-size: 100px; }
    #gh-share-concepts .gh-layer { padding: 12px; }
  }
  @media (max-width: 620px) {
    #gh-share-concepts .gh-stage { min-block-size: 1150px; }
    #gh-share-concepts .gh-heading { margin-inline-end: 0; flex-wrap: wrap; }
    #gh-share-concepts .gh-chrome { flex-wrap: wrap; padding-block-start: 8px; gap: 6px 16px; }
    #gh-share-concepts .gh-nav { inline-size: 100%; min-block-size: 34px; justify-content: space-between; }
    #gh-share-concepts .gh-nav button { font-size: 11px; }
    #gh-share-concepts .gh-slip-head { flex-wrap: wrap; gap: 5px 10px; }
    #gh-share-concepts .gh-facts { order: 3; flex-basis: 100%; justify-content: start; }
    #gh-share-concepts .gh-share { margin-inline-start: auto; }
    #gh-share-concepts .gh-rank, #gh-share-concepts .gh-league { display: none; }
    #gh-share-concepts .gh-match-table { font-size: 11px; }
    #gh-share-concepts .gh-match-table td { padding: 7px 5px; }
    #gh-share-concepts .gh-time { inline-size: 60px; }
    #gh-share-concepts .gh-next { gap: 14px; flex-wrap: wrap; }
    #gh-share-concepts .gh-preview, #gh-share-concepts .gh-inline .gh-preview, #gh-share-concepts .gh-bottom .gh-preview, #gh-share-concepts .gh-split { grid-template-columns: 1fr; }
    #gh-share-concepts .gh-layer { position: relative; background: transparent; padding: 12px 0; }
    #gh-share-concepts .gh-popover { position: relative; inset: auto; inline-size: 100%; }
    #gh-share-concepts .gh-mat { max-inline-size: 310px; margin-inline: auto; inline-size: 100%; }
    #gh-share-concepts .gh-drawer, #gh-share-concepts .gh-image-first { inline-size: 100%; }
    #gh-share-concepts .gh-sheet .gh-mat { max-inline-size: 100%; }
    #gh-share-concepts .gh-sheet .gh-ticket { grid-template-columns: 1fr; }
    #gh-share-concepts .gh-sheet .gh-ticket-brand, #gh-share-concepts .gh-sheet .gh-ticket-total { grid-row: auto; grid-column: auto; }
    #gh-share-concepts .gh-sheet .gh-ticket-brand { display: flex; }
    #gh-share-concepts .gh-action-strip { flex-wrap: wrap; }
  }
  @media (pointer: coarse) { #gh-share-concepts .gh-button { min-block-size: 44px; } }
</style>
<div id="gh-share-concepts">
  <!--browser-controls-->
  <div class="viz-carousel" aria-label="Desktop slip sharing concepts">
    <section class="gh-stage" data-variant="Compact menu" aria-label="Compact menu concept"></section>
    <section class="gh-stage" data-variant="Centered preview" aria-label="Centered preview concept" hidden></section>
    <section class="gh-stage" data-variant="Slim drawer" aria-label="Slim drawer concept" hidden></section>
    <section class="gh-stage" data-variant="Inline preview" aria-label="Inline preview concept" hidden></section>
    <section class="gh-stage" data-variant="Quick WhatsApp" aria-label="Quick WhatsApp concept" hidden></section>
    <section class="gh-stage" data-variant="Split preview" aria-label="Split preview concept" hidden></section>
    <section class="gh-stage" data-variant="Bottom bar" aria-label="Bottom bar concept" hidden></section>
    <section class="gh-stage" data-variant="Image first" aria-label="Image first concept" hidden></section>
    <section class="gh-stage" data-variant="Quick actions" aria-label="Quick actions concept" hidden></section>
    <section class="gh-stage" data-variant="Minimal sheet" aria-label="Minimal sheet concept" hidden></section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('gh-share-concepts');
  const stages = Array.from(root.querySelectorAll('[data-variant]'));
  const names = stages.map(stage => stage.dataset.variant);
  const preferences = { page: 'Best Slips', appearance: 'Follow app' };
  const states = names.map(() => ({ view: 'preview', collapsed: false, note: '' }));
  const observers = new Map();
  const matches = [
    { teams: 'Arsenal vs Chelsea', league: 'Premier League', time: '18:30', pick: 'Home win', odds: '1.72' },
    { teams: 'Inter Milan vs Napoli', league: 'Serie A', time: '20:00', pick: 'Over 2.5 goals', odds: '1.42' },
    { teams: 'Sporting CP vs Braga', league: 'Primeira Liga', time: '22:15', pick: 'BTTS · Yes', odds: '1.68' }
  ];
  const esc = value => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
  const icon = name => `<i class="gh-icon" data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (label, action, classes = '') => `<button type="button" class="gh-button cursor-interaction ${classes}" data-action="${action}">${label}</button>`;
  const closeButton = () => `<button type="button" class="gh-button gh-quiet cursor-interaction" data-action="close" aria-label="Close sharing">${icon('x')}</button>`;

  function ticket() {
    return `<div class="gh-ticket" role="img" aria-label="Goal Hint slip GH-26K-8F2, three selections, total odds 4.10. Created with Goal Hint.">
      <div class="gh-ticket-brand"><b>Goal Hint</b><span>29 OCT · EAT</span></div>
      ${matches.map(match => `<div class="gh-ticket-item"><small>${match.league} · ${match.time}</small><strong>${match.teams}</strong><div class="gh-ticket-pick"><span>${match.pick}</span><b>${match.odds}</b></div></div>`).join('')}
      <div class="gh-ticket-total"><span>Total odds</span><strong>4.10</strong></div>
      <div class="gh-ticket-footer">Created with Goal Hint · goalhint.com<br>goalhint.com/s/GH-26K-8F2</div>
    </div>`;
  }

  function caption() {
    return `<div class="gh-caption"><div class="gh-caption-title">3 picks. Total odds 4.10.</div><p>My Goal Hint slip.<br>Created with Goal Hint.</p><div class="gh-links"><span>goalhint.com/s/GH-26K-8F2</span><span>goalhint.com</span></div></div>`;
  }

  function actions(i) {
    return `<div class="gh-panel-actions"><div class="gh-secondary">${button(`${icon('download')} Save image`, 'save', 'gh-quiet')}${button(`${icon('copy')} Copy caption`, 'copy', 'gh-quiet')}</div>${button(`${icon('message-circle')} WhatsApp`, 'whatsapp', 'gh-primary')}</div><div class="gh-status" role="status" aria-live="polite">${esc(states[i].note)}</div>`;
  }

  function panel(i, classes = '') {
    const copy = [4, 8].includes(i) ? `<details class="gh-caption-details"><summary class="cursor-interaction">Caption & links</summary>${caption()}</details>` : caption();
    return `<section class="gh-panel ${classes}" role="dialog" aria-label="Share slip on WhatsApp"><div class="gh-panel-head"><h4>Share slip</h4>${closeButton()}</div><div class="gh-panel-body"><div class="gh-preview"><div class="gh-mat">${ticket()}</div>${copy}</div></div>${actions(i)}</section>`;
  }

  function menu() {
    return `<div class="gh-menu" role="dialog" aria-label="Sharing options">${button(`${icon('message-circle')} WhatsApp`, 'preview', 'gh-wa')}${button(`${icon('link')} Copy link`, 'link', 'gh-quiet')}</div>`;
  }

  function slip(i, active = true) {
    const state = states[i];
    const quick = i === 4;
    return `<div class="gh-slip"><div class="gh-slip-head"><span class="gh-slip-name">Slip 1<span class="gh-rank">Top ranked</span></span><div class="gh-facts"><span>Total odds<strong>4.10</strong></span><span>3 selections</span><span>Avg probability<strong>75.8%</strong></span></div><button type="button" class="gh-button gh-share cursor-interaction" data-action="share" aria-expanded="${state.view !== 'closed'}">${icon(quick ? 'message-circle' : 'share-2')}${quick ? 'WhatsApp' : 'Share'}</button><button type="button" class="gh-button gh-collapse gh-quiet cursor-interaction" data-action="collapse" aria-label="${state.collapsed ? 'Expand' : 'Collapse'} selections" aria-expanded="${!state.collapsed}">${icon(state.collapsed ? 'chevron-down' : 'chevron-up')}</button></div>
      <table class="gh-match-table" aria-label="Slip selections" ${state.collapsed ? 'hidden' : ''}><tbody>${matches.map(match => `<tr><td class="gh-time">29 Oct<br>${match.time} EAT</td><td class="gh-league">${match.league}</td><td>${match.teams}</td><td>${match.pick}</td><td class="gh-odds">${match.odds}</td></tr>`).join('')}</tbody></table>
      ${active && state.view === 'menu' && i !== 8 ? menu() : ''}${active && state.view === 'preview' && i === 0 ? panel(i, 'gh-popover') : ''}</div>`;
  }

  function scene(i) {
    const state = states[i];
    const next = `<div class="gh-next">Slip 2 <span>Total odds 3.68</span><span>3 selections</span></div>`;
    if (state.view === 'preview' && i === 5) return `<div class="gh-split"><div>${slip(i, false)}${next}</div>${panel(i, 'gh-drawer')}</div>`;
    const context = slip(i) + next;
    if (state.view === 'menu' && i === 8) return context + `<div class="gh-action-strip"><span>Share slip</span>${button(`${icon('message-circle')} WhatsApp`, 'preview', 'gh-primary')}${button('Save image', 'save', 'gh-quiet')}${button('Copy link', 'link', 'gh-quiet')}</div>`;
    if (state.view !== 'preview' || i === 0) return context;
    if (i === 3) return slip(i, false) + panel(i, 'gh-inline') + next;
    if (i === 6) return context + panel(i, 'gh-bottom');
    if (i === 8) return context + `<div class="gh-action-strip"><span>Sharing options</span>${button('Image & caption', 'preview', 'gh-quiet')}${button('Copy link', 'link', 'gh-quiet')}</div><div class="gh-layer">${panel(i, 'gh-quick')}</div>`;
    const classes = { 1: '', 2: 'gh-drawer', 4: 'gh-quick', 7: 'gh-image-first', 9: 'gh-sheet' };
    return context + `<div class="gh-layer">${panel(i, classes[i] ?? '')}</div>`;
  }

  function render(i) {
    observers.get(i)?.disconnect();
    const builder = preferences.page === 'Slip Builder';
    stages[i].innerHTML = `<div class="gh-heading"><span>DESIGN ${String(i + 1).padStart(2, '0')} / 10</span><h2>${names[i]}</h2></div>
      <div class="gh-app"><header class="gh-chrome"><div class="gh-brand">Goal <em>Hint</em></div><nav class="gh-nav" aria-label="App page">${['Best Slips', 'Matches', 'Slip Builder', 'Performance'].map(page => `<button type="button" class="cursor-interaction" data-page="${page}" ${preferences.page === page ? 'aria-current="page"' : ''} ${['Matches', 'Performance'].includes(page) ? 'disabled' : ''}>${page}</button>`).join('')}</nav><span class="gh-account">EN · EAT</span></header>
      <main class="gh-main"><div class="gh-page-title"><h3>${preferences.page}</h3><span class="gh-meta">Today · 29 October</span></div>${builder ? `<div class="gh-builder"><span>5 slips</span><span>Odds: Any</span><span>Today · All markets</span>${button('Build slips', 'build')}</div>` : ''}<div class="gh-scene">${scene(i)}</div></main></div><div class="gh-preview-note">Design preview · Example slip · Sharing is simulated</div>`;
    if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 15, height: 15 } });
    const stageScene = stages[i].querySelector('.gh-scene');
    const sharingPanel = stageScene.querySelector('.gh-panel');
    if (sharingPanel) {
      const fit = () => {
        if (stages[i].hidden) return;
        stageScene.style.minBlockSize = `${Math.max(550, Math.ceil(sharingPanel.getBoundingClientRect().bottom - stageScene.getBoundingClientRect().top + 18))}px`;
      };
      const observer = new ResizeObserver(fit);
      observer.observe(sharingPanel); observers.set(i, observer); fit();
    }
  }

  function renderAll() {
    root.style.colorScheme = preferences.appearance === 'Follow app' ? '' : preferences.appearance.toLowerCase();
    stages.forEach((stage, i) => render(i));
  }

  function saveState() {
    window.openai?.setWidgetState?.({ modelContent: { page: preferences.page }, privateContent: { version: 2, preferences, states } }).catch(() => {});
  }

  function restore(snapshot) {
    const saved = snapshot?.privateContent;
    if (saved?.version !== 2) return;
    if (['Best Slips', 'Slip Builder'].includes(saved.preferences?.page)) preferences.page = saved.preferences.page;
    if (['Follow app', 'Light', 'Dark'].includes(saved.preferences?.appearance)) preferences.appearance = saved.preferences.appearance;
    if (Array.isArray(saved.states) && saved.states.length === states.length) saved.states.forEach((state, i) => {
      if (['closed', 'menu', 'preview'].includes(state?.view)) states[i].view = state.view;
      if (typeof state?.collapsed === 'boolean') states[i].collapsed = state.collapsed;
    });
  }

  root.addEventListener('click', event => {
    const control = event.target.closest('button');
    const stage = control?.closest('[data-variant]');
    const i = stages.indexOf(stage);
    if (!control || control.disabled || i < 0) return;
    if (['Best Slips', 'Slip Builder'].includes(control.dataset.page)) { preferences.page = control.dataset.page; renderAll(); saveState(); return; }
    const state = states[i];
    const action = control.dataset.action;
    state.note = '';
    switch (action) {
      case 'share': {
        const next = [0, 8].includes(i) ? 'menu' : 'preview';
        state.view = state.view === next ? 'closed' : next;
        break;
      }
      case 'close': state.view = 'closed'; break;
      case 'preview': state.view = 'preview'; break;
      case 'collapse': state.collapsed = !state.collapsed; break;
      case 'save': state.note = 'Preview: slip image ready.'; break;
      case 'copy': state.note = 'Preview: caption and both links ready.'; break;
      case 'link': state.note = 'Example link: goalhint.com/s/GH-26K-8F2'; break;
      case 'whatsapp': state.note = 'Attach the image and paste the caption in WhatsApp.'; break;
      case 'build': state.note = 'Preview: the same sharing works on generated slips.'; break;
    }
    render(i);
    const target = state.view === 'closed' ? '[data-action="share"]' : action === 'share' && state.view === 'menu' ? '[data-action="preview"]' : action === 'preview' || action === 'share' ? '[data-action="close"]' : `[data-action="${action}"]`;
    stages[i].querySelector(target)?.focus({ preventScroll: true });
    if (state.view !== 'preview' && state.note) {
      const notice = document.createElement('div'); notice.className = 'gh-status'; notice.setAttribute('role', 'status'); notice.textContent = state.note; stages[i].querySelector('.gh-scene').append(notice);
    }
    saveState();
  });

  root.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    const i = stages.indexOf(event.target.closest('[data-variant]'));
    if (i < 0) return;
    states[i].view = 'closed'; render(i); stages[i].querySelector('[data-action="share"]')?.focus({ preventScroll: true }); saveState();
  });

  restore(window.openai?.widgetState); renderAll();
  window.addEventListener('openai:set_globals', event => {
    const snapshot = event.detail?.globals?.widgetState;
    if (!snapshot || snapshot.privateContent?.version !== 2) return;
    if (JSON.stringify(snapshot.privateContent) === JSON.stringify({ version: 2, preferences, states })) return;
    restore(snapshot); renderAll();
  });
  if (globalThis.Tweak) {
    const tweak = new globalThis.Tweak({ container: root, onChange: () => { renderAll(); saveState(); } });
    tweak.addSelect(preferences, 'page', { label: 'Page', options: ['Best Slips', 'Slip Builder'] });
    tweak.addSelect(preferences, 'appearance', { label: 'Appearance', options: ['Follow app', 'Light', 'Dark'] });
  }
})();
</script>
