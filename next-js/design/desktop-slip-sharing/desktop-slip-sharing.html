    #gh-share-concepts .gh-menu-left { inset-inline-start: 0; }

</style>
<div id="gh-share-concepts">
  <div class="viz-carousel" aria-label="Desktop slip sharing concepts">
    <section class="gh-stage" data-variant="Header menu" aria-label="Header menu sharing concept"></section>
    <section class="gh-stage" data-variant="Preview dialog" aria-label="Preview dialog sharing concept" hidden></section>
    <section class="gh-stage" data-variant="Right drawer" aria-label="Right drawer sharing concept" hidden></section>
    <section class="gh-stage" data-variant="Inline expansion" aria-label="Inline expansion sharing concept" hidden></section>
    <section class="gh-stage" data-variant="Guided steps" aria-label="Guided steps sharing concept" hidden></section>
    <section class="gh-stage" data-variant="Split workspace" aria-label="Split workspace sharing concept" hidden></section>
    <section class="gh-stage" data-variant="Bottom tray" aria-label="Bottom tray sharing concept" hidden></section>
    <section class="gh-stage" data-variant="Image lightbox" aria-label="Image lightbox sharing concept" hidden></section>
    <section class="gh-stage" data-variant="Export checklist" aria-label="Export checklist sharing concept" hidden></section>
    <section class="gh-stage" data-variant="Share studio" aria-label="Share studio sharing concept" hidden></section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('gh-share-concepts');
  const names = ['Header menu', 'Preview dialog', 'Right drawer', 'Inline expansion', 'Guided steps', 'Split workspace', 'Bottom tray', 'Image lightbox', 'Export checklist', 'Share studio'];
  const descriptions = ['Small header menu and an anchored preview.', 'A centered image and caption dialog.', 'A sharing drawer beside the slip.', 'Sharing opens directly beneath the slip.', 'One decision at a time.', 'The slip and its share preview stay side by side.', 'A full-width sharing tray below the slips.', 'A large image preview with a quiet action bar.', 'A clear save, copy and WhatsApp checklist.', 'Image layout and caption editing in one workspace.'];
  const matches = [
    { home: 'Arsenal', away: 'Chelsea', country: 'England', league: 'Premier League', time: '18:30', pick: 'Home win', market: 'Result', odds: '1.72', probability: '76.2%' },
    { home: 'Inter Milan', away: 'Napoli', country: 'Italy', league: 'Serie A', time: '20:00', pick: 'Over 2.5', market: 'Goals', odds: '1.42', probability: '81.7%' },
    { home: 'Sporting CP', away: 'Braga', country: 'Portugal', league: 'Primeira Liga', time: '22:15', pick: 'Yes', market: 'BTTS', odds: '1.68', probability: '69.4%' }
  ];
  const slipUrl = 'https://goalhint.com/s/GH-26K-8F2';
  const appUrl = 'https://goalhint.com';
  const defaultMessage = 'My Goal Hint slip\n3 selections · Total odds 4.10';
  const preferences = { page: 'Best Slips', footer: 'Created with Goal Hint', appearance: 'Follow app' };
  const states = names.map(() => ({ step: 2, saved: false, copied: false, opened: false, wizard: 'image', format: 'Portrait', message: defaultMessage, collapsed: false, note: '' }));
  const stages = Array.from(root.querySelectorAll('[data-variant]'));
  const sceneObservers = new Map();
  const escape = value => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
  const icon = name => `<i class="gh-icon" data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (label, action, options = '') => `<button type="button" class="gh-button cursor-interaction ${options}" data-action="${action}">${label}</button>`;
  const shareButton = i => `<button type="button" class="gh-button gh-share-trigger cursor-interaction" data-action="share" aria-expanded="${states[i].step > 0}">${icon('share-2')}<span>Share</span></button>`;
  const closeButton = () => `<button type="button" class="gh-button gh-quiet cursor-interaction" data-action="close" aria-label="Close sharing">${icon('x')}</button>`;
  const fixedCaption = () => `View this slip: ${slipUrl}\nExplore Goal Hint: ${appUrl}\n\n${preferences.footer}`;
  const shareCaption = i => `${states[i].message.trim()}\n\n${fixedCaption()}`;

  function ticket(i) {
    const wide = states[i].format === 'Wide';
    return `<div class="gh-ticket ${wide ? 'gh-wide-ticket' : ''}" role="img" aria-label="Slip image preview. Goal Hint. Three selections. Total odds 4.10. Slip ID GH-26K-8F2. ${escape(preferences.footer)}. All match times EAT.">
      <div class="gh-ticket-top"><div class="gh-ticket-brand">Goal Hint</div><div class="gh-ticket-code">SLIP GH-26K-8F2<br>29 OCT 2026 · EAT</div></div>
      <div class="gh-ticket-title"><strong>My match selections</strong><span>3 selections</span></div>
      ${matches.map(m => `<div class="gh-ticket-item"><div class="gh-ticket-meta">${m.league} · 29 Oct · ${m.time} EAT</div><strong>${m.home} vs ${m.away}</strong><div class="gh-ticket-pick"><span>${m.market}: ${m.pick}</span><b>${m.odds}</b></div></div>`).join('')}
      <div class="gh-ticket-total"><span>Total odds</span><strong>4.10</strong></div>
      <div class="gh-ticket-footer">${escape(preferences.footer)}<br><b>goalhint.com</b><br>View slip: goalhint.com/s/GH-26K-8F2</div>
      <div class="gh-ticket-disclaimer">Illustrative selections · Odds at creation · Outcomes are not guaranteed</div>
    </div>`;
  }

  function recipientRoute() {
    return `<div class="gh-recipient-route"><strong>One link to this slip</strong><br>Website on desktop · Installed app on phone, when configured<br><span class="gh-link">goalhint.com/s/GH-26K-8F2</span><br><span class="gh-subtle">Example link for this design</span></div>`;
  }

  function message(i, editable = false) {
    return `<div><label class="gh-label" ${editable ? `for="gh-caption-${i}"` : ''}>${editable ? 'Your note' : 'WhatsApp caption & links'}</label>${editable
      ? `<textarea id="gh-caption-${i}" class="gh-message-edit" data-caption="${i}" aria-label="WhatsApp note for ${names[i]}" maxlength="1500">${escape(states[i].message)}</textarea><span class="gh-label" style="margin-block-start:12px">Included with your note</span><div class="gh-message">${escape(fixedCaption())}</div>`
      : `<div class="gh-message">${escape(shareCaption(i))}</div>`}
      <div class="gh-detail">Image + caption. Your slip ID and both links stay included.</div>${recipientRoute()}</div>`;
  }

  function previewBody(i, editable = false) {
    return `<div class="gh-review-grid"><div><span class="gh-label">Slip image · PNG preview</span><div class="gh-preview-mat">${ticket(i)}</div></div>${message(i, editable)}</div>`;
  }

  function panelHead(i, title = 'Share on WhatsApp', subtitle = 'Slip GH-26K-8F2 · 3 selections · Total odds 4.10') {
    return `<div class="gh-panel-head"><div><h4 id="gh-panel-title-${i}">${title}</h4><p>${subtitle}</p></div>${closeButton()}</div>`;
  }

  function panelActions(i, next = 'Continue to WhatsApp') {
    return `<div class="gh-panel-actions">${button(`${icon('arrow-left')} Back`, 'platforms', 'gh-quiet')}<div class="gh-action-row">${button(`${icon('download')} Save image`, 'save')}${button(`${icon('message-circle')} ${next}`, 'continue', 'gh-wa')}</div></div>`;
  }

  function menu(i) {
    const first = i === 7 ? 'gh-menu-left' : '';
    const content = `<div class="gh-menu-head"><span>Share slip GH-26K-8F2</span>${closeButton()}</div>
      <button type="button" class="gh-option cursor-interaction" data-action="whatsapp">${icon('message-circle')}<span>WhatsApp<small>Slip image + caption + link</small></span>${icon('arrow-up-right')}</button>
      <button type="button" class="gh-option cursor-interaction" data-action="copy-link">${icon('link')}<span>Copy slip link<small>Open this exact slip</small></span></button>
      <div class="gh-menu-footer">More platforms can be added here.</div>`;
    if (i === 1 || i === 4 || i === 9) {
      return `<div class="gh-overlay"><div class="gh-platform-center"><div class="gh-menu" role="dialog" aria-modal="true" aria-label="Choose sharing platform">${content}</div></div></div>`;
    }
    if (i === 3 || i === 5 || i === 6) {
      return `<div class="gh-platform-strip"><span>${icon('share-2')} Share this slip</span><span class="gh-subtle">Image, caption and permanent link</span>${button(`${icon('message-circle')} WhatsApp`, 'whatsapp', 'gh-wa')}${closeButton()}</div>`;
    }
    return `<div class="gh-menu ${first}" role="dialog" aria-label="Share slip options">${content}</div>`;
  }

  function slip(i, includeMenu = true) {
    const state = states[i];
    let action = shareButton(i);
    if (i === 2) action = `<div class="gh-split-button">${button(`${icon('message-circle')} WhatsApp`, 'whatsapp', 'gh-wa gh-share-trigger')}<button type="button" class="gh-button gh-share-trigger cursor-interaction" data-action="share" aria-label="More sharing options">${icon('chevron-down')}</button></div>`;
    if (i === 8) action = `<button type="button" class="gh-button gh-share-trigger cursor-interaction" data-action="share" aria-label="Slip actions including share">${icon('ellipsis')}<span>Actions</span></button>`;
    const early = i === 7 ? action : '';
    const head = `<div class="gh-slip-head"><div class="gh-slip-identity">Slip 1 <span class="gh-rank">Top ranked</span></div>${early}<div class="gh-slip-facts"><span>Total odds<strong>4.10</strong></span><span><strong>3</strong> selections</span><span>Avg probability<strong>75.8%</strong></span></div><div class="gh-head-actions">${i === 7 ? '' : action}<button type="button" class="gh-button gh-collapse gh-quiet cursor-interaction" data-action="collapse" aria-label="${state.collapsed ? 'Expand' : 'Collapse'} slip selections" aria-expanded="${!state.collapsed}">${icon('chevron-up')}</button></div></div>`;
    const rows = `<table class="gh-match-table" aria-label="Slip 1 selections" ${state.collapsed ? 'hidden' : ''}><tbody>${matches.map(m => `<tr><td class="gh-time">29 Oct<br>${m.time} EAT</td><td class="gh-league">${m.country}<br>${m.league}</td><td class="gh-match">${m.home}<small>vs</small>${m.away}</td><td class="gh-pick">${m.market}<br>${m.pick}</td><td class="gh-odd">${m.odds}</td><td class="gh-odd gh-probability">${m.probability}</td><td class="gh-state">Scheduled<br>Pending</td></tr>`).join('')}</tbody></table>`;
    const anchoredMenu = includeMenu && state.step === 1 && [0, 2, 7, 8].includes(i) ? menu(i) : '';
    const anchoredReview = includeMenu && state.step === 2 && i === 0 ? review(i) : '';
    return `<div class="gh-slip">${head}${rows}${anchoredMenu}${anchoredReview}</div>`;
  }

  function checklist(i, exportFirst = false) {
    const state = states[i];
    return `<div class="gh-checklist">
      <div class="gh-check-row" data-done="${state.saved}"><span class="gh-check-number">${state.saved ? '✓' : '1'}</span><div class="gh-check-copy"><strong>Save the slip image</strong><p>PNG · Branding and slip link included</p>${button(`${icon(state.saved ? 'check' : 'download')} ${state.saved ? 'Image ready' : 'Save image'}`, 'save')}</div></div>
      <div class="gh-check-row" data-done="${state.copied}"><span class="gh-check-number">${state.copied ? '✓' : '2'}</span><div class="gh-check-copy"><strong>Copy the caption</strong><p>Your message, app URL and this slip’s link</p>${button(`${icon(state.copied ? 'check' : 'copy')} ${state.copied ? 'Caption ready' : 'Copy caption & links'}`, 'copy')}</div></div>
      <div class="gh-check-row" data-done="${state.opened}"><span class="gh-check-number">${state.opened ? '✓' : '3'}</span><div class="gh-check-copy"><strong>Continue in WhatsApp</strong><p>Choose a chat, attach the image and paste the caption.</p>${button(`${icon('message-circle')} ${state.opened ? 'Handoff preview opened' : 'Open WhatsApp'}`, exportFirst ? 'open-from-checklist' : 'open', 'gh-wa')}</div></div>
    </div>`;
  }

  function review(i) {
    const state = states[i];
    const semantics = `role="dialog" aria-label="${names[i]} share preview"`;
    if (i === 0) return `<div class="gh-panel gh-popover-review" ${semantics}>${panelHead(i)}<div class="gh-panel-body">${previewBody(i)}</div>${panelActions(i)}</div>`;
    if (i === 2) return `<div class="gh-overlay"><div class="gh-panel gh-drawer" ${semantics} aria-modal="true">${panelHead(i)}<div class="gh-panel-body">${previewBody(i)}</div>${panelActions(i)}</div></div>`;
    if (i === 3) return `<div class="gh-panel gh-inline-panel" ${semantics}>${panelHead(i, 'Share this slip', 'WhatsApp · Image and caption ready to review')}<div class="gh-panel-body">${previewBody(i)}</div>${panelActions(i)}</div>`;
    if (i === 4) return `<div class="gh-overlay"><div class="gh-panel" ${semantics} aria-modal="true">${panelHead(i, state.wizard === 'image' ? 'Review your slip image' : 'Review your WhatsApp caption', 'A short guided sharing flow')}<div class="gh-wizard-steps"><span>1 · WhatsApp</span><span class="${state.wizard === 'image' ? 'gh-active' : ''}">2 · Image</span><span class="${state.wizard === 'caption' ? 'gh-active' : ''}">3 · Caption</span></div><div class="gh-panel-body">${state.wizard === 'image' ? `<div class="gh-preview-mat" style="max-inline-size:380px;margin-inline:auto">${ticket(i)}</div>` : message(i, true)}</div><div class="gh-panel-actions">${button(`${icon('arrow-left')} Back`, state.wizard === 'image' ? 'platforms' : 'wizard-back', 'gh-quiet')}${button(state.wizard === 'image' ? `Next: caption ${icon('arrow-right')}` : `${icon('message-circle')} Continue to WhatsApp`, state.wizard === 'image' ? 'wizard-next' : 'continue', 'gh-primary')}</div></div></div>`;
    if (i === 5) return `<div class="gh-workspace"><div>${slip(i, false)}<div class="gh-detail">Original slip · GH-26K-8F2</div>${recipientRoute()}</div><div class="gh-panel" ${semantics}>${panelHead(i)}<div class="gh-panel-body">${previewBody(i)}</div>${panelActions(i)}</div></div>`;
    if (i === 6) return `<div class="gh-panel gh-tray" ${semantics}>${panelHead(i, 'Share Slip 1 on WhatsApp', 'Keep your place in the slip list')}<div class="gh-panel-body">${previewBody(i)}</div>${panelActions(i)}</div>`;
    if (i === 7) return `<div class="gh-overlay"><div class="gh-panel gh-lightbox" ${semantics} aria-modal="true">${panelHead(i, 'Your slip image', 'WhatsApp · GH-26K-8F2')}<div class="gh-preview-mat">${ticket(i)}</div><div class="gh-lightbox-caption">${message(i)}</div>${panelActions(i)}</div></div>`;
    if (i === 8) return `<div class="gh-overlay"><div class="gh-panel" ${semantics} aria-modal="true">${panelHead(i, 'Prepare your WhatsApp share', 'Image + caption + links, in three simple actions')}<div class="gh-panel-body"><div class="gh-review-grid"><div class="gh-preview-mat">${ticket(i)}</div><div>${checklist(i, true)}${recipientRoute()}</div></div></div><div class="gh-panel-actions">${button('Back to platforms', 'platforms', 'gh-quiet')}<span class="gh-subtle">You choose the recipient in WhatsApp.</span></div></div></div>`;
    if (i === 9) return `<div class="gh-overlay"><div class="gh-panel gh-studio" ${semantics} aria-modal="true">${panelHead(i, 'Create your share', 'WhatsApp · Slip GH-26K-8F2')}<div class="gh-panel-body"><div><span class="gh-label">Slip image layout</span><div class="gh-format">${['Portrait', 'Wide'].map(format => `<button type="button" class="gh-button cursor-interaction" data-format="${format}" aria-pressed="${state.format === format}">${format}</button>`).join('')}</div><div class="gh-preview-mat">${ticket(i)}</div></div><div>${message(i, true)}<div class="gh-detail">Branding and links remain on the image.</div></div></div>${panelActions(i)}</div></div>`;
    return `<div class="gh-overlay"><div class="gh-panel" ${semantics} aria-modal="true">${panelHead(i)}<div class="gh-panel-body">${previewBody(i)}</div>${panelActions(i)}</div></div>`;
  }

  function handoff(i) {
    const state = states[i];
    return `<div class="gh-panel gh-handoff" role="region" aria-label="WhatsApp handoff preview">${panelHead(i, 'Ready for WhatsApp', 'Slip image + caption + app URL + slip link')}<div class="gh-panel-body"><div class="gh-review-grid"><div><span class="gh-label">The image you will attach</span><div class="gh-preview-mat">${ticket(i)}</div></div><div><span class="gh-badge">${icon('check')} Share prepared</span>${checklist(i)}<details><summary class="cursor-interaction gh-label">View caption & links</summary><div class="gh-message">${escape(shareCaption(i))}</div></details></div></div></div><div class="gh-status" role="status">${state.opened ? 'WhatsApp handoff preview: choose a chat, attach the saved image, paste the caption and send in WhatsApp.' : 'Desktop flow: save the image and copy the caption, then attach and send them in WhatsApp.'}</div><div class="gh-panel-actions">${button(`${icon('arrow-left')} Back to preview`, 'review', 'gh-quiet')}${button('Return to slip', 'close')}</div></div>`;
  }

  function flowbar(i) {
    return `<div class="gh-flowbar" aria-label="Sharing flow preview">${['Share button', 'WhatsApp', 'Review', 'Handoff'].map((label, step) => `<button type="button" class="gh-button cursor-interaction" data-step="${step}" ${states[i].step === step ? 'aria-current="step"' : ''}>${step + 1} · ${label}${step < 3 ? icon('chevron-right') : ''}</button>`).join('')}${button(`${icon('rotate-ccw')} Restart`, 'restart', 'gh-quiet gh-restart')}</div>`;
  }

  function shell(i) {
    const state = states[i];
    const builder = preferences.page === 'Slip Builder';
    const isSplit = state.step === 2 && i === 5;
    const outsideMenu = state.step === 1 && ![0, 2, 7, 8].includes(i);
    const outsideReview = state.step === 2 && i !== 0;
    return `<div class="gh-caption"><span class="gh-kicker">Desktop concept ${String(i + 1).padStart(2, '0')} / 10</span><h2>${names[i]}</h2></div>${flowbar(i)}
      <div class="gh-app" aria-label="Goal Hint ${names[i]} desktop preview">
        <header class="gh-chrome"><div class="gh-wordmark">${icon('goal')}Goal <em>Hint</em></div><nav class="gh-nav" aria-label="Preview page context">${['Best Slips', 'Matches', 'Slip Builder', 'Performance'].map(page => `<button type="button" class="cursor-interaction" data-page="${page}" ${page === preferences.page ? 'aria-current="page"' : ''} ${page === 'Matches' || page === 'Performance' ? 'disabled' : ''}>${page}</button>`).join('')}</nav><div class="gh-account">EN · EAT ${icon('user-round')}</div></header>
        <div class="gh-content"><div class="gh-page-top"><h3>${preferences.page}</h3><span class="gh-subtle">Thursday, 29 October 2026</span></div>
          ${builder ? `<div class="gh-builder"><label>Slips<span>5</span></label><label>Total odds<span>Min 0.01 — Any</span></label><label>Matches per slip<span>Min 1 — Any</span></label><label>Dates & markets<span>Today · All markets</span></label>${button('Build slips', 'build', 'gh-primary')}</div>` : `<div class="gh-metrics"><span>Yesterday’s selections<strong>8 / 11 correct</strong></span><span>Selection accuracy<strong>72.7%</strong></span><span>Total slips<strong>5</strong></span><span class="gh-subtle">Daily published slips · EAT</span></div>`}
          <div class="gh-results"><span>${builder ? '5 generated slips · Today · All markets' : 'Today’s slips · Highest ranked first'}</span><span>Illustrative data</span></div>
          <div class="gh-scene">
            ${isSplit ? '' : slip(i)}
            ${outsideMenu && ![3, 5, 6].includes(i) ? menu(i) : ''}
            ${outsideMenu && [3, 5, 6].includes(i) ? menu(i) : ''}
            ${!isSplit && !(i === 3 && state.step === 2) ? `<div class="gh-next-slip">Slip 2 <span>Total odds 3.68</span><span>3 selections</span><span>Avg probability 74.1%</span></div><div class="gh-next-slip">Slip 3 <span>Total odds 5.22</span><span>4 selections</span><span>Avg probability 72.6%</span></div>` : ''}
            ${outsideReview ? review(i) : ''}
            ${state.step === 3 ? handoff(i) : ''}
            ${state.note ? `<div class="gh-status" role="status">${escape(state.note)}</div>` : ''}
          </div>
        </div>
      </div><div class="gh-flow-note">${icon('mouse-pointer-2')}<span>${descriptions[i]} Click through the four stages above.</span></div><div class="gh-flow-note"><span>Interactive concept · Sharing, downloads and copying are simulated · Example slip link</span></div>`;
  }

  function refreshIcons() {
    if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 15, height: 15 } });
  }

  function render(i) {
    sceneObservers.get(i)?.disconnect();
    stages[i].innerHTML = shell(i);
    refreshIcons();
    const scene = stages[i].querySelector('.gh-scene');
    const panel = scene.querySelector('.gh-panel');
    if (panel) {
      const fit = () => {
        if (stages[i].hidden) return;
        const height = Math.ceil(panel.getBoundingClientRect().bottom - scene.getBoundingClientRect().top + 28);
        scene.style.minBlockSize = `${Math.max(700, height)}px`;
      };
      const observer = new ResizeObserver(fit);
      observer.observe(panel);
      sceneObservers.set(i, observer);
      fit();
    }
  }

  function renderAll() {
    root.style.colorScheme = preferences.appearance === 'Follow app' ? '' : preferences.appearance.toLowerCase();
    stages.forEach((stage, i) => render(i));
  }

  function persist() {
    if (!window.openai?.setWidgetState) return;
    const snapshot = { modelContent: { page: preferences.page, footer: preferences.footer }, privateContent: { preferences, states } };
    window.openai.setWidgetState(snapshot).catch(() => {});
  }

  function restore(snapshot) {
    const saved = snapshot?.privateContent;
    if (saved?.preferences) {
      const p = saved.preferences;
      if (['Best Slips', 'Slip Builder'].includes(p.page)) preferences.page = p.page;
      if (['Created with Goal Hint', 'Generated with Goal Hint'].includes(p.footer)) preferences.footer = p.footer;
      if (['Follow app', 'Light', 'Dark'].includes(p.appearance)) preferences.appearance = p.appearance;
    }
    if (Array.isArray(saved?.states) && saved.states.length === 10) {
      saved.states.forEach((value, i) => {
        if (!value || typeof value !== 'object') return;
        const state = states[i];
        if ([0, 1, 2, 3].includes(value.step)) state.step = value.step;
        for (const key of ['saved', 'copied', 'opened', 'collapsed']) if (typeof value[key] === 'boolean') state[key] = value[key];
        if (['image', 'caption'].includes(value.wizard)) state.wizard = value.wizard;
        if (['Portrait', 'Wide'].includes(value.format)) state.format = value.format;
        if (typeof value.message === 'string') state.message = value.message.slice(0, 1500);
      });
    }
  }

  root.addEventListener('click', event => {
    const control = event.target.closest('button');
    if (!control || control.disabled) return;
    const section = control.closest('[data-variant]');
    const i = stages.indexOf(section);
    if (i < 0) return;
    const state = states[i];
    state.note = '';
    if (control.dataset.page && ['Best Slips', 'Slip Builder'].includes(control.dataset.page)) {
      preferences.page = control.dataset.page;
      renderAll(); persist(); return;
    }
    if (control.dataset.step !== undefined) state.step = Number(control.dataset.step);
    if (control.dataset.format) state.format = control.dataset.format;
    switch (control.dataset.action) {
      case 'share': state.step = state.step === 1 ? 0 : 1; break;
      case 'whatsapp': state.step = 2; state.wizard = 'image'; break;
      case 'platforms': state.step = 1; break;
      case 'close': state.step = 0; break;
      case 'review': state.step = 2; break;
      case 'continue': state.step = 3; break;
      case 'wizard-next': state.wizard = 'caption'; break;
      case 'wizard-back': state.wizard = 'image'; break;
      case 'save': state.saved = true; state.note = 'Preview: the branded slip image is ready to save.'; break;
      case 'copy': state.copied = true; state.note = 'Preview: the caption includes your message, the app URL and this slip’s link.'; break;
      case 'copy-link': state.note = `Preview slip link: ${slipUrl}`; break;
      case 'open': state.opened = true; break;
      case 'open-from-checklist': state.step = 3; state.opened = true; break;
      case 'collapse': state.collapsed = !state.collapsed; break;
      case 'build': state.note = 'Preview: generated slips use the same sharing component as Best Slips.'; break;
      case 'restart': Object.assign(state, { step: 0, saved: false, copied: false, opened: false, wizard: 'image', collapsed: false, note: '' }); break;
    }
    render(i);
    const selector = control.dataset.step !== undefined ? `[data-step="${control.dataset.step}"]`
      : ['share', 'whatsapp', 'wizard-next', 'wizard-back'].includes(control.dataset.action) && state.step > 0 ? '[data-action="close"]'
      : ['close', 'restart'].includes(control.dataset.action) ? '[data-action="share"]'
      : control.dataset.action ? `[data-action="${control.dataset.action}"]`
      : control.dataset.format ? `[data-format="${control.dataset.format}"]` : null;
    if (selector) stages[i].querySelector(selector)?.focus({ preventScroll: true });
    persist();
  });

  root.addEventListener('input', event => {
    if (!event.target.matches('[data-caption]')) return;
    const i = Number(event.target.dataset.caption);
    states[i].message = event.target.value.slice(0, 1500);
    states[i].copied = false;
    persist();
  });

  root.addEventListener('keydown', event => {
    if (event.key === 'Tab') {
      const modal = event.target.closest('[aria-modal="true"]');
      if (!modal) return;
      const controls = Array.from(modal.querySelectorAll('button:not(:disabled), textarea, select, summary')).filter(control => control.getClientRects().length);
      const first = controls[0], last = controls[controls.length - 1];
      if (event.shiftKey && event.target === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && event.target === last) { event.preventDefault(); first?.focus(); }
      return;
    }
    if (event.key !== 'Escape') return;
    const i = stages.indexOf(event.target.closest('[data-variant]'));
    if (i < 0) return;
    states[i].step = 0; render(i);
    stages[i].querySelector('[data-action="share"]')?.focus({ preventScroll: true });
    persist();
  });

  restore(window.openai?.widgetState);
  renderAll();
  window.addEventListener('openai:set_globals', event => {
    const incoming = event.detail?.globals?.widgetState;
    if (!incoming) return;
    if (JSON.stringify(incoming.privateContent) === JSON.stringify({ preferences, states })) return;
    restore(incoming); renderAll();
  });
  if (globalThis.Tweak) {
    const tweak = new globalThis.Tweak({ container: root, onChange: () => { renderAll(); persist(); } });
    tweak.addSelect(preferences, 'page', { label: 'App page', options: ['Best Slips', 'Slip Builder'] });
    tweak.addSelect(preferences, 'footer', { label: 'Image branding', options: ['Created with Goal Hint', 'Generated with Goal Hint'] });
    tweak.addSelect(preferences, 'appearance', { label: 'Appearance', options: ['Follow app', 'Light', 'Dark'] });
  }
})();
</script>
