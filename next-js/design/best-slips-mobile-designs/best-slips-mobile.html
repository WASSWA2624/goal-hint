    tweak.addSelect(settings,"viewer",{ label: "Preview as", options: [{ label: "Subscriber", value: "subscriber" },{ label: "Free member", value: "member" },{ label: "Guest", value: "guest" }] });
  }
  window.addEventListener("openai:set_globals", event => {
    const next = event.detail?.globals?.widgetState?.privateContent;
    if (!next) return;
    if (["system","light","dark"].includes(next.appearance)) settings.appearance = next.appearance;
    if (["subscriber","member","guest"].includes(next.viewer)) settings.viewer = next.viewer;
    if (settings.viewer !== lastViewer) {
      for (const [phone,state] of states) Object.assign(state,{ period: defaultPeriod(phone), status: "all", page: 1, open: new Set() });
      lastViewer = settings.viewer;
    }
    renderAll();
  });
})();
</script>
