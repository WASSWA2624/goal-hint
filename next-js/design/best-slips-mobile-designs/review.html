<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.ico">
  <title>Best slips · Mobile design review</title>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: Manrope,Arial,sans-serif; background: light-dark(#e9eff5,#070f1e); color: light-dark(#102348,#e6eefb); }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .review-header { position: sticky; top: 0; z-index: 10; background: light-dark(#fff,#111f33); border-bottom: 1px solid light-dark(#d9e3ee,#304057); }
    .review-header-inner { max-width: 920px; margin: auto; padding: 14px 16px; display: grid; gap: 12px; }
    .review-title { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; }
    .review-title h1 { font-size: 18px; line-height: 1.4; margin: 0; font-weight: 700; }
    .review-title p { margin: 0; font-size: 12px; color: light-dark(#51637c,#a8b8cf); }
    .review-controls { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr) minmax(0,1fr); gap: 12px; align-items: end; }
    .review-field { min-width: 0; display: grid; gap: 5px; font-size: 12px; color: light-dark(#51637c,#a8b8cf); }
    .review-design-switcher { display: grid; grid-template-columns: 44px minmax(0,1fr) 44px; gap: 6px; }
    .review-header button, .review-header select { min-height: 44px; min-width: 0; border: 1px solid light-dark(#ccd8e7,#42546e); border-radius: 4px; font: 500 14px/1.4 Manrope,Arial,sans-serif; background: light-dark(#fff,#17283e); color: inherit; }
    .review-header select { width: 100%; padding: 9px 8px; font-size: 16px; }
    .review-header button { cursor: pointer; font-size: 20px; }
    .review-header button:hover { background: light-dark(#eaf2ff,#183454); }
    .review-header button:focus-visible, .review-header select:focus-visible { outline: 2px solid light-dark(#125bc5,#8cbbff); outline-offset: 2px; }
    .review-position { color: light-dark(#125bc5,#8cbbff); font-variant-numeric: tabular-nums; }
    .review-stage { width: 100%; padding-bottom: 20px; }
    .review-stage .gh-phone { scroll-margin-top: 200px; }
    @media (max-width: 620px) {
      .review-controls { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
      .review-field:first-child { grid-column: 1 / -1; }
      .review-title h1 { font-size: 16px; }
      .review-header-inner { padding: 10px 12px; gap: 10px; }
    }
  </style>
</head>
<body>
  <header class="review-header">
    <div class="review-header-inner">
      <div class="review-title">
        <h1>Best slips · Mobile concepts</h1>
        <p>Choose a design or use the arrows · <span id="review-position" class="review-position" aria-live="polite">1 of 10</span></p>
      </div>
      <nav class="review-controls" aria-label="Design navigator">
        <div class="review-field"><label for="review-design">Design</label>
          <span class="review-design-switcher">
            <button type="button" id="review-previous" aria-label="Previous design">←</button>
            <select id="review-design" aria-label="Choose mobile design"></select>
            <button type="button" id="review-next" aria-label="Next design">→</button>
          </span>
        </div>
        <label class="review-field">Appearance
          <select id="review-appearance"><option value="system">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select>
        </label>
        <label class="review-field">Preview as
          <select id="review-viewer"><option value="subscriber">Subscriber</option><option value="member">Free member</option><option value="guest">Guest</option></select>
        </label>
      </nav>
    </div>
  </header>
  <div class="review-stage">
    <!-- BEST_SLIPS_CONCEPTS -->
  </div>
  <script>
    (() => {
      "use strict";
      const root = document.getElementById("best-slips-mobile-concepts");
      const designs = Array.from(root.children).filter(element => element.hasAttribute("data-variant"));
      const picker = document.getElementById("review-design");
      const appearance = document.getElementById("review-appearance");
      const viewer = document.getElementById("review-viewer");
      const position = document.getElementById("review-position");
      const slug = design => design.dataset.variant.toLowerCase().replace(/\s+/g,"-");
      const query = new URLSearchParams(location.search);
      let active = Math.max(0,designs.findIndex(design => slug(design) === query.get("design")));
      designs.forEach((design,index) => picker.add(new Option(`${String(index + 1).padStart(2,"0")} · ${design.dataset.variant}`,String(index))));
      if (["system","light","dark"].includes(query.get("appearance"))) appearance.value = query.get("appearance");
      if (["subscriber","member","guest"].includes(query.get("viewer"))) viewer.value = query.get("viewer");
      function updateUrl() {
        const url = new URL(location.href);
        url.searchParams.set("design",slug(designs[active]));
        url.searchParams.set("appearance",appearance.value);
        url.searchParams.set("viewer",viewer.value);
        history.replaceState(null,"",url);
      }
      function select(index,scroll = true) {
        active = (index + designs.length) % designs.length;
        designs.forEach((design,current) => { design.hidden = current !== active; });
        picker.value = String(active);
        position.textContent = `${active + 1} of ${designs.length}`;
        updateUrl();
        if (scroll) window.scrollTo({ top: 0,behavior: "instant" });
      }
      function preview() {
        document.documentElement.style.colorScheme = appearance.value === "system" ? "light dark" : appearance.value;
        window.dispatchEvent(new CustomEvent("openai:set_globals", { detail: { globals: { widgetState: { privateContent: { appearance: appearance.value,viewer: viewer.value } } } } }));
        updateUrl();
      }
      picker.addEventListener("change",() => select(Number(picker.value)));
      document.getElementById("review-previous").addEventListener("click",() => select(active - 1));
      document.getElementById("review-next").addEventListener("click",() => select(active + 1));
      appearance.addEventListener("change",preview);
      viewer.addEventListener("change",preview);
      document.addEventListener("DOMContentLoaded",() => { if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 18,height: 18 } }); });
      preview();
      select(active,false);
    })();
  </script>
</body>
</html>
