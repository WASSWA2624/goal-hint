<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Goal Hint · Mobile filter preview</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="sample.css" />
    <script type="module" src="sample.js"></script>
  </head>
  <body>
    <header class="brandbar">
      <span class="wordmark">goal<span>hint</span><i></i></span
      ><span class="demo-label">DESIGN PREVIEW</span
      ><button
        class="icon-button"
        data-action="help"
        aria-label="About this preview"
      ></button>
    </header>
    <main id="main">
      <div class="page-heading">
        <h1>Matches</h1>
        <span>Wed, 28 Oct 2026</span>
      </div>
      <section id="filters" aria-label="Find matches"></section>
      <div id="result-summary" class="result-summary" aria-live="polite"></div>
      <section id="matches" aria-label="Sample matches"></section>
      <p class="sample-note">Illustrative matches · Kampala time (UTC+3)</p>
    </main>
    <div id="dock"></div>
    <nav class="bottom-nav" aria-label="App preview">
      <button aria-current="page" data-nav="matches">Matches</button
      ><button data-action="nav" data-nav="slips">Slips</button
      ><button data-action="nav" data-nav="results">Results</button
      ><button data-action="nav" data-nav="account">Account</button>
    </nav>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="editor-form">
        <div class="sheet-head">
          <div>
            <span class="eyebrow" id="editor-kicker">MATCH FILTERS</span>
            <h2 id="editor-title">Refine matches</h2>
          </div>
          <button
            type="button"
            class="icon-button"
            data-action="cancel"
            aria-label="Close without applying"
          ></button>
        </div>
        <div id="editor-body" class="sheet-body"></div>
        <div class="sheet-foot">
          <button type="button" class="button" data-action="reset-section">
            Reset</button
          ><button type="button" class="button" data-action="cancel">
            Cancel</button
          ><button type="submit" class="button primary">Apply</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status" class="toast" hidden></div>
  </body>
</html>
