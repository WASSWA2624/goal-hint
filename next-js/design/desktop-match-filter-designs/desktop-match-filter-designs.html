      if(event.target===c.dialog){ const b=c.dialog.getBoundingClientRect();if(event.clientX<b.left||event.clientX>b.right||event.clientY<b.top||event.clientY>b.bottom)closeDialog(c); }
    });
    c.dialog.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('input')){event.preventDefault();if(event.target.name!=='optionSearch')saveDialog(c);}});
    c.dialog.addEventListener('input',event=>{
      const input=event.target;
      if(input.name==='optionSearch'){let visible=0;c.dialog.querySelectorAll('[data-option]').forEach(item=>{item.hidden=!item.dataset.option.includes(input.value.toLowerCase());if(!item.hidden)visible++;});c.dialog.querySelector('.gh-options-empty').hidden=visible>0;return;}
      if(input.dataset.all){c.edit[c.active]=[];c.dialog.querySelectorAll('[data-option] input').forEach(box=>{box.checked=false;});input.checked=true;return;}
      if(input.type==='checkbox'){ const list=c.edit[c.active];if(!input.checked&&c.active==='markets'&&list.length===1){input.checked=true;return;}c.edit[c.active]=input.checked?[...new Set([...list,input.value])]:list.filter(v=>v!==input.value);const all=c.dialog.querySelector('[data-all]');if(all)all.checked=c.edit[c.active].length===0; }
      else if(input.name in c.edit){c.edit[input.name]=input.value;if(['from','to'].includes(input.name))c.edit.period='Custom dates';if(input.name==='timeFrom'&&!input.value)c.edit.timeFrom='00:00';if(input.name==='timeTo'&&!input.value)c.edit.timeTo='23:59';}
    });
    if(globalThis.Tweak){const settings={height:32};const tweak=new Tweak({container:c.product,onChange:()=>c.product.style.setProperty('--gh-control-height',settings.height+'px')});tweak.addSlider(settings,'height',{label:'Control height',min:28,max:36,step:2,unit:'px'});}
  }
  root.querySelectorAll('[data-variant]').forEach(mount);
  globalThis.addEventListener('openai:set_globals',event=>{
    const values=event.detail?.globals?.widgetState?.privateContent?.concepts;
    if(!values)return;
    contexts.forEach(c=>{const s=values[c.name];if(isValidState(s?.draft)&&isValidState(s?.applied)&&(JSON.stringify(c.draft)!==JSON.stringify(s.draft)||JSON.stringify(c.applied)!==JSON.stringify(s.applied))){c.draft={...defaults(),...s.draft};c.applied={...defaults(),...s.applied};renderPanel(c);renderResults(c);}});
  });
})();
</script>
