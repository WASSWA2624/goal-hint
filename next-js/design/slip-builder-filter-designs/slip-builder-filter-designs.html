<div id="gh-builder-samples">
  <div class="viz-carousel viz-dotted-background" aria-label="Slip Builder filter designs">
    <section class="sb-stage" data-variant="Compact toolbar" aria-label="Compact toolbar"></section>
    <section class="sb-stage" data-variant="Visible field grid" aria-label="Visible field grid" hidden></section>
    <section class="sb-stage" data-variant="Range ledger" aria-label="Range ledger" hidden></section>
    <section class="sb-stage" data-variant="Editable summary cells" aria-label="Editable summary cells" hidden></section>

<script>
(() => {
  const root = document.getElementById("gh-builder-samples");
  const today = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Africa/Kampala", year: "numeric", month: "2-digit", day: "2-digit"
  }).format(new Date());
  const defaults = {
    count: "5", totalMin: "0.01", totalMax: "", matchesMin: "1", matchesMax: "",
    oddsMin: "0.01", oddsMax: "", probMin: "", probMax: "100",
    dateFrom: today, dateTo: today, timeFrom: "00:00", timeTo: "23:59",
    marketResult: true, marketDouble: true, marketGoals: true, marketBtts: true,
    outcomeResult: "Automatic", outcomeDouble: "Automatic", outcomeGoals: "Automatic", outcomeBtts: "Automatic", reuse: false
  };
  const concepts = [
    ["Compact toolbar", "Two quiet rows; closest to the Matches filters."],
    ["Visible field grid", "All settings exposed in a compact, labeled grid."],
    ["Range ledger", "Aligned minimum and maximum columns for easy scanning."],
    ["Editable summary cells", "Tap any value group to edit it in place."],
    ["Essentials plus expand", "Frequent settings first; refinements expand below."],
    ["Grouped tabs", "A shared editing area for four small groups."],
    ["Summary accordions", "Readable group summaries with inline expansion."],
    ["Inline builder sentence", "Slips, matches and odds read as one instruction."],
    ["Side-tab editor", "A compact vertical index beside the active group."],
    ["Quiet settings header", "A short criteria summary with one complete editor."]
  ];
  const markets = [
    ["Result", "Match result", ["Home", "Draw", "Away"]],
    ["Double", "Double chance", ["1X", "X2", "12"]],
    ["Goals", "Total goals 2.5", ["Over", "Under"]],
    ["Btts", "Both teams score", ["Yes", "No"]]
  ];
  const settings = { access: "Subscriber", phoneWidth: 340 };
  const states = concepts.map(() => ({ ...defaults }));
  const escape = (value) => String(value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
  const actionLabel = () => ({ "Signed out": "Sign in", "No subscription": "Subscribe", Subscriber: "Build slips" })[settings.access];
  const input = (key, label, value, options = "") =>
    '<input data-key="' + key + '" aria-label="' + escape(label) + '" value="' + escape(value) + '" ' + options + '>';
  const number = (key, label, state, min = "0.01", step = "0.01", placeholder = "Any") =>
    input(key, label, state[key], 'type="number" inputmode="' + (step === "1" ? "numeric" : "decimal") + '" min="' + min + '" step="' + step + '" placeholder="' + placeholder + '"' + (key.startsWith("prob") ? ' max="100"' : ""));
  function count(state) {
    return '<label class="sb-field"><span>Number of slips</span>' + number("count", "Number of slips", state, "1", "1", "5") + '</label>';
  }
  function bounds(prefix, label, state, min = "0.01", step = "0.01") {
    return '<div class="sb-bounds"><label class="sb-bound"><span>Min</span>' +
      number(prefix + "Min", label + " minimum", state, min, step, prefix === "prob" ? "Any" : min) +
      '</label><label class="sb-bound"><span>Max</span>' +
      number(prefix + "Max", label + " maximum", state, min, step) + '</label></div>';
  }
  function range(prefix, label, state, min, step) {
    return '<fieldset class="sb-range"><legend>' + label + '</legend>' + bounds(prefix, label, state, min, step) + '</fieldset>';
  }
  function essentials(state) {
    return '<div class="sb-essentials">' + count(state) +
      range("total", "Total odds / slip", state, "0.01", "0.01") +
      range("matches", "Matches / slip", state, "1", "1") + '</div>';
  }
  function limits(state) {
    return '<div class="sb-two">' + range("odds", "Individual odds", state, "0.01", "0.01") +
      range("prob", "Match probability %", state, "0", "0.01") + '</div>';
  }
  function dates(state) {
    return '<fieldset class="sb-date-group"><legend>Match date &amp; time · EAT</legend><div class="sb-dates">' +
      ["From", "To"].map((suffix) => '<div class="sb-field"><span>' + suffix + '</span><div class="sb-date-line">' +
        input("date" + suffix, suffix + " date", state["date" + suffix], 'type="date" required') +
        input("time" + suffix, suffix + " time EAT", state["time" + suffix], 'type="time" required') + '</div></div>').join("") +
      '</div></fieldset>';
  }
  function marketFields(state) {
    return '<fieldset class="sb-market-group"><legend>Markets &amp; results</legend><div class="sb-market-list">' +
      markets.map(([key, name, options]) => '<div class="sb-market"><label class="sb-check"><input type="checkbox" data-key="market' + key +
        '" ' + (state["market" + key] ? "checked" : "") + '><span>' + name + '</span></label>' +
        '<details class="sb-market-picker"><summary class="cursor-interaction" aria-label="' + name + ' results"><span data-outcome-summary="' + key + '">' +
        escape(state["outcome" + key]) + '</span></summary><div class="sb-market-options"><button type="button" class="sb-button cursor-interaction" data-auto="' + key + '"' +
        (state["market" + key] ? "" : " disabled") + '>Automatic</button>' +
        options.map((value) => '<label class="sb-check"><input type="checkbox" data-key="outcome' + key + '" data-choice="' + value + '"' +
          (state["outcome" + key].split(", ").includes(value) ? " checked" : "") + (state["market" + key] ? "" : " disabled") + '>' + value + '</label>').join("") +
        '</div></details></div>').join("") +
      '</div><label class="sb-check sb-reuse"><input type="checkbox" data-key="reuse" ' + (state.reuse ? "checked" : "") + '>Reuse matches across slips</label></fieldset>';
  }
  function allFields(state) {
    return '<div class="sb-stack">' + essentials(state) + limits(state) + dates(state) + marketFields(state) + '</div>';
  }
  function actions() {
    return '<div class="sb-actions"><button type="button" class="sb-button sb-quiet cursor-interaction" data-action="reset">Reset</button>' +
      '<button type="button" class="sb-button sb-primary cursor-interaction" data-action="build">' + actionLabel() + '</button></div>';
  }
  function footer(hint = "Blank max = Any · Blank min = lowest") {
    return '<div class="sb-actions-row"><span class="sb-hint">' + hint + '</span>' + actions() + '</div>';
  }
  function trigger(group, text) {
    return '<button type="button" class="sb-button cursor-interaction" data-edit="' + group + '" aria-expanded="false">' + text + ' <span aria-hidden="true">⌄</span></button>';
  }
  function refinements(withActions = true) {
    return '<div class="sb-refinements">' + trigger("limits", "Odds &amp; probability") + trigger("dates", "Date &amp; time") +
      trigger("markets", "Markets · Auto") + (withActions ? actions() : "") + '</div><div class="sb-editor" data-editor hidden></div>';
  }
  function disclose(label, content, open = false) {
    return '<details class="sb-disclosure"' + (open ? " open" : "") + '><summary class="cursor-interaction">' + label +
      '</summary><div class="sb-disclosure-content">' + content + '</div></details>';
  }
  function summaries(state) {
    const bounded = (prefix, minimum, suffix = "") => (state[prefix + "Min"] || minimum) + "–" + (state[prefix + "Max"] || "Any") + suffix;
    const selected = markets.filter(([key]) => state["market" + key]).length;
    const auto = markets.every(([key]) => !state["market" + key] || state["outcome" + key] === "Automatic");
    const date = state.dateFrom === today && state.dateTo === today ? "Today" :
      state.dateFrom === state.dateTo ? state.dateFrom : state.dateFrom + " → " + state.dateTo;
    return {
      setup: (state.count || "5") + " slips · " + bounded("total", "0.01") + " total odds · " + bounded("matches", "1") + " matches",
      count: (state.count || "5") + " slips",
      total: bounded("total", "0.01"),
      matches: bounded("matches", "1"),
      limits: "Odds " + bounded("odds", "0.01") + " · Probability " + bounded("prob", "Any", "%"),
      dates: date + " · " + state.timeFrom + "–" + state.timeTo,
      markets: selected + " markets · " + (auto ? "Auto" : "Custom") + (state.reuse ? " · Reuse on" : ""),
      all: (state.count || "5") + " slips · " + date + " · " + selected + " markets · " + (auto ? "Auto" : "Custom")
    };
  }
  function summary(key, state) {
    return '<span data-summary="' + key + '">' + escape(summaries(state)[key]) + '</span>';
  }
  function tabs(state, vertical = false) {
    const groups = [["setup", "Slip setup"], ["limits", "Odds & probability"], ["dates", "Date & time"], ["markets", "Markets"]];
    return (vertical ? '<div class="sb-side-editor">' : '<div>') +
      '<div class="sb-tabs" role="group" aria-label="Settings groups">' +
      groups.map(([key, name], index) => '<button type="button" class="sb-button sb-tab cursor-interaction" data-tab="' + key +
        '" aria-pressed="' + (index === 0) + '">' + name + '</button>').join("") +
      '</div>' + groups.map(([key], index) => '<div class="sb-tab-pane" data-pane="' + key + '"' + (index ? " hidden" : "") + '>' +
        ({ setup: essentials, limits, dates, markets: marketFields })[key](state) + '</div>').join("") + '</div>';
  }
  function layout(index, state) {
    if (index === 0) return essentials(state) + refinements() + '<div class="sb-summary">' + summary("dates", state) + ' · ' + summary("markets", state) + '</div>';
    if (index === 1) return '<div class="sb-stack">' + essentials(state) + limits(state) + dates(state) + marketFields(state) + '</div>' + footer();
    if (index === 2) return '<div class="sb-row">' + count(state) + '</div><table class="sb-ledger"><thead><tr><th scope="col">Setting</th><th scope="col">Minimum</th><th scope="col">Maximum</th></tr></thead><tbody>' +
      [["total", "Total odds / slip", "0.01", "0.01"], ["matches", "Matches / slip", "1", "1"], ["odds", "Individual odds", "0.01", "0.01"], ["prob", "Probability %", "0", "0.01"]].map(([key, label, min, step]) =>
        '<tr><td>' + label + '</td><td>' + number(key + "Min", label + " minimum", state, min, step, key === "prob" ? "Any" : min) + '</td><td>' +
        number(key + "Max", label + " maximum", state, min, step) + '</td></tr>').join("") + '</tbody></table>' +
      disclose("Match date & time · EAT · " + summary("dates", state), dates(state)) +
      disclose("Markets & results · " + summary("markets", state), marketFields(state)) + footer();
    if (index === 3) return '<div class="sb-cells">' +
      [["count", "Number of slips", "count"], ["total", "Total odds / slip", "total"], ["matches", "Matches / slip", "matches"], ["limits", "Odds & probability", "limits"], ["dates", "Date & time · EAT", "dates"], ["markets", "Markets & results", "markets"]].map(([key, label, group]) =>
        '<button type="button" class="sb-cell cursor-interaction" data-edit="' + group + '" aria-expanded="false"><span>' + label + '</span><strong>' +
        summary(key, state) + '</strong></button>').join("") + '</div><div class="sb-editor" data-editor hidden></div>' + footer();
    if (index === 4) return essentials(state) + disclose("Odds, probability, dates & markets", '<div class="sb-stack">' + limits(state) + dates(state) + marketFields(state) + '</div>') +
      '<div class="sb-summary">' + summary("dates", state) + ' · ' + summary("markets", state) + '</div>' + footer();
    if (index === 5) return tabs(state) + '<div class="sb-summary">' + summary("all", state) + '</div>' + footer();
    if (index === 6) return '<div class="sb-accordion">' + [
      ["Slip setup", "setup", essentials(state), true], ["Odds & probability", "limits", limits(state), false],
      ["Match date & time · EAT", "dates", dates(state), false], ["Markets & results", "markets", marketFields(state), false]
    ].map(([name, key, content, open]) => '<details' + (open ? " open" : "") + '><summary class="cursor-interaction"><span>' + name + '<small>' +
      summary(key, state) + '</small></span></summary><div class="sb-disclosure-content">' + content + '</div></details>').join("") + '</div>' + footer();
    if (index === 7) return '<div class="sb-sentence">Build <span class="sb-count">' + number("count", "Number of slips", state, "1", "1", "5") +
      '</span> slips</div><div class="sb-sentence-line"><span>With matches per slip</span><div class="sb-sentence-range">' +
      bounds("matches", "Matches per slip", state, "1", "1") + '</div></div><div class="sb-sentence-line"><span>And total odds per slip</span><div class="sb-sentence-range">' +
      bounds("total", "Total odds per slip", state, "0.01", "0.01") + '</div></div>' + refinements(false) + footer();
    if (index === 8) return '<div class="sb-quiet-title">' + summary("all", state) + '</div>' + tabs(state, true) + footer();
    return '<div class="sb-quiet-title">' + summary("count", state) + '<span class="sb-hint">·</span>' + summary("dates", state) +
      '</div><div class="sb-scope"><span>Total odds ' + summary("total", state) + '</span><span>Matches ' + summary("matches", state) + '</span><span>' +
      summary("markets", state) + '</span></div>' + disclose("Edit all settings", allFields(state)) + footer();
  }
  function product(index, phone) {
    const state = states[index];
    return '<div class="sb-frame"><div class="sb-device"><span>' + (phone ? 'Mobile · <span data-phone-size>340</span> px' : "Desktop") +
      '</span><span data-height></span></div><div class="sb-product ' + (phone ? "sb-phone" : "sb-desktop") + '" data-concept="' + index + '" data-device="' + (phone ? "mobile" : "desktop") + '">' +
      '<header class="sb-chrome"><div class="sb-wordmark">Goal<span>Hint</span></div><div class="sb-nav"><span>Matches</span><b>Slip Builder</b></div></header>' +
      '<div class="sb-main"><h3 class="sb-page-title">Slip Builder</h3><section class="sb-panel" aria-label="Slip Builder settings">' + layout(index, state) +
      '<p class="sb-feedback" aria-live="polite" hidden></p></section>' +
      '<div class="sb-result"><div class="sb-result-header"><span>Generated slips</span><span>Preview</span></div><div class="sb-result-body">Your slips appear here after building.</div></div></div></div></div>';
  }
  const stages = [...root.querySelectorAll("[data-variant]")];
  stages.forEach((stage, index) => {
    stage.innerHTML = '<div class="sb-caption"><h2>' + String(index + 1).padStart(2, "0") + ' · ' + concepts[index][0] +
      '</h2><p>' + concepts[index][1] + '</p></div><div class="sb-pair">' + product(index, false) + product(index, true) + '</div>';
    stage.querySelectorAll("[data-concept]").forEach((product) => {
      const editor = product.querySelector("[data-editor]");
      if (!editor) return;
      editor.id = "sb-editor-" + index + "-" + product.dataset.device;
      product.querySelectorAll("[data-edit]").forEach((button) => { button.setAttribute("aria-controls", editor.id); });
    });
  });
  function save() {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: { preview: "Slip Builder filters", access: settings.access },
        privateContent: { access: settings.access, phoneWidth: settings.phoneWidth }
      }).catch(() => {});
    }
  }
  function measure() {
    root.querySelectorAll(".sb-product").forEach((product) => {
      if (product.getBoundingClientRect().width) product.closest(".sb-frame").querySelector("[data-height]").textContent =
        Math.round(product.querySelector(".sb-panel").getBoundingClientRect().height) + " px settings";
    });
  }
  function appearance() {
    root.style.setProperty("--sb-phone-width", settings.phoneWidth + "px");
    root.querySelectorAll("[data-phone-size]").forEach((element) => { element.textContent = settings.phoneWidth; });
    root.querySelectorAll('[data-action="build"]').forEach((button) => { button.textContent = actionLabel(); });
    requestAnimationFrame(measure);
  }
  function restore(saved) {
    const value = saved && saved.privateContent;
    if (!value) return;
    if (["Signed out", "No subscription", "Subscriber"].includes(value.access)) settings.access = value.access;
    if (Number.isFinite(value.phoneWidth) && value.phoneWidth >= 320 && value.phoneWidth <= 430) settings.phoneWidth = value.phoneWidth;
    appearance();
  }
  restore(window.openai && window.openai.widgetState);
  window.addEventListener("openai:set_globals", (event) => restore(event.detail && event.detail.globals && event.detail.globals.widgetState));
  function refresh(index) {
    const state = states[index];
    const values = summaries(state);
    root.querySelectorAll('[data-concept="' + index + '"]').forEach((product) => {
      product.querySelectorAll("[data-key]").forEach((field) => {
        if (field.dataset.choice) field.checked = state[field.dataset.key].split(", ").includes(field.dataset.choice);
        else if (field.type === "checkbox") field.checked = state[field.dataset.key];
        else if (field !== document.activeElement) field.value = state[field.dataset.key];
        if (field.dataset.key.startsWith("outcome")) field.disabled = !state["market" + field.dataset.key.slice(7)];
      });
      product.querySelectorAll("[data-summary]").forEach((element) => { element.textContent = values[element.dataset.summary]; });
      product.querySelectorAll("[data-outcome-summary]").forEach((element) => { element.textContent = state["outcome" + element.dataset.outcomeSummary]; });
      product.querySelectorAll("[data-auto]").forEach((button) => { button.disabled = !state["market" + button.dataset.auto]; });
      const marketTrigger = product.querySelector('[data-edit="markets"].sb-button');
      if (marketTrigger) marketTrigger.firstChild.textContent = "Markets · " + (values.markets.includes("Custom") ? "Custom " : "Auto ");
    });
    requestAnimationFrame(measure);
  }
  root.addEventListener("input", (event) => {
    const field = event.target.closest("[data-key]");
    if (!field) return;
    const index = Number(field.closest("[data-concept]").dataset.concept);
    if (field.dataset.choice) {
      const existing = states[index][field.dataset.key].split(", ").filter((value) => value !== "Automatic" && value !== field.dataset.choice);
      if (field.checked) existing.push(field.dataset.choice);
      states[index][field.dataset.key] = existing.length ? existing.join(", ") : "Automatic";
    } else {
      states[index][field.dataset.key] = field.type === "checkbox" ? field.checked : field.value;
    }
    refresh(index);
  });
  root.addEventListener("change", (event) => {
    if (event.target.matches("select[data-key]")) event.target.dispatchEvent(new Event("input", { bubbles: true }));
  });
  function feedback(product, message, error = false) {
    const element = product.querySelector(".sb-feedback");
    element.textContent = message; element.hidden = false; element.dataset.error = error;
  }
  function validate(product, state) {
    for (const field of product.querySelectorAll("input[data-key]")) {
      if (!field.checkValidity()) return field.validationMessage;
    }
    if (!state.count || !Number.isInteger(Number(state.count)) || Number(state.count) < 1) return "Enter a whole number of slips, at least 1.";
    for (const [prefix, floor, label] of [["total", .01, "Total odds"], ["matches", 1, "Matches"], ["odds", .01, "Individual odds"], ["prob", 0, "Probability"]]) {
      const lower = state[prefix + "Min"] === "" ? floor : Number(state[prefix + "Min"]);
      const upper = state[prefix + "Max"] === "" ? Infinity : Number(state[prefix + "Max"]);
      if (lower < floor || upper < floor || lower > upper) return label + ": minimum must not exceed maximum.";
      if (prefix === "prob" && (lower > 100 || (upper !== Infinity && upper > 100))) return "Probability must be between 0 and 100%.";
      if (prefix === "matches" && (!Number.isInteger(lower) || (upper !== Infinity && !Number.isInteger(upper)))) return "Matches must use whole numbers, at least 1.";
    }
    if (!state.dateFrom || !state.dateTo || !state.timeFrom || !state.timeTo) return "Choose both dates and both times.";
    if (state.dateFrom > state.dateTo || state.timeFrom > state.timeTo) return "From values must not exceed To values.";
    if (!markets.some(([key]) => state["market" + key])) return "Keep at least one market selected.";
    return "";
  }
  root.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    const product = button.closest("[data-concept]");
    if (!product) return;
    const index = Number(product.dataset.concept);
    const state = states[index];
    if (button.dataset.auto) {
      state["outcome" + button.dataset.auto] = "Automatic";
      refresh(index);
    }
    if (button.dataset.edit) {
      const editor = product.querySelector("[data-editor]");
      const closing = editor.dataset.group === button.dataset.edit && !editor.hidden;
      product.querySelectorAll("[data-edit]").forEach((trigger) => {
        const active = trigger === button && !closing;
        trigger.setAttribute("aria-expanded", String(active));
        if (trigger.classList.contains("sb-cell")) trigger.setAttribute("aria-pressed", String(active));
      });
      editor.hidden = closing;
      if (!closing) {
        const key = button.dataset.edit;
        const content = {
          setup: () => essentials(state), count: () => count(state),
          total: () => range("total", "Total odds / slip", state, "0.01", "0.01"),
          matches: () => range("matches", "Matches / slip", state, "1", "1"),
          limits: () => limits(state), dates: () => dates(state), markets: () => marketFields(state)
        }[key]();
        editor.dataset.group = key;
        editor.innerHTML = '<div class="sb-editor-title"><span>' +
          ({ count: "Number of slips", total: "Total odds / slip", matches: "Matches / slip", limits: "Odds & probability", dates: "Match date & time · EAT", markets: "Markets & results" })[key] +
          '</span><button type="button" class="sb-button sb-quiet cursor-interaction" data-action="close">Done</button></div>' + content;
        const field = editor.querySelector("input:not(:disabled), select:not(:disabled)");
        if (field) field.focus();
      }
    }
    if (button.dataset.tab) {
      const parent = button.closest(".sb-side-editor") || button.closest(".sb-tabs").parentElement;
      parent.querySelectorAll("[data-tab]").forEach((tab) => { tab.setAttribute("aria-pressed", String(tab === button)); });
      parent.querySelectorAll("[data-pane]").forEach((pane) => { pane.hidden = pane.dataset.pane !== button.dataset.tab; });
    }
    if (button.dataset.action === "close") {
      const editor = button.closest("[data-editor]");
      const trigger = product.querySelector('[data-edit="' + editor.dataset.group + '"]');
      editor.hidden = true;
      trigger.setAttribute("aria-expanded", "false");
      if (trigger.hasAttribute("aria-pressed")) trigger.setAttribute("aria-pressed", "false");
      trigger.focus();
    }
    if (button.dataset.action === "reset") {
      states[index] = { ...defaults };
      refresh(index);
      root.querySelectorAll('[data-concept="' + index + '"] .sb-feedback').forEach((element) => { element.hidden = true; });
    }
    if (button.dataset.action === "build") {
      if (settings.access !== "Subscriber") {
        feedback(product, settings.access === "Signed out" ? "Preview: opens Sign in, with access to Sign up." : "Preview: opens subscription options.");
      } else {
        const error = validate(product, state);
        feedback(product, error || "Preview: ready to build " + state.count + " slips with these settings.", Boolean(error));
      }
    }
    requestAnimationFrame(measure);
  });
  root.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    const product = event.target.closest("[data-concept]");
    const editor = product && product.querySelector("[data-editor]:not([hidden])");
    if (editor) editor.querySelector('[data-action="close"]').click();
  });
  root.addEventListener("toggle", () => requestAnimationFrame(measure), true);
  new ResizeObserver(measure).observe(root);
  new MutationObserver(() => requestAnimationFrame(measure)).observe(root.querySelector(".viz-carousel"), { attributes: true, attributeFilter: ["hidden"], subtree: true });
  appearance();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: () => { appearance(); save(); } });
    tweak.addSelect(settings, "access", { label: "Account state", options: ["Subscriber", "Signed out", "No subscription"] });
    tweak.addSlider(settings, "phoneWidth", { label: "Mobile width", min: 320, max: 430, step: 10, unit: "px" });
  }
})();
</script>
