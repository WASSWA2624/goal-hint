    ['overview', 'Overview', 'layout-dashboard'], ['subscription', 'Subscription', 'badge-check'],
    ['payments', 'Payments', 'credit-card'], ['phone', 'Change phone', 'smartphone'],
    ['password', 'Change password', 'lock-keyhole'], ['devices', 'Devices', 'monitor'],
    ['notifications', 'Notifications', 'bell'], ['activity', 'Activity', 'history'],
  ];
  const states = new Map();
  const esc = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
  const icon = name => `<i class="gh-icon" data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (text, view, primary = false) => `<button type="button" class="gh-button cursor-interaction${primary ? ' gh-primary' : ''}" data-open="${view}">${text}</button>`;
  const link = (text, view) => `<button type="button" class="gh-link cursor-interaction" data-open="${view}">${text}</button>`;
  const submitButton = text => `<button class="gh-button gh-primary cursor-interaction" type="button" data-preview-submit>${text}</button>`;
  const active = '<span class="gh-status">Active</span>';
  const facts = (items, extra = '') => `<dl class="gh-facts ${extra}">${items.map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
  const subscriptionFacts = (showStatus = true) => facts([['Package', 'Weekly'], ...(showStatus ? [['Status', active]] : []), ['Expires', '7 Nov 2026<small>13:00 EAT</small>'], ['Time left', '6 days']], 'gh-sub-facts');
  const profileFacts = phone => facts([['Phone', esc(phone)], ['Devices', '1 signed in'], ['WhatsApp updates', 'Enabled'], ['Account credit', 'UGX 2,000']]);
  const record = (label, value, action, view) => `<div class="gh-record"><span>${label}</span><strong>${value}</strong>${link(action, view)}</div>`;
  const activity = () => '<ol class="gh-activity"><li><span>Payment approved · Weekly</span><small>31 Oct</small></li><li><span>Subscription renewed</span><small>31 Oct</small></li></ol>';
  const title = (text, action = '', sub = '') => `<div class="gh-page-head"><div><h1>${text}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${action}</div>`;
  const panel = (name, body, action = '') => `<section class="gh-panel gh-pad"><div class="gh-section-title"><h2 style="font:inherit">${name}</h2>${action}</div>${body}</section>`;
  const overview = [
    phone => `<div class="gh-overview">${panel('Subscription', facts([['Package', 'Weekly'], ['Expires', '7 Nov 2026<small>13:00 EAT</small>'], ['Time left', '6 days']], 'gh-sub-facts'), active)}${panel('Sign-in details', profileFacts(phone), link('Edit phone', 'phone'))}<div class="gh-actions">${button('Change phone', 'phone')}${button('Change password', 'password')}${link('View activity', 'activity')}</div></div>`,
    phone => `<div class="gh-overview"><section class="gh-panel gh-pad gh-plan-summary"><div class="gh-section-title"><span>Subscription</span>${active}</div><div class="gh-plan-name">Weekly</div><hr class="gh-divider">${facts([['Expires', '7 Nov 2026'], ['Time left', '6 days']])}<div class="gh-actions" style="margin-top:24px">${button('Renew', 'subscription', true)}${link('Details', 'subscription')}</div></section>${panel('Recent activity', activity(), link('View all', 'activity'))}<div class="gh-wide">${panel('Account details', profileFacts(phone), link('Edit phone', 'phone'))}</div></div>`,
    phone => `<div class="gh-overview"><div class="gh-strip">${facts([['Package', 'Weekly']])}${facts([['Expires', '7 Nov 2026']])}${facts([['Time left', '6 days']])}</div><section class="gh-panel gh-pad">${record('Phone', esc(phone), 'Change', 'phone')}${record('Password', '••••••••', 'Change', 'password')}${record('Devices', '1 signed in', 'Manage', 'devices')}${record('WhatsApp', 'Enabled', 'Edit', 'notifications')}${record('Account credit', 'UGX 2,000', 'Payments', 'payments')}</section></div>`,
    phone => `<div class="gh-stack"><div class="gh-identity"><div><span class="gh-eyebrow">Your phone</span><strong>${esc(phone)}</strong></div>${button('Change phone', 'phone')}</div><div class="gh-two">${panel('Membership', `${subscriptionFacts(false)}<hr class="gh-divider">${link('Renew subscription', 'subscription')}`, active)}${panel('Sign-in & preferences', `<div class="gh-account-tools">${record('Password', 'Set', 'Change', 'password')}${record('Devices', '1 signed in', 'View', 'devices')}${record('WhatsApp', 'Enabled', 'Edit', 'notifications')}</div>`)}</div>${panel('Latest activity', activity(), link('View all', 'activity'))}</div>`,
    phone => `<div class="gh-stack"><section><div class="gh-plan-hero"><div><div class="gh-eyebrow">Your subscription</div><div class="gh-plan-name">Weekly</div><p>Expires 7 Nov 2026 · 13:00 EAT</p></div><div class="gh-stack" style="justify-items:start">${active}${button('Renew subscription', 'subscription', true)}</div></div><div class="gh-plan-bottom">${facts([['Time left', '6 days']])}${facts([['Credit', 'UGX 2,000']])}${link('Payment history', 'payments')}</div></section><section class="gh-panel gh-pad">${record('Phone', esc(phone), 'Change', 'phone')}${record('Password', '••••••••', 'Change', 'password')}${record('Devices', '1 signed in', 'View', 'devices')}</section></div>`,
    phone => `<div class="gh-overview">${record('Subscription', `Weekly ${active}`, 'Manage', 'subscription')}${record('Expiry', '7 Nov 2026 · 6 days left', 'Renew', 'subscription')}${record('Phone', esc(phone), 'Change', 'phone')}${record('Password', '••••••••', 'Change', 'password')}${record('Devices', '1 signed in', 'Manage', 'devices')}${record('WhatsApp updates', 'Enabled', 'Edit', 'notifications')}${record('Payments', 'UGX 2,000 credit', 'View', 'payments')}</div>`,
    phone => `<div class="gh-overview"><div class="gh-stack">${panel('Subscription', `${subscriptionFacts()}<hr class="gh-divider"><div class="gh-actions">${button('Renew', 'subscription', true)}${link('Payment history', 'payments')}</div>`)}${panel('Activity', activity(), link('View all', 'activity'))}</div><aside class="gh-inspect"><div class="gh-section-title">Account details</div>${facts([['Phone', esc(phone)], ['Password', '••••••••'], ['Devices', '1 signed in'], ['WhatsApp', 'Enabled']])}<hr class="gh-divider"><div class="gh-stack">${link('Change phone', 'phone')}${link('Change password', 'password')}${link('Manage devices', 'devices')}</div></aside></div>`,
    phone => `<div class="gh-overview"><section class="gh-panel"><div class="gh-pad"><div class="gh-section-title">Subscription ${active}</div>${facts([['Package', 'Weekly'], ['Time left', '6 days'], ['Expires', '7 Nov 2026']])}</div><div class="gh-group-action">${link('Manage subscription', 'subscription')}</div></section><section class="gh-panel"><div class="gh-pad"><div class="gh-section-title">Sign-in</div>${facts([['Phone', esc(phone)], ['Password', 'Set']])}</div><div class="gh-group-action gh-actions">${link('Change phone', 'phone')}${link('Change password', 'password')}</div></section><section class="gh-panel"><div class="gh-pad"><div class="gh-section-title">Payments</div>${facts([['Last payment', 'UGX 5,000'], ['Credit', 'UGX 2,000']])}</div><div class="gh-group-action">${link('View payments', 'payments')}</div></section><section class="gh-panel"><div class="gh-pad"><div class="gh-section-title">Preferences</div>${facts([['Devices', '1 signed in'], ['WhatsApp', 'Enabled']])}</div><div class="gh-group-action gh-actions">${link('Devices', 'devices')}${link('Notifications', 'notifications')}</div></section></div>`,
    phone => `<div class="gh-overview"><section class="gh-detail-sheet"><div class="gh-sheet-content"><div class="gh-section-title">Account details ${active}</div>${facts([['Phone', `<div class="gh-readonly">${esc(phone)}</div>`], ['Password', '<div class="gh-readonly">••••••••</div>'], ['Package', '<div class="gh-readonly">Weekly</div>'], ['Expires', '<div class="gh-readonly">7 Nov 2026</div>']])}<hr class="gh-divider">${facts([['Time left', '6 days'], ['Devices', '1 signed in']])}</div><div class="gh-sheet-footer">${button('Change phone', 'phone')}${button('Change password', 'password')}${button('Renew', 'subscription', true)}</div></section></div>`,
    phone => `<div class="gh-overview">${record('Subscription', `Weekly ${active}`, 'Manage', 'subscription')}${record('Expires', '7 Nov 2026 · 13:00 EAT', 'Renew', 'subscription')}${record('Phone', esc(phone), 'Change', 'phone')}${record('Password', '••••••••', 'Change', 'password')}${record('Account credit', 'UGX 2,000', 'Payments', 'payments')}${record('Devices', '1 signed in', 'Manage', 'devices')}${record('Recent activity', 'Payment approved · 31 Oct', 'View', 'activity')}</div>`,
  ];
  const payments = () => `<section class="gh-panel"><table class="gh-table"><thead><tr><th>Payment</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr><td>PDEMO<small>Weekly</small></td><td>31 Oct 2026</td><td>UGX 5,000</td><td>${active.replace('Active', 'Approved')}</td></tr><tr><td>PCRED<small>Account credit</small></td><td>24 Oct 2026</td><td>UGX 2,000</td><td>${active.replace('Active', 'Approved')}</td></tr></tbody></table></section>`;

  function content(index, view, state) {
    if (view === 'overview') return `${title('Account', [0,2,7].includes(index) ? button('Renew', 'subscription', true) : '')}${overview[index](state.phone)}`;
    if (view === 'subscription') return `${title('Subscription', active)}<div class="gh-form-wrap">${panel('Weekly', `${subscriptionFacts()}<hr class="gh-divider">${facts([['Price', 'UGX 5,000'], ['Account credit', 'UGX 2,000']])}<hr class="gh-divider"><div class="gh-actions">${button('Renew subscription', 'renewal', true)}${link('View payments', 'payments')}</div>`)}</div>`;
    if (view === 'renewal') return `${title('Renew subscription')}<div class="gh-form-wrap">${panel('Weekly', `${facts([['Duration', '7 days'], ['Price', 'UGX 5,000']])}<hr class="gh-divider"><div class="gh-actions">${button('Back', 'subscription')}<button type="button" class="gh-button gh-primary cursor-interaction" data-demo="Renewal selected in this sample.">Continue</button></div>`)}</div>`;
    if (view === 'payments') return `${title('Payments')}${panel('Account credit', facts([['Available', 'UGX 2,000'], ['Auto-renew', 'Off']]))}${payments()}`;
    if (view === 'phone') return `${title('Change phone')}<div class="gh-form-wrap">${panel('Phone number', `<p class="gh-eyebrow">Current phone</p><strong style="display:block;margin:5px 0 22px">${esc(state.phone)}</strong><form class="gh-form" data-task="phone"><label>New phone<input name="phone" type="tel" autocomplete="off" inputmode="tel" placeholder="+256 700 000 102" required minlength="8" maxlength="22"></label><label>Current password<input name="current" type="password" autocomplete="off" required></label><div class="gh-form-foot">${button('Cancel', 'overview')}${submitButton('Continue')}</div><p class="gh-form-error gh-error" role="alert"></p></form>`)}</div>`;
    if (view === 'password') return `${title('Change password')}<div class="gh-form-wrap">${panel('Password', `<form class="gh-form" data-task="password"><label>Current password<input name="current" type="password" autocomplete="off" required></label><label>New password<input name="password" type="password" autocomplete="off" minlength="8" maxlength="128" required></label><label>Confirm password<input name="confirm" type="password" autocomplete="off" minlength="8" maxlength="128" required></label><small>Use at least 8 characters.</small><div class="gh-form-foot">${button('Cancel', 'overview')}${submitButton('Update password')}</div><p class="gh-form-error gh-error" role="alert"></p></form>`)}</div>`;
    if (view === 'devices') return `${title('Devices')}<div class="gh-form-wrap">${panel('Signed-in device', `${facts([['Device', 'This browser'], ['Last active', 'Now']])}<hr class="gh-divider"><button type="button" class="gh-button cursor-interaction" data-demo="Other-device sign-out previewed. Your session is unchanged.">Sign out others</button>`)}</div>`;
    if (view === 'notifications') return `${title('Notifications')}<div class="gh-form-wrap">${panel('WhatsApp', `<form class="gh-form" data-task="notifications"><label class="gh-toggle-row" style="display:flex"><span>Account updates</span><input type="checkbox" name="whatsapp" ${state.notifications ? 'checked' : ''}></label><small>${esc(state.phone)}</small><div class="gh-form-foot">${button('Cancel', 'overview')}${submitButton('Save changes')}</div></form>`)}</div>`;
    return `${title('Activity')}<div class="gh-form-wrap">${panel('Recent activity', activity())}</div>`;
  }

  function renderView(section, view) {
    const state = states.get(section);
    state.view = view;
    section.querySelector('.gh-main').innerHTML = content(state.index, view, state);
    section.querySelectorAll('.gh-sidebar [data-open]').forEach(button => {
      if (button.dataset.open === view || view === 'renewal' && button.dataset.open === 'subscription') button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    section.querySelector('.gh-mobile-menu span').textContent = sections.find(item => item[0] === view)?.[1] ?? 'Subscription';
    section.querySelector('.gh-sidebar').classList.remove('gh-menu-open');
    section.querySelector('.gh-mobile-menu').setAttribute('aria-expanded', 'false');
    section.querySelectorAll('.gh-account-menu').forEach(menu => { menu.open = false; });
    if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 17, height: 17 } });
  }
  function notify(section, text) {
    const main = section.querySelector('.gh-main');
    let notice = main.querySelector('.gh-notice');
    if (!notice) { notice = document.createElement('p'); notice.className = 'gh-alert gh-notice'; notice.setAttribute('role', 'status'); main.append(notice); }
    notice.textContent = text;
  }
  // Form previews stay local, including in hosts that prohibit native form submission.
  function submitPreview(section, form) {
    if (!form.checkValidity()) { form.reportValidity(); return; }
    if (form.dataset.task === 'password') {
      if (form.elements.password.value !== form.elements.confirm.value) { form.querySelector('.gh-form-error').textContent = 'Passwords do not match.'; return; }
      form.reset(); form.querySelector('.gh-form-error').textContent = '';
      notify(section, 'Password change previewed. Your real password is unchanged.');
    } else if (form.dataset.task === 'phone') {
      notify(section, 'Phone verification previewed. No code was sent.'); form.elements.current.value = '';
    } else {
      states.get(section).notifications = form.elements.whatsapp.checked;
      notify(section, 'Preference updated in this sample.');
    }
  }

  [...root.children].filter(section => section.hasAttribute('data-variant')).forEach((section, index) => {
    const state = { index, view: 'overview', phone: '+256 700 000 101', notifications: true };
    states.set(section, state);
    const nav = sections.map(([key, name, glyph], position) => `${index === 7 && (position === 3 || position === 5) ? `<span class="gh-nav-group">${position === 3 ? 'Sign-in' : 'Preferences'}</span>` : ''}<button type="button" class="cursor-interaction" data-open="${key}"${key === 'overview' ? ' aria-current="page"' : ''}>${icon(glyph)}<span>${name}</span></button>`).join('');
    section.innerHTML = `<div class="gh-window"><header class="gh-top"><div class="gh-brand">Goal <span>Hint</span></div><span class="gh-preview">Sample</span><nav class="gh-public" aria-label="Site navigation"><button type="button" data-demo="Best Slips stays in the main app.">Best Slips</button><button type="button" data-demo="Matches stays in the main app.">Matches</button><button type="button" data-demo="Slip Builder stays in the main app.">Slip builder</button></nav><details class="gh-account-menu"><summary class="cursor-interaction">${icon('user-round')} Account ${icon('chevron-down')}</summary><nav class="gh-menu-popup" aria-label="Account menu">${sections.slice(0,5).map(([key, label]) => `<button type="button" class="cursor-interaction" data-open="${key}">${key === 'overview' ? 'My account' : label}</button>`).join('')}<button type="button" class="cursor-interaction" data-demo="Sign-out preview only. Your account stays signed in.">Sign out</button></nav></details></header><div class="gh-body"><aside class="gh-sidebar"><div class="gh-side-head">Account</div><button type="button" class="gh-mobile-menu cursor-interaction" aria-expanded="false">${icon('menu')}<span>Overview</span>${icon('chevron-down')}</button><nav aria-label="Account sections">${nav}</nav><div class="gh-side-foot"><small>+256 700 000 101</small><button type="button" class="gh-signout cursor-interaction" data-demo="Sign-out preview only. Your account stays signed in.">${icon('log-out')} Sign out</button></div></aside><main class="gh-main" aria-label="Account details"></main></div></div>`;
    renderView(section, 'overview');
    section.addEventListener('click', event => {
      const element = event.target.closest('button');
      if (!element) return;
      if (element.dataset.open) renderView(section, element.dataset.open);
      else if (element.hasAttribute('data-preview-submit')) submitPreview(section, element.closest('form'));
      else if (element.dataset.demo) notify(section, element.dataset.demo);
      else if (element.classList.contains('gh-mobile-menu')) {
        const open = section.querySelector('.gh-sidebar').classList.toggle('gh-menu-open');
        element.setAttribute('aria-expanded', String(open));
      }
    });
    section.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.matches('input') && event.target.form) {
        event.preventDefault(); submitPreview(section, event.target.form); return;
      }
      if (event.key === 'Escape') {
        const menu = section.querySelector('.gh-account-menu');
        if (menu.open) { menu.open = false; menu.querySelector('summary').focus(); }
        section.querySelector('.gh-sidebar').classList.remove('gh-menu-open');
        section.querySelector('.gh-mobile-menu').setAttribute('aria-expanded', 'false');
      }
    });
    section.addEventListener('submit', event => {
      event.preventDefault();
      submitPreview(section, event.target);
    });
    const layout = { sidebar: index === 5 ? 190 : 204, spacing: index === 2 ? 18 : 24 };
    const applyLayout = () => { section.style.setProperty('--gh-side', `${layout.sidebar}px`); section.style.setProperty('--gh-space', `${layout.spacing}px`); };
    applyLayout();
    if (globalThis.Tweak) {
      const tweak = new globalThis.Tweak({ container: section, onChange: applyLayout });
      tweak.addSlider(layout, 'sidebar', { label: 'Menu width', min: 180, max: 240, unit: 'px' });
      tweak.addSlider(layout, 'spacing', { label: 'Content spacing', min: 16, max: 32, unit: 'px' });
    }
  });
})();
</script>
