<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 Ledger · Goal Hint desktop match details</title>
<link rel="stylesheet" href="kit/base.css">
<style>
  /* One white sheet: a one-line scoreboard, then three ruled columns (Prediction · Match · Teams) and a
   * full-width player ledger. Nothing is hidden; every fact has its own row. */
  .sheet { background: var(--surface); border: 1px solid var(--line); }
  .band { display: grid; grid-template-columns: 1fr 1fr; height: 3px; } .band i:first-child { background: var(--home); } .band i:last-child { background: var(--away); }
  .sb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .sb .ctx { display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); }
  .sb .ctx b { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text); }
  .sb .ctx.r { text-align: right; justify-items: end; }
  .sb .mid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .sb .t { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; }
  .sb .t.h { justify-content: flex-end; }
  .sb .t small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  .sb .t.h div { text-align: right; }
  .sb .sc { display: grid; justify-items: center; }
  .sb .sc strong { font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: .02em; }
  .sb .sc span { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12.5px; font-weight: 800; color: var(--live); }
  .sb .sc span i + em { font-style: normal; color: var(--muted); font-weight: 650; }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .col { padding: 14px 18px 18px; border-right: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; }
  .col:last-child { border-right: 0; }
  .colt { display: flex; align-items: center; gap: 8px; margin: -14px -18px 0; padding: 9px 18px; font-size: 13px; font-weight: 800; color: var(--teal-d); background: var(--soft); border-bottom: 1px solid var(--line); }
  .verdict { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 12px; }
  .verdict .k-lbl { grid-column: 1 / -1; color: var(--teal-d); }
  .verdict h2 { font-size: 22px; line-height: 1.15; font-weight: 800; }
  .verdict h2 small { display: block; margin-top: 3px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
  .verdict strong { font-size: 34px; line-height: 1; font-weight: 800; }
  .verdict p { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .leg { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .leg span { display: inline-flex; align-items: center; gap: 5px; }
  .mk + .mk { margin-top: 10px; }
  .mk > p { margin-bottom: 2px; font-size: 12px; font-weight: 750; }
  .full { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line); }
  .full > div { padding: 14px 18px 18px; } .full > div:first-child { border-right: 1px solid var(--line); }
</style></head>
<body><div id="app"></div>
<script src="kit/data.js"></script><script src="kit/kit.js"></script>
<script>
const { M, H, A, ic, crest, league, hue, liveDot, nowLine, pend, tick, hd, B } = K;
const T = K.top();
K.mount(`${B.site()}
<main class="wrap">
  ${B.crumb()}
  <article class="sheet">
    <div class="band"><i></i><i></i></div>
    <header class="sb">
      <div class="ctx"><b>${league(16)} ${M.league.name} · ${M.league.round}</b><span>${M.kickoff.day} · ${M.kickoff.time} ${M.kickoff.tz} · ${M.league.season}</span></div>
      <div class="mid">
        <div class="t h"><div>${H.name}<small>Saka 12'</small></div>${crest(H, 40)}</div>
        <div class="sc"><strong>${H.goals} – ${A.goals}</strong><span>${liveDot()} ${M.status.minute}<em>· HT ${M.status.ht}</em></span></div>
        <div class="t">${crest(A, 40)}<div>${A.name}<small>Palmer 34' (pen)</small></div></div>
      </div>
      <div class="ctx r"><b>${ic("stadium", 15)} ${M.venue.name}, ${M.venue.city}</b><span>${ic("whistle", 13, 'style="display:inline;vertical-align:-2px"')} Referee ${M.referee.name}</span></div>
    </header>

    <div class="cols">
      <section class="col">
        <h2 class="colt">${ic("target", 16)} Prediction</h2>
        <div class="verdict">
          <p class="k-lbl">Top pick · highest chance</p>
          <h2>${T.pickLabel}<small>${T.name} · odds ${T.odds}</small></h2><strong>${T.prob}%</strong>
          <p>${nowLine(T)} · ${pend()} · ${M.publication.settles}</p>
        </div>
        <div>${hd("Match result chances", "ours")}${B.resultBar()}</div>
        <div>${hd("All picks", `Rev ${M.publication.revision} · ${M.publication.published}`)}${B.picks({ live: "icon", status: false, names: false })}
          <p class="leg"><span>${tick(true)} On track now</span><span>${tick(false)} Not yet</span><span>All ${pend()} until full time</span></p></div>
        <div>${hd("Every outcome", "ours · market · odds")}${M.markets.map((m) => `<div class="mk"><p><span class="k-code" style="--h:${hue(m.id)}">${m.code}</span> ${m.name}</p>${B.outcomes(m, { head: false })}</div>`).join("")}</div>
        <div>${hd("Why we think so", "3 reasons · 1 risk")}${B.analysis()}</div>
        <div>${hd("Odds", "open → now · best")}${B.odds({ compact: true })}</div>
        <div>${hd("Prediction history", `${M.history.length} versions`)}${B.history()}</div>
      </section>

      <section class="col">
        <h2 class="colt">${ic("ball", 16)} Match</h2>
        <div>${hd("Events", "1–1 · 2 cards · 1 VAR")}${B.events()}</div>
        <div>${hd("Statistics", "all 17")}${B.stats({ narrow: true })}</div>
        <div>${hd("Line-ups", `${H.formation} v ${A.formation} · ratings`)}${B.lineups({ bench: true })}</div>
        <div>${hd("Missing players", `${M.injuries.home.length} · ${M.injuries.away.length}`)}${B.injuries()}</div>
        <div>${hd("Schedule", "rest · last · next")}${B.schedule()}</div>
        <div>${hd("Match info")}${B.info()}</div>
      </section>

      <section class="col">
        <h2 class="colt">${ic("users", 16)} Teams</h2>
        <div>${hd("Form", "last 5, newest right")}${B.form()}</div>
        <div>${hd("Head-to-head", "last 5")}${B.h2h()}</div>
        <div>${hd("Standings", M.league.name)}${B.table({ compact: true })}</div>
        <div>${hd("Season", "league only")}${B.season()}</div>
        <div>${hd("When goals come", "this season")}${B.goalMinutes()}</div>
        <div>${hd("Strength comparison", "API-Football")}${B.compare()}</div>
        <div>${hd("Key players")}${B.keyPlayers()}</div>
        <div>${hd("News", `${M.news.length} stories`)}${B.news()}</div>
      </section>
    </div>

    <div class="full">
      <div>${B.playerTable("home")}</div>
      <div>${B.playerTable("away")}</div>
    </div>
  </article>
  ${B.disc()}
</main>`);
</script></body></html>
