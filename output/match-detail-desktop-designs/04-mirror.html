<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 Mirror Spine · Goal Hint desktop match details</title>
<link rel="stylesheet" href="kit/base.css">
<style>
  /* Arsenal is always on the left, Chelsea always on the right, and the topic sits in a centre spine. Every
   * comparison on the page reads the same way; shared facts (picks, head-to-head, odds) span the full width. */
  :root { --sp: 230px; }
  .mh { display: grid; grid-template-columns: 1fr var(--sp) 1fr; background: var(--surface); border: 1px solid var(--line); }
  .mh .side { display: flex; align-items: center; gap: 16px; padding: 18px 24px; }
  .mh .side.h { justify-content: flex-end; text-align: right; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--home) 7%, transparent)); border-right: 3px solid var(--home); }
  .mh .side.a { background: linear-gradient(270deg, transparent, color-mix(in srgb, var(--away) 7%, transparent)); border-left: 3px solid var(--away); }
  .mh .side b { display: block; font-size: 26px; line-height: 1.1; font-weight: 800; }
  .mh .side small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--muted); }
  .mh .side em { display: block; margin-top: 3px; font-style: normal; font-size: 12.5px; font-weight: 700; }
  .mh .mid { display: grid; justify-items: center; align-content: center; gap: 3px; padding: 12px 0; text-align: center; }
  .mh .mid p { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .mh .mid strong { font-size: 46px; line-height: 1; font-weight: 800; }
  .mh .mid span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--live); }
  .mh .mid span em { font-style: normal; color: var(--muted); font-weight: 650; }
  .mir { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) var(--sp) minmax(0, 1fr); border-bottom: 1px solid var(--hair); }
  .row > .l, .row > .r { min-width: 0; padding: 12px 24px; }
  .row > .l, .row > .r { display: flex; flex-direction: column; justify-content: center; }
  .row > .l { align-items: flex-end; text-align: right; }
  .row > .r { align-items: flex-start; }
  .row > .c { display: grid; align-content: center; justify-items: center; gap: 2px; padding: 10px 8px; text-align: center; background: var(--soft); border-inline: 1px solid var(--hair); }
  .c h3, .cap h3 { font-size: 11.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
  .c small, .cap small { font-size: 12px; color: var(--muted); }
  .row.sh { display: block; padding: 0 24px 14px; }
  .cap { display: grid; justify-items: center; gap: 1px; width: var(--sp); margin: 0 auto 10px; padding: 8px 0; text-align: center; background: var(--soft); border-inline: 1px solid var(--hair); }
  .row.band { border-bottom: 1px solid var(--line); }
  .big { font-size: 30px; line-height: 1; font-weight: 800; } .big + small { color: var(--muted); font-size: 12.5px; }
  .picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pk { display: grid; gap: 3px; padding: 10px 12px; background: var(--soft); border-top: 3px solid var(--quiet); }
  .pk.top { background: var(--surface); border: 1px solid var(--teal); border-top-width: 3px; }
  .pk b { font-size: 15px; } .pk strong { font-size: 26px; line-height: 1.05; font-weight: 800; }
  .pk p { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .outs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 12px; }
  .outs .mk > p { margin-bottom: 3px; font-size: 12.5px; font-weight: 750; }
  .mir .k-ev-r { grid-template-columns: 1fr var(--sp) 1fr; }
  .mir .k-ev-r > .m { align-self: stretch; display: grid; place-items: center; background: var(--soft); border-inline: 1px solid var(--hair); }
  .mir .k-ev-r .e.h { padding-right: 12px; } .mir .k-ev-r .e.a { padding-left: 12px; }
  .mir .k-st-r { grid-template-columns: 56px minmax(0, 1fr) var(--sp) minmax(0, 1fr) 56px; min-height: 25px; }
  .mir .k-st-r > span { align-self: stretch; display: grid; place-items: center; background: var(--soft); border-inline: 1px solid var(--hair); }
  .mir .k-ss > div, .mir .k-sch > div { grid-template-columns: minmax(0, 1fr) var(--sp) minmax(0, 1fr); padding: 0 24px; gap: 0; }
  .mir .k-ss span, .mir .k-sch em { align-self: stretch; display: grid; place-items: center; background: var(--soft); border-inline: 1px solid var(--hair); }
  .mir .k-ss, .mir .k-sch { margin: 0 -24px; }
  .mir .k-ss b:first-child, .mir .k-sch span:first-child { text-align: right; padding-right: 18px; }
  .mir .k-ss b:last-child, .mir .k-sch span:last-child { text-align: left; padding-left: 18px; }
  .xi li { display: flex; align-items: center; gap: 7px; min-height: 23px; font-size: 13px; }
  .l .xi li { flex-direction: row-reverse; }
  .xi li > i { width: 20px; font-style: normal; font-size: 12px; font-weight: 750; color: var(--muted); text-align: center; }
  .xi li > u { padding: 0 4px; font-size: 11px; font-weight: 800; text-decoration: none; color: #fff; background: #5E7383; } .xi li > u.hi { background: var(--win); }
  .xi li small { color: var(--muted); }
  .inj p { display: flex; gap: 8px; align-items: baseline; min-height: 24px; font-size: 13px; } .l .inj p { flex-direction: row-reverse; }
  .inj .out { color: var(--bad); font-weight: 800; font-size: 12px; } .inj .dbt { color: var(--pend); font-weight: 800; font-size: 12px; } .inj small { color: var(--muted); }
  .fl li { display: flex; align-items: center; gap: 8px; min-height: 24px; font-size: 13px; } .l .fl li { flex-direction: row-reverse; }
  .fl li b { min-width: 30px; } .fl small { color: var(--muted); }
  .cmp > div { display: grid; grid-template-columns: 44px minmax(0, 1fr) var(--sp) minmax(0, 1fr) 44px; align-items: center; gap: 8px; min-height: 24px; padding: 0 24px; }
  .cmp > div > span { align-self: stretch; display: grid; place-items: center; font-size: 12px; color: var(--muted); background: var(--soft); border-inline: 1px solid var(--hair); }
  .cmp i { display: block; height: 6px; background: var(--hair); } .cmp i u { display: block; height: 100%; }
  .cmp i:first-of-type u { margin-left: auto; background: var(--home); } .cmp i:last-of-type u { background: var(--away); }
  .cmp b:last-child { text-align: right; } .cmp { margin: 0 -24px; }
  .gm { display: grid; grid-template-columns: repeat(6, 34px); gap: 6px; align-items: end; height: 70px; }
  .gm span { display: flex; align-items: end; gap: 2px; height: 100%; } .gm u { width: 12px; position: relative; } .gm u b { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); }
  .gmx { display: grid; grid-template-columns: repeat(6, 34px); gap: 6px; margin-top: 3px; font-size: 10px; color: var(--muted); text-align: center; }
  .gl { display: flex; gap: 10px; margin-top: 5px; font-size: 11.5px; color: var(--muted); } .gl i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; vertical-align: -1px; }
  .kp li { display: flex; gap: 8px; align-items: baseline; min-height: 24px; font-size: 13px; } .l .kp li { flex-direction: row-reverse; } .kp small { color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; } .two > * { min-width: 0; }
  .three { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 24px; } .three > * { min-width: 0; }
  .mid-w { max-width: 760px; margin: 0 auto; }
  .tg { text-align: center; }
</style></head>
<body><div id="app"></div>
<script src="kit/data.js"></script><script src="kit/kit.js"></script>
<script>
const { M, H, A, ic, crest, league, hue, team, card, liveDot, nowLine, pend, tick, form, hd, B } = K;
const T = K.top(), o = K.mr().outcomes;
const row = (label, cap, l, r) => `<div class="row"><div class="l">${l}</div><div class="c"><h3>${label}</h3>${cap ? `<small>${cap}</small>` : ""}</div><div class="r">${r}</div></div>`;
const shared = (label, cap, body) => `<div class="row sh"><div class="cap"><h3>${label}</h3>${cap ? `<small>${cap}</small>` : ""}</div>${body}</div>`;
const rate = (s, n) => { const r = M.lineups[s].ratings[n]; return r ? `<u class="${r >= 7.5 ? "hi" : ""}">${r.toFixed(1)}</u>` : ""; };
const mk = (m) => m ? m.split(" ").map((x) => ({ goal: ic("ball", 12), yellow: card("y"), off: ic("sub", 12) })[x] || "").join("") : "";
const xi = (s) => `<ol class="xi" data-b="lineups">${M.lineups[s].xi.map(([n, name, , m]) => `<li><i>${n}</i><span>${name}${name === M.lineups[s].captain ? " <small>(C)</small>" : ""}</span>${mk(m)}${rate(s, name)}</li>`).join("")}</ol>`;
const bench = (s) => `<ol class="xi" data-b="bench">${M.lineups[s].bench.map(([n, name, m, at]) => `<li><i>${n}</i><span>${name}</span>${m ? `${ic("sub", 12)}<small>${at}</small>${rate(s, name)}` : ""}</li>`).join("")}</ol>`;
const inj = (s) => `<div class="inj" data-b="injuries">${M.injuries[s].map(([n, st, why]) => `<p><b>${n}</b><span class="${st === "Out" ? "out" : "dbt"}">${st}</span><small>${why}</small></p>`).join("")}</div>`;
const fl = (s) => `<div data-b="form">${form(M.form[s], true)}<ul class="fl" style="margin-top:6px">${M.form[s].map(([r, sc, opp, v, c]) => `<li><i class="k-r ${r}">${r}</i><b>${sc}</b><span>${v === "H" ? "vs" : "at"} ${opp} <small>${c}</small></span></li>`).join("")}</ul></div>`;
const gm = (s) => { const g = M.goalMinutes[s], max = 4;
  return `<div data-b="goalMinutes"><div class="gm">${g.for.map((f, i) => `<span><u style="height:${f / max * 100}%;background:${team(s).color}"><b>${f}</b></u><u style="height:${g.against[i] / max * 100}%;background:var(--quiet)"><b>${g.against[i]}</b></u></span>`).join("")}</div>
  <div class="gmx">${M.goalMinutes.bands.map((b) => `<span>${b}</span>`).join("")}</div><p class="gl"><span><i style="background:${team(s).color}"></i>scored</span><span><i style="background:var(--quiet)"></i>conceded</span></p></div>`; };
const kp = (s) => `<ul class="kp" data-b="keyPlayers">${M.players[s].map(([n, pos, ap, g, a, r]) => `<li><b>${n}</b><small>${pos} · ${ap} apps</small><span>${g} G · ${a} A</span><b>${r}</b></li>`).join("")}</ul>`;
const std = (n) => M.table.find((t) => t[1] === n);
K.mount(`${B.site()}
<main class="wrap">
  ${B.crumb()}
  <header class="mh">
    <div class="side h"><div><b>${H.name}</b><small>Home · ${std(H.name)[0]}nd · ${std(H.name)[9]} pts · ${M.lineups.home.coach}</small><em>${ic("ball", 13, 'style="display:inline;vertical-align:-2px"')} Saka 12'</em></div>${crest(H, 64)}</div>
    <div class="mid"><p>${league(14)} ${M.league.round} · ${M.kickoff.day} ${M.kickoff.time}</p><strong>${H.goals} – ${A.goals}</strong><span>${liveDot()} ${M.status.minute} <em>· HT ${M.status.ht}</em></span></div>
    <div class="side a">${crest(A, 64)}<div><b>${A.name}</b><small>Away · ${std(A.name)[0]}th · ${std(A.name)[9]} pts · ${M.lineups.away.coach}</small><em>${ic("ball", 13, 'style="display:inline;vertical-align:-2px"')} Palmer 34' (pen)</em></div></div>
  </header>

  <article class="mir">
    ${row("Chance to win", `Draw <b>${o[1].p}%</b>`, `<span class="big">${o[0].p}%</span><small>${H.name} win · odds ${o[0].odds}</small>`, `<span class="big">${o[2].p}%</span><small>${A.name} win · odds ${o[2].odds}</small>`)}
    <div class="row sh band" style="padding-top:12px">${B.resultBar("thin")}</div>
    ${shared("Our picks", `Rev ${M.publication.revision} · ${M.publication.published} · all ${pend()}`, `<div class="picks" data-b="picks">${M.markets.map((m) => `<div class="pk ${m.top ? "top" : ""}" style="--h:${hue(m.id)}"><span class="k-code">${m.code}${m.top ? " · TOP PICK" : ""}</span><b>${m.pickLabel}</b><strong>${m.prob}%</strong><p><span>odds ${m.odds}</span>${nowLine(m)}</p></div>`).join("")}</div>
      <div class="outs">${M.markets.map((m) => `<div class="mk"><p><span class="k-code" style="--h:${hue(m.id)}">${m.code}</span> every outcome</p>${B.outcomes(m)}</div>`).join("")}</div>
      <p class="tg"><button class="k-more" data-toggle="odds" aria-expanded="false">Odds movement & best prices ${ic("down", 12)}</button></p><div id="odds" hidden><div class="mid-w">${B.odds()}</div></div>
      <p class="k-meta tg" style="margin-top:6px">${ic("clock", 12, 'style="display:inline;vertical-align:-2px"')} ${M.publication.settles} · ${M.publication.locks}</p>`)}
    ${shared("Why we think so", "3 reasons · 1 risk", `<div class="mid-w">${B.analysis()}</div>`)}
    ${shared("Events", "minute in the centre", B.events())}
    ${shared("Statistics", "all 17 · leader in bold", B.stats())}
    ${row("Line-ups", `${H.formation} v ${A.formation}<br>${M.lineups.home.coach} · ${M.lineups.away.coach}`, xi("home"), xi("away"))}
    ${row("Bench", "used subs with minute", bench("home"), bench("away"))}
    ${shared("Player stats", "this match · /fixtures/players", `<div class="two">${B.playerTable("home")}${B.playerTable("away")}</div>`)}
    ${row("Missing", "injured or doubtful", inj("home"), inj("away"))}
    ${row("Form", "last 5 · newest first", fl("home"), fl("away"))}
    ${shared("Head-to-head", "last 5 meetings", `<div class="mid-w">${B.h2h()}</div>`)}
    ${row("Standings", `${M.league.name}`, `<span class="big">2nd</span><small>17 pts · W5 D2 L0 · GD +10</small>`, `<span class="big">4th</span><small>14 pts · W4 D2 L1 · GD +6</small>`)}
    <div class="row sh"><p class="tg"><button class="k-more" data-toggle="tbl" aria-expanded="false">League table ${ic("down", 12)}</button></p><div id="tbl" hidden><div class="mid-w">${B.table({ window: false })}</div></div></div>
    ${shared("Season", "league games only", B.season())}
    ${row("When goals come", "by 15 minutes, season", gm("home"), gm("away"))}
    ${shared("Strength", "API-Football comparison", `<div class="cmp" data-b="compare">${M.compare.map(([l, h]) => `<div><b>${h}%</b><i><u style="width:${h}%"></u></i><span>${l}</span><i><u style="width:${100 - h}%"></u></i><b>${100 - h}%</b></div>`).join("")}</div><p class="k-meta tg" style="margin-top:6px">API-Football advice: <b>${M.apiAdvice}</b></p>`)}
    ${row("Key players", "season · league", kp("home"), kp("away"))}
    ${shared("Schedule", "rest · last · next", B.schedule())}
    ${shared("Match info · news · history", "", `<div class="three"><div>${hd("Match info")}${B.info()}</div><div>${hd("News")}${B.news()}</div><div>${hd("Prediction history")}${B.history()}</div></div>`)}
  </article>
  ${B.disc()}
</main>`);
</script></body></html>
