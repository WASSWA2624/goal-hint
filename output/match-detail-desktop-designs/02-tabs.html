<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 Scoreboard Tabs · Goal Hint desktop match details</title>
<link rel="stylesheet" href="kit/base.css">
<style>
  /* A navy scoreboard that ends in eight tabs. Overview answers most visits on one screen; every other tab is a
   * single screen of one topic, so nothing ever needs a long scroll. */
  .board { color: #fff; background: var(--navy); }
  .board .ctx { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 0; font-size: 12.5px; color: #B9CAD4; }
  .board .ctx span { display: inline-flex; align-items: center; gap: 7px; }
  .board .ctx b { color: #fff; }
  .board .tms { display: grid; grid-template-columns: 1fr 220px 1fr; align-items: center; padding: 10px 24px 16px; }
  .board .tm { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 800; }
  .board .tm.h { justify-content: flex-end; text-align: right; }
  .board .tm small { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 600; color: #B9CAD4; }
  .board .sc { display: grid; justify-items: center; gap: 4px; }
  .board .sc strong { font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: .03em; }
  .board .sc span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: #FF8A80; }
  .board .sc span em { font-style: normal; color: #B9CAD4; font-weight: 650; }
  .tabs { display: flex; gap: 2px; padding: 0 16px; border-top: 1px solid rgba(255,255,255,.12); }
  .tabs button { padding: 12px 12px 11px; font-size: 13.5px; font-weight: 700; color: #B9CAD4; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabs button:hover { color: #fff; }
  .tabs button[aria-selected="true"] { color: #fff; border-bottom-color: var(--mint); }
  .tabs button small { margin-left: 5px; font-size: 11px; color: #8FA6B4; font-weight: 700; }
  .panel { padding: 18px 24px 22px; background: var(--surface); border: 1px solid var(--line); border-top: 0; }
  .panel + .panel { margin-top: 12px; border-top: 1px solid var(--line); }
  .g3 { display: grid; grid-template-columns: 1.35fr .95fr .95fr; gap: 0; }
  .g3 > div, .g2 > div { min-width: 0; padding: 0 22px; border-left: 1px solid var(--hair); display: grid; gap: 16px; align-content: start; }
  .g3 > div:first-child, .g2 > div:first-child { padding-left: 0; border-left: 0; }
  .g3 > div:last-child, .g2 > div:last-child { padding-right: 0; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; }
  .g2.w { grid-template-columns: 1.4fr 1fr; }
  .vd { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2px 12px; padding: 12px 14px; background: var(--soft); border-left: 3px solid var(--teal); }
  .vd .k-lbl { grid-column: 1 / -1; color: var(--teal-d); }
  .vd h2 { font-size: 22px; line-height: 1.15; font-weight: 800; } .vd h2 small { display: block; font-size: 12.5px; font-weight: 650; color: var(--muted); }
  .vd strong { font-size: 36px; line-height: 1; font-weight: 800; }
  .vd p { grid-column: 1 / -1; margin-top: 4px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .foot { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .mk { padding: 10px 12px; background: var(--soft); }
  .mk > p { margin-bottom: 4px; font-size: 12.5px; font-weight: 750; }
  .mks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .k-tbl.wide td, .k-tbl.wide th { padding: 4px 8px; }
</style></head>
<body><div id="app"></div>
<script src="kit/data.js"></script><script src="kit/kit.js"></script>
<script>
const { M, H, A, ic, crest, league, hue, liveDot, nowLine, pend, hd, B } = K;
const T = K.top();
const tabs = [["ov", "Overview"], ["pr", "Prediction", "4 picks"], ["ev", "Events & stats", "8 · 17"], ["lu", "Line-ups & players", "4-3-3 v 4-2-3-1"],
  ["fh", "Form & head-to-head"], ["ts", "Table & season", "2nd v 4th"], ["od", "Odds"], ["in", "Info & news"]];
const panel = (id, body) => `<section class="panel" data-panel="${id}" data-title="${tabs.find((t) => t[0] === id)[1]}" ${id === "ov" ? "" : "hidden"}>${body}</section>`;
K.mount(`${B.site()}
<main class="wrap">
  ${B.crumb()}
  <header class="board">
    <div class="ctx"><span>${league(16)}<b>${M.league.name}</b> · ${M.league.round} · ${M.kickoff.day} · ${M.kickoff.time} ${M.kickoff.tz}</span>
      <span>${ic("stadium", 14)} ${M.venue.name} · ${ic("whistle", 14)} ${M.referee.name}</span></div>
    <div class="tms">
      <div class="tm h"><div>${H.name}<small>Saka 12'</small></div>${crest(H, 56)}</div>
      <div class="sc"><strong>${H.goals} – ${A.goals}</strong><span>${liveDot()} ${M.status.minute} <em>· HT ${M.status.ht}</em></span></div>
      <div class="tm">${crest(A, 56)}<div>${A.name}<small>Palmer 34' (pen)</small></div></div>
    </div>
    <nav class="tabs" role="tablist">${tabs.map(([id, t, s], i) => `<button role="tab" data-tab="${id}" aria-selected="${i === 0}">${t}${s ? `<small>${s}</small>` : ""}</button>`).join("")}</nav>
  </header>

  ${panel("ov", `<div class="g3">
    <div>
      <div class="vd"><p class="k-lbl">Our top pick</p><h2>${T.pickLabel}<small>${T.name} · odds ${T.odds}</small></h2><strong>${T.prob}%</strong><p>${nowLine(T)} · ${pend()}</p></div>
      <div>${hd("All picks", `Rev ${M.publication.revision} · ${M.publication.published}`)}${B.picks({ status: false, names: false })}</div>
      <div>${hd("Match result chances")}${B.resultBar()}</div>
      <p class="foot">${ic("clock", 13)} ${M.publication.settles} · ${M.publication.locks}</p>
    </div>
    <div>
      <div>${hd("Events", "1–1 · 2 cards · 1 VAR")}${B.eventList()}</div>
      <div>${hd("Key statistics", "all 17 in Events & stats")}${B.stats({ narrow: true, rows: ["Possession", "Expected goals (xG)", "Total shots", "Shots on target", "Corners"] })}</div>
    </div>
    <div>
      <div>${hd("Form", "last 5")}${B.form(false)}</div>
      <div>${hd("Head-to-head", "last 5")}${B.h2h({ list: false })}</div>
      <div>${hd("Standings")}${B.table({ compact: true, rows: 4 })}</div>
    </div></div>`)}

  ${panel("pr", `<div class="g2 w">
    <div><div>${hd("Every outcome", "ours · bookmakers' implied · odds")}<div class="mks">${M.markets.map((m) => `<div class="mk"><p><span class="k-code" style="--h:${hue(m.id)}">${m.code}</span> ${m.name} · ${nowLine(m, true)}</p>${B.outcomes(m, { head: false })}</div>`).join("")}</div></div>
      <div>${hd("All picks")}${B.picks()}</div></div>
    <div><div>${hd("Why we think so", "3 reasons · 1 risk")}${B.analysis()}</div><div>${hd("Prediction history", `${M.history.length} versions`)}${B.history()}</div>
      <p class="foot">${ic("clock", 13)} All picks ${pend()} · ${M.publication.settles}</p></div></div>`)}

  ${panel("ev", `<div class="g2"><div>${hd("Events", "goals · cards · VAR · subs")}${B.events()}</div><div>${hd("Statistics", "all 17")}${B.stats()}</div></div>`)}

  ${panel("lu", `<div class="g2 w"><div>${hd("Line-ups", `${H.formation} v ${A.formation} · ratings`)}${B.pitchH()}</div>
      <div>${hd("Substitutes & coaches")}${B.bench()}${hd("Missing players")}${B.injuries()}</div></div>
    <div class="g2" style="margin-top:18px"><div>${B.playerTable("home")}</div><div>${B.playerTable("away")}</div></div>`)}

  ${panel("fh", `<div class="g3"><div>${hd("Form", "last 5")}${B.form()}${B.formList("home")}</div><div>${hd(`${A.name} form`)}${B.formList("away")}</div><div>${hd("Head-to-head", "last 5 meetings")}${B.h2h()}</div></div>`)}

  ${panel("ts", `<div class="g2"><div>${hd("Standings", `${M.league.name} · ${M.league.season}`)}${B.table({ window: false })}</div>
    <div><div>${hd("Season", "league only")}${B.season()}</div><div>${hd("When goals come")}${B.goalMinutes()}</div><div>${hd("Strength comparison", "API-Football")}${B.compare()}</div><div>${hd("Key players")}${B.keyPlayers()}</div></div></div>`)}

  ${panel("od", `<div class="g2 w"><div>${hd("Odds", "every outcome of the four markets")}${B.odds()}</div><div>${hd("Our chance against the market")}${M.markets.map((m) => `<div style="margin-bottom:12px"><p class="k-meta" style="margin-bottom:3px"><span class="k-code" style="--h:${hue(m.id)}">${m.code}</span> ${m.name}</p>${B.outcomes(m, { head: false })}</div>`).join("")}</div></div>`)}

  ${panel("in", `<div class="g3"><div>${hd("Match info")}${B.info()}</div><div>${hd("Schedule", "rest · last · next")}${B.schedule()}</div><div>${hd("News", `${M.news.length} stories`)}${B.news()}</div></div>`)}
  ${B.disc()}
</main>`);
</script></body></html>
