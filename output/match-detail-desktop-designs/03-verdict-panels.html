<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 Verdict & Panels · Goal Hint desktop match details</title>
<link rel="stylesheet" href="kit/base.css">
<style>
  /* The desktop sibling of the phone's Verdict & Drawers: the same scoreboard and verdict, pinned on the left;
   * every other topic is a one-line panel on the right whose summary already answers the question. */
  .band { display: grid; grid-template-columns: 1fr 1fr; height: 3px; } .band i:first-child { background: var(--home); } .band i:last-child { background: var(--away); }
  .top { background: var(--surface); border: 1px solid var(--line); border-top: 0; }
  .ctx { display: flex; justify-content: center; align-items: center; gap: 7px; padding: 12px 0 0; font-size: 12.5px; color: var(--muted); }
  .hd { display: grid; grid-template-columns: 1fr 180px 1fr; align-items: center; padding: 6px 24px 14px; }
  .hd .tm { display: flex; align-items: center; gap: 14px; }
  .hd .tm.h { justify-content: flex-end; text-align: right; }
  .hd .tm b { display: block; font-size: 21px; font-weight: 800; } .hd .tm small { color: var(--muted); font-size: 12.5px; }
  .hd .sc { display: grid; justify-items: center; gap: 3px; }
  .hd .sc strong { font-size: 40px; line-height: 1; font-weight: 800; }
  .hd .sc span { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; color: var(--live); }
  .hd .sc small { color: var(--muted); font-size: 12px; }
  .body { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 12px; align-items: start; margin-top: 12px; }
  .left { position: sticky; top: 68px; display: grid; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); }
  .verdict { padding: 14px 18px 14px; }
  .eb { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-d); }
  .eb span { font-weight: 650; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 12px; }
  .big { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 10px; margin-top: 6px; }
  .big h2 { font-size: 25px; line-height: 1.12; font-weight: 800; }
  .big h2 small { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 700; color: var(--dc); }
  .big strong { font-size: 42px; line-height: .95; font-weight: 800; } .big strong + span { display: block; text-align: right; font-size: 12px; color: var(--muted); }
  .say { margin-top: 9px; font-size: 13.5px; color: var(--muted); } .say b { color: var(--text); }
  .verdict .k-tri { margin-top: 10px; }
  .others { margin-top: 10px; border-top: 1px solid var(--hair); }
  .others div { display: grid; grid-template-columns: 58px 1fr auto auto; align-items: center; gap: 10px; min-height: 36px; border-bottom: 1px solid var(--hair); }
  .others b { font-size: 13.5px; } .others strong { font-size: 14.5px; }
  .foot { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 12px; color: var(--muted); }
  .why { padding: 12px 18px 14px; } .why h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; } .why h3 .ic { color: var(--teal); }
  .dr { border-bottom: 1px solid var(--hair); }
  .dr:last-child { border-bottom: 0; }
  .dr > summary { display: grid; grid-template-columns: 22px 190px minmax(0, 1fr) 16px; align-items: center; gap: 12px; min-height: 46px; padding: 0 18px; }
  .dr > summary:hover { background: var(--soft); }
  .dr > summary > .ic:first-child { color: var(--teal); }
  .dr > summary b { font-size: 14px; font-weight: 750; white-space: nowrap; }
  .dr > summary span { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .dr > summary span strong { color: var(--text); }
  .dr > summary > .ic:last-child { color: var(--muted); transition: transform .15s; }
  .dr[open] > summary { background: var(--soft); border-bottom: 1px solid var(--hair); }
  .dr[open] > summary > .ic:last-child { transform: rotate(180deg); }
  .dr > div { padding: 12px 18px 16px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; } .two > * { min-width: 0; }
  .two.w { grid-template-columns: 1.3fr 1fr; }
  .mk > p { margin: 0 0 3px; font-size: 12.5px; font-weight: 750; }
  .sep { display: inline-block; width: 1px; height: 12px; background: var(--quiet); }
</style></head>
<body><div id="app"></div>
<script src="kit/data.js"></script><script src="kit/kit.js"></script>
<script>
const { M, H, A, ic, crest, league, hue, liveDot, nowLine, pend, tick, mini, hd, B } = K;
const T = K.top();
const dr = (icon, title, preview, body, open = false) => `<details class="dr" ${open ? "open" : ""}><summary>${ic(icon, 18)}<b>${title}</b><span>${preview}</span>${ic("down", 15)}</summary><div>${body}</div></details>`;
const ratings = ["home", "away"].flatMap((s) => M.playerStats[s].map((p) => [p[1], p[4]])).sort((a, b) => b[1] - a[1]).slice(0, 3);
K.mount(`${B.site()}
<main class="wrap">
  ${B.crumb()}
  <div class="band"><i></i><i></i></div>
  <section class="top">
    <p class="ctx">${league(14)} ${M.league.name} · ${M.league.round} · ${M.kickoff.day} ${M.kickoff.time} ${M.kickoff.tz} · ${M.venue.name}</p>
    <div class="hd">
      <div class="tm h"><div><b>${H.name}</b><small>Saka 12'</small></div>${crest(H, 52)}</div>
      <div class="sc"><strong>${H.goals} – ${A.goals}</strong><span>${liveDot()} ${M.status.minute}</span><small>HT ${M.status.ht}</small></div>
      <div class="tm">${crest(A, 52)}<div><b>${A.name}</b><small>Palmer 34' (pen)</small></div></div>
    </div>
  </section>

  <div class="body">
    <aside class="left">
      <section class="card verdict">
        <p class="eb">Our verdict<span>Rev ${M.publication.revision} · ${M.publication.published}</span></p>
        <div class="big"><h2>${T.pickLabel}<small>${T.name} · odds ${T.odds}</small></h2><div><strong>${T.prob}%</strong><span>chance</span></div></div>
        <p class="say"><b>Arsenal are favourites</b> at home; a Chelsea win is the least likely result. ${nowLine(T)}</p>
        ${B.resultBar()}
        <div class="others" data-b="picks">${M.markets.filter((m) => !m.top).map((m) => `<div style="--h:${hue(m.id)}"><span class="k-code">${m.code}</span><b>${m.pickLabel}</b><strong>${m.prob}%</strong>${tick(m.live.ok)}</div>`).join("")}</div>
        <p class="foot">${ic("clock", 13)} All picks ${pend()} · ${M.publication.settles}</p>
      </section>
      <section class="card why"><h3>${ic("bulb", 17)} Why we think so</h3>${B.analysis()}</section>
    </aside>

    <section class="card">
      ${dr("coins", "Every outcome & odds", `<strong>4 markets</strong><i class="sep"></i>DC 1X ${T.prob}% vs market 77%<i class="sep"></i>${M.oddsMeta.split(" · ")[1]}`,
        `<div class="two">${M.markets.map((m) => `<div class="mk"><p><span class="k-code" style="--h:${hue(m.id)}">${m.code}</span> ${m.name} · ${nowLine(m, true)}</p>${B.outcomes(m)}</div>`).join("")}</div>
         <div style="margin-top:14px">${hd("Odds movement", "open → now · best price")}${B.odds()}</div>`)}
      ${dr("ball", "Match events", `<strong>1–1</strong><i class="sep"></i>Saka 12' · Palmer 34' (pen)<i class="sep"></i>2 cards · 1 VAR · 2 subs`, `<div class="two"><div>${B.events()}</div><div>${hd("Statistics at a glance")}${B.stats({ narrow: true, rows: ["Possession", "Expected goals (xG)", "Total shots", "Shots on target", "Corners", "Fouls"] })}</div></div>`, true)}
      ${dr("chart", "Statistics", `<strong>58%</strong> possession<i class="sep"></i>xG <strong>1.62 – 0.88</strong><i class="sep"></i>shots 13 – 7 · on target 4 – 3`, B.stats())}
      ${dr("pitch", "Line-ups", `<strong>${H.formation}</strong> v <strong>${A.formation}</strong><i class="sep"></i>confirmed · ${M.lineups.home.coach} v ${M.lineups.away.coach}`, `<div class="two w"><div>${B.pitchH()}</div><div>${B.bench()}</div></div>`)}
      ${dr("users", "Player ratings & stats", `Best: ${ratings.map(([n, r]) => `<strong>${n} ${r.toFixed(1)}</strong>`).join(" · ")}<i class="sep"></i>24 players`, `<div class="two">${B.playerTable("home")}${B.playerTable("away")}</div>`)}
      ${dr("medic", "Missing players", `${H.short} <strong>${M.injuries.home.length}</strong> (1 out) · ${A.short} <strong>${M.injuries.away.length}</strong> (2 out)<i class="sep"></i>Fofana, Lavia out`, B.injuries())}
      ${dr("bolt", "Form", `${H.short} ${mini("home")} <strong>4W 1D</strong><i class="sep"></i>${A.short} ${mini("away")} <strong>3W 1D 1L</strong>`, `<div class="two"><div>${B.form()}${B.formList("home")}</div><div style="padding-top:60px">${B.formList("away")}</div></div>`)}
      ${dr("swap", "Head-to-head", `${H.short} <strong>${M.h2h.summary.home}</strong> · draws <strong>${M.h2h.summary.draw}</strong> · ${A.short} <strong>${M.h2h.summary.away}</strong><i class="sep"></i>avg ${M.h2h.summary.goals} goals`, `<div style="max-width:560px">${B.h2h()}</div>`)}
      ${dr("list", "Standings", `${H.name} <strong>2nd · 17 pts</strong><i class="sep"></i>${A.name} <strong>4th · 14 pts</strong>`, B.table({ rows: 6 }))}
      ${dr("trophy", "Season statistics", `goals a game <strong>2.1</strong> v <strong>1.9</strong><i class="sep"></i>conceded 0.7 v 1.0<i class="sep"></i>API-Football: ${M.apiAdvice}`, `<div class="two"><div>${B.season()}</div><div>${B.goalMinutes()}<div style="margin-top:14px">${hd("Strength comparison", "API-Football")}${B.compare()}</div></div></div>`)}
      ${dr("star", "Key players", `<strong>Saka</strong> 4 G 5 A<i class="sep"></i><strong>Palmer</strong> 6 G 4 A`, `<div style="max-width:620px">${B.keyPlayers()}</div>`)}
      ${dr("cal", "Schedule", `rest <strong>${M.schedule.rest.home}</strong> v <strong>${M.schedule.rest.away}</strong><i class="sep"></i>next: Inter (UCL) · Panathinaikos (UECL)`, `<div style="max-width:720px">${B.schedule()}</div>`)}
      ${dr("stadium", "Match info", `${M.venue.name} · ${M.venue.capacity}<i class="sep"></i>Referee ${M.referee.name}`, `<div style="max-width:620px">${B.info()}</div>`)}
      ${dr("news", "News", `<strong>${M.news[0].title}</strong> · ${M.news[0].publisher}`, B.news())}
      ${dr("history", "Prediction history", `Rev ${M.publication.revision} · ${M.history.length} versions<i class="sep"></i>${M.history[0].note}`, B.history())}
    </section>
  </div>
  ${B.disc()}
</main>`);
</script></body></html>
