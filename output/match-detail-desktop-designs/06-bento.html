<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 Bento · Goal Hint desktop match details</title>
<link rel="stylesheet" href="kit/base.css">
<style>
  /* A grid of white tiles, one topic each. Every tile leads with its answer in large type; "More" opens a tile
   * across the full width in place, so detail never pushes the rest of the page out of view. */
  .bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 10px; }
  .tile { position: relative; min-width: 0; padding: 14px 16px 14px; background: var(--surface); border: 1px solid var(--line); }
  .tile[data-open] { grid-column: 1 / -1 !important; }
  .s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; }
  .r2 { grid-row: span 2; }
  .tl { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tl .ic { color: var(--teal); } .tl span { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 650; font-size: 12px; }
  .kv { margin-bottom: 8px; font-size: 22px; line-height: 1.15; font-weight: 800; } .kv small { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .tile .k-more { position: absolute; right: 14px; top: 11px; margin: 0; }
  .tile .k-more ~ .tl span { margin-right: 64px; }
  .x { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .score { display: grid; align-content: center; justify-items: center; gap: 6px; padding: 18px 16px; text-align: center; }
  .score::before { content: ""; position: absolute; inset: -1px -1px auto; height: 3px; background: linear-gradient(90deg, var(--home) 50%, var(--away) 50%); }
  .score .ctx { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .score .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; width: 100%; }
  .score .tm { display: grid; justify-items: center; gap: 5px; } .score .tm b { font-size: 18px; } .score .tm small { color: var(--muted); font-size: 12px; }
  .score strong { font-size: 52px; line-height: 1; font-weight: 800; }
  .score .lv { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--live); } .score .lv em { font-style: normal; color: var(--muted); font-weight: 650; }
  .score .meta { font-size: 12px; color: var(--muted); }
  .vd { background: linear-gradient(180deg, var(--teal-soft), var(--surface) 70%); border-color: color-mix(in srgb, var(--teal) 40%, var(--line)); }
  .vd .big { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-bottom: 10px; }
  .vd .big h2 { font-size: 24px; line-height: 1.15; font-weight: 800; } .vd .big h2 small { display: block; font-size: 12.5px; font-weight: 650; color: var(--muted); }
  .vd .big strong { font-size: 44px; line-height: .95; font-weight: 800; }
  .vd p { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .pk { display: grid; grid-template-columns: 52px 1fr auto; grid-template-rows: auto auto; align-items: center; column-gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--hair); }
  .pk:last-of-type { border-bottom: 0; }
  .pk b { font-size: 13.5px; } .pk strong { font-size: 18px; font-weight: 800; } .pk > span:last-child { grid-column: 2 / 4; }
  .mk > p { margin-bottom: 3px; font-size: 12.5px; font-weight: 750; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } .g2 > * { min-width: 0; }
</style></head>
<body><div id="app"></div>
<script src="kit/data.js"></script><script src="kit/kit.js"></script>
<script>
const { M, H, A, ic, crest, league, hue, liveDot, nowLine, pend, tick, mini, hd, B } = K;
const T = K.top();
let n = 0;
/* A tile: size class, icon, label, aside, key value, body, and optional hidden detail behind "More". */
const tile = (cls, icon, label, aside, kv, body, more) => { const id = `m${++n}`;
  return `<section class="tile ${cls}" data-card>${more ? `<button class="k-more" data-toggle="${id}" aria-expanded="false">More ${ic("down", 12)}</button>` : ""}
    <p class="tl">${ic(icon, 15)}${label}${aside ? `<span>${aside}</span>` : ""}</p>${kv ? `<p class="kv">${kv}</p>` : ""}${body}${more ? `<div class="x" id="${id}" hidden>${more}</div>` : ""}</section>`; };
const best = ["home", "away"].flatMap((s) => M.playerStats[s].map((p) => [p[1], p[4], s])).sort((a, b) => b[1] - a[1]);
K.mount(`${B.site()}
<main class="wrap">
  ${B.crumb()}
  <div class="bento">
    <section class="tile s5 score">
      <p class="ctx">${league(15)} ${M.league.name} · ${M.league.round} · ${M.kickoff.day} ${M.kickoff.time} ${M.kickoff.tz}</p>
      <div class="row"><div class="tm">${crest(H, 52)}<b>${H.name}</b><small>Saka 12'</small></div><div><strong>${H.goals} – ${A.goals}</strong></div><div class="tm">${crest(A, 52)}<b>${A.name}</b><small>Palmer 34' (pen)</small></div></div>
      <span class="lv">${liveDot()} ${M.status.minute} <em>· ${M.status.long} · HT ${M.status.ht}</em></span>
      <p class="meta">${M.venue.name} · Referee ${M.referee.name}</p>
    </section>
    <section class="tile s4 vd">
      <p class="tl">${ic("target", 15)}Our top pick<span>Rev ${M.publication.revision} · ${M.publication.published}</span></p>
      <div class="big"><h2>${T.pickLabel}<small>${T.name} · odds ${T.odds}</small></h2><strong>${T.prob}%</strong></div>
      ${B.resultBar()}
      <p>${nowLine(T)} · ${pend()} · settles at full time</p>
    </section>
    ${tile("s3", "list", "Other picks", "chance · now", "", `<div data-b="picks">${M.markets.filter((m) => !m.top).map((m) => `<div class="pk" style="--h:${hue(m.id)}"><span class="k-code">${m.code}</span><b>${m.pickLabel}</b><strong>${m.prob}%</strong><span>${nowLine(m)} · odds ${m.odds}</span></div>`).join("")}</div>`)}

    ${tile("s4", "ball", "Events", "8 events", "1–1 <small>Saka 12' · Palmer 34' (pen) · HT 1–1</small>", B.eventList())}
    ${tile("s4", "chart", "Statistics", "xG 1.62 – 0.88", "58% <small>Arsenal possession · 13 shots to 7</small>", B.stats({ narrow: true, rows: ["Possession", "Expected goals (xG)", "Total shots", "Shots on target", "Corners", "Fouls", "Pass accuracy"] }), `<div style="max-width:760px">${B.stats()}</div>`)}
    ${tile("s4 r2", "pitch", "Line-ups", `${H.formation} v ${A.formation}`, "", B.pitch({ h: 540 }), `<div class="g2"><div>${B.lineups({ bench: true })}</div><div>${hd("Missing players")}${B.injuries()}</div></div>`)}

    ${tile("s4", "coins", "Every outcome", "ours · market · odds", "", `${B.outcomes(M.markets[0], { title: "1X2 · Match result" })}`, `<div class="g2"><div style="display:grid;gap:12px">${M.markets.slice(1).map((m) => `<div class="mk"><p><span class="k-code" style="--h:${hue(m.id)}">${m.code}</span> ${m.name} · ${nowLine(m, true)}</p>${B.outcomes(m)}</div>`).join("")}</div><div>${hd("Odds", "open → now · best")}${B.odds()}</div></div>`)}
    ${tile("s4", "bulb", "Why we think so", "3 reasons · 1 risk", "", B.analysis({ sources: false }), `<p class="k-meta">Sources: ${M.analysis.sources.join(", ")} · evidence to ${M.publication.cutoff}</p><div style="margin-top:10px">${hd("Prediction history")}${B.history()}</div>`)}

    ${tile("s3", "medic", "Missing", "", `5 <small>2 Arsenal · 3 Chelsea (2 out)</small>`, B.injuries())}
    ${tile("s3", "bolt", "Form", "last 5", `${mini("home")} ${mini("away")}`, B.form(false), `<div class="g2">${B.formList("home")}${B.formList("away")}</div>`)}
    ${tile("s3", "swap", "Head-to-head", "last 5", `3 · 2 · 0 <small>Arsenal unbeaten · avg 2.6 goals</small>`, B.h2h({ list: false }), B.h2h())}
    ${tile("s3", "list", "Standings", "", `2nd v 4th <small>17 pts v 14 pts</small>`, B.table({ compact: true, rows: 4, form: false }), B.table({ window: false }))}

    ${tile("s4", "trophy", "Season", "league only", `2.1 v 1.9 <small>goals a game · conceded 0.7 v 1.0</small>`, B.goalMinutes(), B.season())}
    ${tile("s4", "chart", "Strength", "API-Football", `61% <small>overall edge to Arsenal</small>`, B.compare())}
    ${tile("s4", "star", "Players", "this match & season", `${best[0][0]} ${best[0][1].toFixed(1)} <small>best rating · Palmer ${best[1][1].toFixed(1)} · Ødegaard 7.4</small>`, B.keyPlayers(), `<div class="g2">${B.playerTable("home")}${B.playerTable("away")}</div>`)}

    ${tile("s4", "cal", "Schedule", "", `3 v 4 days <small>rest since last game</small>`, B.schedule())}
    ${tile("s4", "stadium", "Match info", "", `${M.venue.name} <small>${M.venue.city} · ${M.venue.capacity} · ${M.venue.surface}</small>`, B.info())}
    ${tile("s4", "news", "News", `${M.news.length} stories`, "", B.news())}
  </div>
  ${B.disc()}
</main>`);
</script></body></html>
