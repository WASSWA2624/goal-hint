<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 Pinned Verdict · Goal Hint desktop match details</title>
<link rel="stylesheet" href="kit/base.css">
<style>
  /* A left rail that never scrolls away: the score, the four picks with their live state, and an index that
   * follows you. The right side is one calm report, a section per topic, two topics side by side where they pair. */
  .lay { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
  .rail { position: sticky; top: 70px; display: grid; gap: 10px; max-height: calc(100vh - 82px); overflow: auto; scrollbar-width: thin; }
  .box { background: var(--surface); border: 1px solid var(--line); }
  .score { padding: 12px 14px; }
  .score .lgl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .score .tr { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; padding: 6px 0; }
  .score .tr + .tr { border-top: 1px solid var(--hair); }
  .score .tr b { font-size: 16px; } .score .tr small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .score .tr strong { font-size: 28px; line-height: 1; font-weight: 800; }
  .score .st { display: flex; align-items: center; gap: 7px; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--hair); font-size: 12.5px; font-weight: 800; color: var(--live); }
  .score .st em { font-style: normal; font-weight: 650; color: var(--muted); }
  .rp { padding: 12px 14px; }
  .rp .k-lbl { display: flex; justify-content: space-between; color: var(--teal-d); } .rp .k-lbl span { color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 650; font-size: 11.5px; }
  .tp { margin: 6px 0 8px; padding: 9px 10px; background: var(--teal-soft); }
  .tp p { display: flex; justify-content: space-between; align-items: baseline; }
  .tp b { font-size: 18px; } .tp strong { font-size: 26px; line-height: 1; font-weight: 800; }
  .tp small { display: flex; justify-content: space-between; margin-top: 3px; font-size: 12px; color: var(--muted); }
  .pr { display: grid; grid-template-columns: 52px 1fr auto 18px; align-items: center; gap: 8px; min-height: 32px; border-top: 1px solid var(--hair); font-size: 13px; }
  .pr strong { font-size: 14px; }
  .rp .foot { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .idx { padding: 6px 0; }
  .idx a { display: flex; align-items: center; gap: 9px; padding: 5px 14px; font-size: 13px; font-weight: 650; color: var(--muted); border-left: 3px solid transparent; }
  .idx a .ic { color: var(--quiet); }
  .idx a:hover { color: var(--text); background: var(--soft); }
  .idx a.on { color: var(--teal-d); border-left-color: var(--teal); background: var(--teal-soft); } .idx a.on .ic { color: var(--teal); }
  .rep { display: grid; gap: 12px; }
  .sec { padding: 16px 20px 18px; scroll-margin-top: 70px; }
  .sec > h2 { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; font-size: 17px; font-weight: 800; }
  .sec > h2 span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; } .two > * { min-width: 0; }
  .two.w { grid-template-columns: 1.25fr 1fr; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .pair > .sec { min-width: 0; }
  .mk > p { margin-bottom: 3px; font-size: 12.5px; font-weight: 750; }
</style></head>
<body><div id="app"></div>
<script src="kit/data.js"></script><script src="kit/kit.js"></script>
<script>
const { M, H, A, ic, crest, league, hue, liveDot, nowLine, pend, tick, hd, B } = K;
const T = K.top();
const S = [["out", "coins", "Every outcome"], ["why", "bulb", "Why we think so"], ["ev", "ball", "Events & statistics"], ["lu", "pitch", "Line-ups"],
  ["pl", "users", "Player stats"], ["mis", "medic", "Missing players"], ["fm", "bolt", "Form & head-to-head"], ["tb", "list", "Standings"],
  ["ss", "trophy", "Season & strength"], ["kp", "star", "Key players & schedule"], ["od", "chart", "Odds"], ["inf", "stadium", "Info, news & history"]];
const sec = (id, title, aside, body) => `<section class="box sec" id="${id}"><h2>${title}${aside ? `<span>${aside}</span>` : ""}</h2>${body}</section>`;
K.mount(`${B.site()}
<div class="wrap">${B.crumb()}</div>
<main class="wrap lay">
  <aside class="rail">
    <section class="box score">
      <p class="lgl">${league(14)} ${M.league.name} · ${M.league.round} · ${M.kickoff.day} ${M.kickoff.time}</p>
      <div class="tr">${crest(H, 30)}<div><b>${H.name}</b><small>Saka 12'</small></div><strong>${H.goals}</strong></div>
      <div class="tr">${crest(A, 30)}<div><b>${A.name}</b><small>Palmer 34' (pen)</small></div><strong>${A.goals}</strong></div>
      <p class="st">${liveDot()} ${M.status.minute} <em>${M.status.long} · HT ${M.status.ht}</em></p>
    </section>
    <section class="box rp" data-b="picks">
      <p class="k-lbl">Our picks<span>Rev ${M.publication.revision} · ${M.publication.published}</span></p>
      <div class="tp"><p><b>${T.pickLabel}</b><strong>${T.prob}%</strong></p><small><span>Top pick · ${T.code} · odds ${T.odds}</span>${nowLine(T)}</small></div>
      ${M.markets.filter((m) => !m.top).map((m) => `<div class="pr" style="--h:${hue(m.id)}"><span class="k-code">${m.code}</span><span>${m.pickLabel}</span><strong>${m.prob}%</strong>${tick(m.live.ok)}</div>`).join("")}
      <div style="margin-top:8px">${B.resultBar("thin")}</div>
      <p class="foot">All ${pend()} · ${M.publication.settles}</p>
    </section>
    <nav class="box idx">${S.map(([id, i, t]) => `<a href="#${id}" data-jump="${id}" data-spy="${id}">${ic(i, 15)}${t}</a>`).join("")}</nav>
  </aside>

  <div class="rep">
    ${sec("out", "Every outcome", "our chance · bookmakers' implied · odds", `<div class="two">${M.markets.map((m) => `<div class="mk"><p><span class="k-code" style="--h:${hue(m.id)}">${m.code}</span> ${m.name} · ${nowLine(m, true)}</p>${B.outcomes(m)}</div>`).join("")}</div>
      <div style="margin-top:14px">${hd("All picks")}${B.picks()}</div>`)}
    ${sec("why", "Why we think so", "3 reasons · 1 risk", B.analysis())}
    ${sec("ev", "Events & statistics", "1–1 · 2 cards · 1 VAR · 2 subs", `<div class="two"><div>${B.events()}</div><div>${B.stats({ narrow: true })}</div></div>`)}
    ${sec("lu", "Line-ups", `${H.formation} v ${A.formation} · ratings from API-Football`, `<div class="two w"><div>${B.pitch({ h: 560 })}</div><div>${B.lineups({ bench: true })}</div></div>`)}
    ${sec("pl", "Player stats", "this match", `<div class="two">${B.playerTable("home")}${B.playerTable("away")}</div>`)}
    ${sec("mis", "Missing players", "injured or doubtful", B.injuries())}
    ${sec("fm", "Form & head-to-head", "last 5", `<div class="two"><div>${B.form()}<div class="two" style="gap:16px;margin-top:6px">${B.formList("home")}${B.formList("away")}</div></div><div>${B.h2h()}</div></div>`)}
    ${sec("tb", "Standings", `${M.league.name} · ${M.league.season}`, B.table({ rows: 6 }))}
    ${sec("ss", "Season & strength", "league games only", `<div class="two"><div>${B.season()}</div><div>${B.goalMinutes()}<div style="margin-top:16px">${hd("Strength comparison", "API-Football")}${B.compare()}</div></div></div>`)}
    ${sec("kp", "Key players & schedule", "", `<div class="two"><div>${B.keyPlayers()}</div><div>${B.schedule()}</div></div>`)}
    ${sec("od", "Odds", M.oddsMeta, B.odds({ meta: false }))}
    ${sec("inf", "Info, news & history", "", `<div class="two"><div>${B.info()}</div><div>${hd("News")}${B.news()}<div style="margin-top:14px">${hd("Prediction history")}${B.history()}</div></div></div>`)}
    ${B.disc()}
  </div>
</main>`);
</script></body></html>
