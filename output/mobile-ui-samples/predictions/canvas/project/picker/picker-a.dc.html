<style>
body{margin:0}
/* Chrome reserves room for the native search clear button even when empty, which clipped the last letter of
   "Search teams or leagues"; hide it so the full placeholder fits (kit candidate). */
.gh-search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
/* P1: the page is scrolled so the open Leagues criterion fills the viewport (offset = panel padding + 3 closed rows, so the Leagues row sits at the top). */
.pk-scrolled{margin-top:-173px}
/* Selected group: no double rule under the last row. */
.pk-list{border:1px solid var(--gh-border)}
.pk-list > :last-child{border-bottom:0}
/* Scroll box: rows stop short of the track so the kit's scrollbar track and this thumb stay visible. */
.pk-scroll{position:relative}
.pk-scroll > .gh-check-row{margin-right:6px}
.pk-thumb{position:absolute;top:4px;right:1px;width:4px;height:184px;background:var(--gh-control)}
</style>
