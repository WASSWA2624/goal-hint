<style>
body{margin:0}
/* only tiny screen-specific layout rules here; components come from kit.css */
/* E filter form: one vertical form, fieldsets 24 px apart, 16 px gutters (directions.md §8 "Filter form"). */
.dir-e .e-form{display:grid;gap:24px;padding:16px}
.dir-e .e-fs{display:grid;gap:12px}
.dir-e .e-fs > legend{margin-bottom:8px}
.dir-e .e-fs > legend .gh-count{font-weight:600}
/* Bordered check lists: the box draws the outer edge, so the last row drops its divider. */
.dir-e .e-checks{border:1px solid var(--gh-border)}
.dir-e .e-checks > .gh-check-row:last-child{border-bottom:0}
</style>
</helmet>

              <label class="gh-check-row" for="e-lg-4"><input id="e-lg-4" type="checkbox" checked><span class="gh-check"><svg class="gh-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><span class="gh-check-row__main">Olympics Women - Qualification CAF<span class="gh-check-row__detail">World</span></span><span class="gh-check-row__count" aria-hidden="true">13</span></label>
              <label class="gh-check-row" for="e-lg-5"><input id="e-lg-5" type="checkbox" checked><span class="gh-check"><svg class="gh-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><span class="gh-check-row__main">Ligue 2<span class="gh-check-row__detail">Algeria</span></span><span class="gh-check-row__count" aria-hidden="true">12</span></label>

              </div>
            </fieldset>
          </form>
        </div>
      </div>
      <div class="gh-dock gh-dock--actions" role="group" aria-label="Filters and order">
        <button class="gh-btn gh-btn--secondary" type="reset" form="e-filters">Clear</button>
        <a class="gh-btn gh-btn--primary" href="/feed/feed-e.dc.html" aria-label="Apply filters">Apply</a>
      </div>
      <nav class="gh-tabbar" aria-label="App sections">
        <a class="gh-tab" href="/feed/feed-e.dc.html" aria-current="page"><svg class="gh-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-5v-5H9v5H4v-8.5Z"/></svg>Matches</a>
