body{margin:0}
/* only tiny screen-specific layout rules here; components come from kit.css */
/* ---- Option D shared block (identical in every D Match details artboard) ---- */
/* .gh-screen is a flex column: page blocks keep their own height and simply clip at the viewport. */
.dir-d .gh-screen > *{flex:none}
/* Tab strips drawn auto-scrolled (static stand-in for scrollLeft): --sx brings the current tab's left neighbour to
   the strip edge; a scrolled strip fades its clipped start like the kit's end fade; with the last tabs current the
   strip sits at its scroll end (end-aligned, no end fade). */
.dir-d .d-strip > .gh-tabs__tab:first-child{margin-left:calc(var(--sx, 0px) * -1)}
.dir-d .d-strip--scrolled::before{content:"";position:absolute;z-index:1;top:0;bottom:0;left:0;width:32px;background:linear-gradient(270deg, transparent, var(--gh-surface-2));pointer-events:none}
.dir-d .d-strip--end{justify-content:flex-end}
.dir-d .d-strip--end::after{display:none}
/* Facts tables: centre the text in each 44 px row (the kit's .gh-kv__row keeps align-content:start). Kit candidate. */
.dir-d .gh-kv--table .gh-kv__row{align-content:center}
/* Content starts 12 px under the strip or back row (meta line, select chips, lead text); 44 px table rows start flush. */
.dir-d .d-meta{padding:12px 16px 0}
.dir-d .d-filters{align-items:flex-end;padding-top:12px}
.dir-d .d-filters .gh-field__label{white-space:nowrap}
.dir-d .d-list{margin-top:12px;border-top:1px solid var(--gh-border)}
/* Sub-section heading (15/700) and team caption band (crest 20 + name 15/700 on surface-2). */
.dir-d .d-sub{padding:16px 16px 8px}
.dir-d .d-teamhead{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-height:44px;padding:6px 16px;background:var(--gh-surface-2);
  border-top:1px solid var(--gh-border);border-bottom:1px solid var(--gh-border);font-size:15px;font-weight:700}
.dir-d .d-teamhead__sub{margin-left:auto;font-size:13px;font-weight:500;color:var(--gh-muted)}
/* Short page: the shared footer sits at the bottom of the viewport. */
.dir-d .d-footer{margin-top:auto}
/* ---- screen rules ---- */
/* Tab content starts 12 px under the sticky section strip. */
.dir-d .d-tab{padding-top:12px}
/* The current market sub-tab is a link (aria-current); the kit fills only [aria-pressed] segments with the family hue. */
.dir-d .gh-seg__opt[class*="mkt-"][aria-current]{background:var(--hue)}
</style>
