body{margin:0}
/* only tiny screen-specific layout rules here; components come from kit.css */
/* C app bar is 56px (directions.md §6 component table); the kit's shared .gh-topbar is 52px. */
.dir-c .gh-topbar{height:56px}
.dir-c .gh-screen > *{flex:none}
/* Grouped-list rhythm: 16px of page above the first group, 24px between groups. */
.c-first{margin-top:16px}
.c-gap{margin-top:24px}
/* Stat bars are 64px group rows in C; rows inside a group use the inset ::before divider only (no own bottom rule). */
.dir-c .gh-stat-bar{min-height:64px}
.dir-c .gh-group > .gh-stat-bar,.dir-c .gh-group > .gh-kv__row{border-bottom:0}
/* Teams row + Win probability line up with the stat-bar value columns (20px chevron + 10px gap + 16px gutter). */
.c-teams{padding-right:46px}
.c-winprob{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:8px 46px 8px 16px}
.c-winprob__label{font-size:13px;color:var(--gh-muted)}
/* Evidence facts: long values, so label line 1 and value line 2. */
.c-kv2 .gh-kv__row{padding:10px 16px}
.c-kv2 dt{font-size:15px;font-weight:500;color:var(--gh-text)}
.c-kv2 dd{font-size:13px;color:var(--gh-muted)}
/* Metric item page: lead help note + read-only breakdown rows (date · match · value). */
.c-lead{padding:16px 16px 0}
.c-brk__date{flex:none;width:84px;font-size:13px;color:var(--gh-muted)}
.c-brk__match{flex:1 1 auto;min-width:0;font-size:15px;font-weight:600}
.c-brk__val{flex:none;min-width:24px;text-align:right;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
</style>
