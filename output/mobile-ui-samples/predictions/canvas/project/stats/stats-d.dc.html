.dir-d .gh-screen > *{flex:none}

   the strip edge; a scrolled strip fades its clipped start like the kit's end fade; with the last tabs current the

.dir-d .d-strip > .gh-tabs__tab:first-child{margin-left:calc(var(--sx, 0px) * -1)}
