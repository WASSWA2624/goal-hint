<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 Bento Tiles · Goal Hint match details</title>
<link rel="stylesheet" href="kit/base.css">
<style>
  :root { --page: #DCE5EA; }
  .hd { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px var(--g); background: var(--surface); }
  .hd .t { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hd .t.a { flex-direction: row-reverse; text-align: right; }
  .hd .t b { display: block; font-size: 14px; } .hd .t small { color: var(--muted); }
  .hd .sc { display: grid; justify-items: center; gap: 2px; }
  .hd .sc strong { font-size: 28px; line-height: 1; font-weight: 800; }
  .hd .sc span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: var(--live); }
  .hd-meta { display: flex; justify-content: center; gap: 6px; align-items: center; padding: 0 var(--g) 9px; font-size: 11.5px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
  .bento { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; }
  .tile { position: relative; display: grid; align-content: start; gap: 3px; min-height: 84px; padding: 8px 10px 9px; text-align: left; background: var(--surface); border: 1px solid transparent; }
  .tile.w { grid-column: 1 / -1; }
  .tile[aria-expanded="true"] { border-color: var(--teal); box-shadow: inset 0 -3px 0 var(--teal); }
  .lb { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .lb .ic:last-child { margin-left: auto; }
  .lb.h { color: var(--h); }
  .v { font-size: 17px; line-height: 1.2; font-weight: 800; }
  .v small { font-size: 12px; font-weight: 650; color: var(--muted); }
  .s { font-size: 11.5px; color: var(--muted); }
  .tile .k-meter { margin-top: 3px; }
  .split { display: flex; gap: 2px; height: 6px; margin-top: 4px; }
  .split u { background: var(--home); } .split u + u { background: var(--away); }
  .tile.top { padding: 10px 12px; box-shadow: inset 4px 0 0 var(--h); }
  .tile.top .row { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 8px; }
  .tile.top .v { font-size: 20px; }
  .tile.top strong { font-size: 30px; line-height: 1; font-weight: 800; }
  .pn { grid-column: 1 / -1; padding: 10px 12px 12px; background: var(--surface); border-top: 3px solid var(--teal); margin-top: -3px; }
  .pn h3 { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; font-weight: 800; }
  .pn h3 em { font-style: normal; font-weight: 650; font-size: 11.5px; color: var(--muted); }
  .evm { display: grid; gap: 1px; font-size: 12px; } .evm span { display: flex; align-items: center; gap: 5px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style></head>
<body><div id="app"></div>
<script src="kit/data.js"></script><script src="kit/kit.js"></script>
<script>
const { M, H, A, ic, crest, league, hue, liveDot, nowLine, meter, pend, tick, form, letters, B } = K;
const T = K.top(), [mr, dc, tg, bt] = M.markets;
let n = 0;
/* A tile toggles the panel that follows its row. */
const tile = (id, label, value, sub, viz = "", h = "", cls = "") => `<button class="tile ${cls}" data-toggle="p-${id}" data-tgroup="b" aria-expanded="false" ${h ? `style="--h:${h}"` : ""}>
  <span class="lb ${h ? "h" : ""}">${label}${ic("down", 12)}</span><span class="v">${value}</span>${sub ? `<span class="s">${sub}</span>` : ""}${viz}</button>`;
const pn = (id, title, note, body) => `<div class="pn" id="p-${id}" data-tgroup="b" hidden><h3>${title}<em>${note || ""}</em></h3>${body}</div>`;
const pk = (m) => tile(m.id, m.code, m.short === "Yes" ? "Both score" : m.short, `${m.prob}% · odds ${m.odds}`, meter(m.prob, hue(m.id)) + `<span class="s" style="margin-top:3px">${nowLine(m)}</span>`, hue(m.id));
const pkPanel = (m) => pn(m.id, m.name, "", B.outcomes(m));
const split = (h, a) => `<span class="split"><u style="flex:${h}"></u><u style="flex:${a}"></u></span>`;

K.mount(`${B.bar("Match details")}
<section class="hd">
  <div class="t">${crest(H, 34)}<span><b>${H.name}</b><small>Saka 12'</small></span></div>
  <div class="sc"><strong>${H.goals} – ${A.goals}</strong><span>${liveDot()} ${M.status.minute}</span></div>
  <div class="t a">${crest(A, 34)}<span><b>${A.name}</b><small>Palmer 34' p</small></span></div>
</section>
<p class="hd-meta">${league(13)} ${M.league.name} · ${M.league.round} · HT ${M.status.ht}</p>
<div class="bento">
  <button class="tile w top" data-toggle="p-top" data-tgroup="b" aria-expanded="false" style="--h:${hue(T.id)}">
    <span class="lb h">${ic("star", 12)} Top pick · ${T.name}${ic("down", 12)}</span>
    <span class="row"><span><span class="v">${T.pickLabel}</span><br><span class="s">Odds ${T.odds} · ${pend()} · Rev ${M.publication.revision}, ${M.publication.published}</span></span><strong>${T.prob}%</strong></span>
    ${meter(T.prob, hue(T.id))}<span class="s" style="margin-top:3px">${nowLine(T)}</span></button>
  ${pn("top", T.name, M.publication.settles, B.outcomes(T))}
  ${pk(mr)}${pk(tg)}${pkPanel(mr)}${pkPanel(tg)}
  ${pk(bt)}${tile("why", `${ic("bulb", 12)} Why`, "3 reasons", "1 thing to watch", "")}${pkPanel(bt)}${pn("why", "Why this prediction", M.publication.source, B.analysis())}
  ${tile("ev", `${ic("ball", 12)} Events`, "1 – 1", "", `<span class="evm"><span>${ic("ball", 12)} Saka 12'</span><span>${ic("ball", 12)} Palmer 34' (p)</span><span>${K.card("y")} ${K.card("y")} · VAR 58'</span></span>`)}
  ${tile("pos", `${ic("chart", 12)} Possession`, "58% <small>v</small> 42%", "", split(58, 42))}
  ${pn("ev", "Match events", M.status.minute, B.events())}${pn("pos", "Statistics", "Live", B.stats())}
  ${tile("xg", "xG", "1.62 <small>v</small> 0.88", "Expected goals", split(162, 88))}
  ${tile("sh", "Shots", "13 <small>v</small> 7", "On target 4 v 3", split(13, 7))}
  ${pn("xg", "Statistics", "Live", B.stats())}${pn("sh", "Statistics", "Live", B.stats())}
  ${tile("lu", `${ic("pitch", 12)} Line-ups`, `${H.formation} <small>v</small> ${A.formation}`, "Confirmed · tap for pitch")}
  ${tile("inj", `${ic("medic", 12)} Missing`, `${M.injuries.home.length} <small>v</small> ${M.injuries.away.length}`, "Fofana, Lavia out")}
  ${pn("lu", "Line-ups", "Confirmed", `<div style="margin:0 -12px">${B.pitch()}</div><div style="height:10px"></div>${B.bench()}`)}${pn("inj", "Missing players", "", B.injuries())}
  ${tile("form", `${ic("bolt", 12)} Form`, "", "", `<span style="display:grid;gap:4px;margin-top:2px">${form(M.form.home)}${form(M.form.away)}</span>`)}
  ${tile("tbl", `${ic("list", 12)} Table`, "2nd <small>v</small> 4th", "17 pts v 14 pts")}
  ${pn("form", "Form", "Last 5 · newest right", B.form() + `<div class="two" style="margin-top:6px">${B.formList("home")}${B.formList("away")}</div>`)}${pn("tbl", "Standings", M.league.name, B.table())}
  ${tile("h2h", `${ic("swap", 12)} Head-to-head`, `${M.h2h.summary.home} · ${M.h2h.summary.draw} · ${M.h2h.summary.away}`, "Wins · draws · wins", split(3, 0.001).replace('<u style="flex:0.001"></u>', '<u style="flex:2;background:#8395A2"></u><u style="flex:0.001"></u>'))}
  ${tile("ss", `${ic("trophy", 12)} Season`, "2.1 <small>v</small> 1.9", "Goals a game")}
  ${pn("h2h", "Head-to-head", "Last 5", B.h2h())}${pn("ss", "Season stats", "League", B.season())}
  ${tile("cmp", "Strength", "61% <small>v</small> 39%", "API-Football overall", split(61, 39))}
  ${tile("ply", `${ic("users", 12)} Key players`, "Saka · Palmer", "7.81 v 7.92 rating")}
  ${pn("cmp", "Strength comparison", "API-Football", B.compare())}${pn("ply", "Key players", "Season", B.players())}
  ${tile("odds", `${ic("coins", 12)} Odds`, "1.85 · 3.60 · 4.33", "1X2 · bookmaker median")}
  ${tile("sch", `${ic("cal", 12)} Schedule`, "3 <small>v</small> 4 days", "Rest · next: UCL v UECL")}
  ${pn("odds", "Odds", M.oddsMeta, B.odds())}${pn("sch", "Schedule", "", B.schedule())}
  ${tile("ven", `${ic("stadium", 12)} Venue`, M.venue.name, `${M.venue.city} · ${M.venue.capacity}`)}
  ${tile("ref", `${ic("whistle", 12)} Referee`, M.referee.name, M.referee.country)}
  ${pn("ven", "Match info", "", B.info())}${pn("ref", "Match info", "", B.info())}
  ${tile("news", `${ic("news", 12)} News`, `${M.news.length} stories`, "Latest 6 h ago")}
  ${tile("hist", `${ic("history", 12)} History`, `Rev ${M.publication.revision}`, `${M.publication.published} · ${M.history.length} versions`)}
  ${pn("news", "News", "", B.news())}${pn("hist", "Prediction history", M.publication.locks, B.history())}
</div>
${B.disc()}
${B.nav()}`);
if (K.FULL) document.querySelectorAll("#p-xg,#p-sh,#p-ref").forEach((p) => p.remove());
</script></body></html>
