<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 Index Rail · Goal Hint match details</title>
<link rel="stylesheet" href="kit/base.css">
<style>
  :root { --page: #E4EBEF; }
  .bar { border-bottom: 0; }
  .bar h1 { display: flex; justify-content: center; align-items: center; gap: 7px; font-size: 14.5px; }
  .bar h1 em { font-style: normal; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #FF9C9C; }
  .hero { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 6px var(--g) 12px; color: #fff; background: var(--navy); }
  .hero .t { display: grid; justify-items: center; gap: 3px; text-align: center; }
  .hero .t b { font-size: 13.5px; } .hero .t small { font-size: 11.5px; color: #B6C7D1; }
  .hero .sc { display: grid; justify-items: center; gap: 3px; }
  .hero strong { font-size: 30px; line-height: 1; font-weight: 800; }
  .hero .sc small { font-size: 11.5px; color: #B6C7D1; }
  .chips { position: sticky; top: var(--bar-h); z-index: 30; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px var(--g); background: var(--surface); border-bottom: 1px solid var(--line); }
  html.full .chips { position: static; }
  .chips a { flex: none; padding: 5px 10px; font-size: 12.5px; font-weight: 750; color: var(--text); border: 1px solid var(--line); }
  .chips a.on { color: #fff; background: var(--navy); border-color: var(--navy); }
  main { display: grid; gap: 6px; padding: 6px 0; }
  .card { padding: 10px var(--g) 12px; background: var(--surface); scroll-margin-top: 104px; }
  .ch { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; font-size: 13.5px; font-weight: 800; }
  .ch em { margin-left: auto; font-style: normal; font-size: 11.5px; font-weight: 650; color: var(--muted); }
  .rail { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--hair); }
  .rc { display: grid; justify-items: center; align-content: start; gap: 2px; padding: 8px 4px 8px; text-align: center; border-left: 1px solid var(--hair); box-shadow: inset 0 3px 0 var(--h); }
  .rc:first-child { border-left: 0; }
  .rc small { font-size: 11px; font-weight: 800; color: var(--h); }
  .rc b { font-size: 12.5px; line-height: 1.2; min-height: 30px; display: grid; place-items: center; }
  .rc strong { font-size: 19px; line-height: 1.1; font-weight: 800; }
  .rc em { font-style: normal; font-size: 11px; color: var(--muted); }
  .rc.top { background: color-mix(in srgb, var(--h) 7%, var(--surface)); }
  .rnote { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  details.all > summary { display: flex; justify-content: center; align-items: center; gap: 4px; padding-top: 8px; font-size: 12px; font-weight: 750; color: var(--teal-d); }
  details.all[open] > summary .ic { transform: rotate(180deg); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style></head>
<body><div id="app"></div>
<script src="kit/data.js"></script><script src="kit/kit.js"></script>
<script>
const { M, H, A, ic, crest, league, hue, liveDot, nowLine, meter, pend, tick, B } = K;
const card = (id, title, note, body) => `<section class="card" id="${id}"><h2 class="ch">${title}${note ? `<em>${note}</em>` : ""}</h2>${body}</section>`;
const idx = [["picks", "Picks"], ["why", "Why"], ["events", "Events"], ["stats", "Stats"], ["lineups", "Line-ups"], ["missing", "Missing"], ["form", "Form"], ["h2h", "H2H"], ["table", "Table"], ["season", "Season"], ["players", "Players"], ["odds", "Odds"], ["info", "Info"], ["news", "News"], ["history", "History"]];

K.mount(`<header class="bar"><a class="ic-b" href="#" aria-label="Back">${ic("back", 20)}</a><h1>${H.short} ${H.goals}–${A.goals} ${A.short}<em>${liveDot()} ${M.status.minute}</em></h1><button class="ic-b" aria-label="Share">${ic("share", 18)}</button></header>
<section class="hero">
  <div class="t">${crest(H, 40)}<b>${H.name}</b><small>Saka 12'</small></div>
  <div class="sc"><small>${M.league.name} · R8</small><strong>${H.goals} – ${A.goals}</strong><small>HT ${M.status.ht}</small></div>
  <div class="t">${crest(A, 40)}<b>${A.name}</b><small>Palmer 34' (pen)</small></div>
</section>
<nav class="chips">${idx.map(([id, l], i) => `<a href="#" data-jump="${id}" data-offset="100" class="${i === 0 ? "on" : ""}">${l}</a>`).join("")}</nav>
<main>
  ${card("picks", "Our picks", `Rev ${M.publication.revision} · ${M.publication.published}`, `<div class="rail">${M.markets.map((m) => `<div class="rc ${m.top ? "top" : ""}" style="--h:${hue(m.id)}"><small>${m.top ? "★ " : ""}${m.code}</small><b>${m.rail}</b><strong>${m.prob}%</strong><em>${m.odds}</em>${tick(m.live.ok)}</div>`).join("")}</div>
    <p class="rnote">${ic("star", 12, 'style="color:#D99A00"')} Highest chance · ${pend()} · settles at full time</p>
    <details class="all"><summary>Every outcome ${ic("down", 13)}</summary>${M.markets.map((m) => `<p class="k-meta" style="margin:8px 0 2px;font-weight:800;color:${hue(m.id)}">${m.code} · ${m.name} · ${m.live.text}</p>${B.outcomes(m)}`).join("")}</details>`)}
  ${card("why", "Why this prediction", M.publication.source, B.analysis())}
  ${card("events", "Events", `${M.status.long} · ${M.status.minute}`, B.events())}
  ${card("stats", "Statistics", "Live", B.stats(6) + `<details class="all"><summary>All 12 ${ic("down", 13)}</summary>${B.stats(12, 6)}</details>`)}
  ${card("lineups", "Line-ups", "Confirmed", `<div style="margin:0 calc(-1 * var(--g))">${B.pitch()}</div><details class="all"><summary>Bench & coaches ${ic("down", 13)}</summary>${B.bench()}</details>`)}
  ${card("missing", "Missing players", "", B.injuries())}
  ${card("form", "Form", "Last 5", B.form() + `<details class="all"><summary>Results ${ic("down", 13)}</summary><div class="two">${B.formList("home")}${B.formList("away")}</div></details>`)}
  ${card("h2h", "Head-to-head", "Last 5", B.h2h())}
  ${card("table", "Standings", M.league.name, B.table())}
  ${card("season", "Season & strength", "League · API-Football", B.season() + '<div style="height:10px"></div>' + B.compare())}
  ${card("players", "Key players", "Season", B.players())}
  ${card("odds", "Odds", "", B.odds())}
  ${card("info", "Match info", "", B.info() + '<div style="height:8px"></div>' + B.schedule())}
  ${card("news", "News", "", B.news())}
  ${card("history", "Prediction history", M.publication.locks, B.history())}
</main>
${B.disc()}
${B.nav()}`);

/* Scroll-spy: the chip of the section under the sticky index stays highlighted. */
const chips = [...document.querySelectorAll(".chips a")], bar = document.querySelector(".chips");
const spy = () => {
  let cur = idx[0][0];
  for (const [id] of idx) { const el = document.getElementById(id); if (el.getBoundingClientRect().top < 140) cur = id; }
  chips.forEach((c) => { const on = c.dataset.jump === cur; if (on && !c.classList.contains("on")) bar.scrollTo({ left: c.offsetLeft - 12, behavior: "smooth" }); c.classList.toggle("on", on); });
};
addEventListener("scroll", spy, { passive: true });
</script></body></html>
