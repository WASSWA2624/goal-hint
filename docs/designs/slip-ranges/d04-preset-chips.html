<!-- 04 Preset chips -->
<style>
/* 04 Preset chips — one tap picks a common range; Custom… opens a tiny inline min–max editor after the chips. */
@container panel (min-width: 641px) {
  .d04 .gh-form { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
}
.d04 .d04-targets { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 10px; row-gap: 8px; align-items: center; margin: 0; border: 0; min-inline-size: 0; }
.d04 .d04-name { font-size: 0.75rem; font-weight: 700; line-height: 1.25; color: var(--gh-text); white-space: nowrap; }
.d04 .d04-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-inline-size: 0; }
.d04 .d04-chips { display: flex; flex-wrap: wrap; gap: 4px; min-inline-size: 0; }
.d04 .d04-chip { display: inline-flex; align-items: center; justify-content: center; min-block-size: 26px; padding: 0 8px; margin: 0;
  border: 1px solid var(--gh-control-border); border-radius: var(--gh-radius); background: var(--gh-surface); color: var(--gh-text);
  font-size: 0.75rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; }
.d04 .d04-chip:hover { background: var(--gh-surface-muted); }
.d04 .d04-chip[aria-pressed="true"] { background: var(--gh-brand); border-color: var(--gh-brand); color: var(--gh-surface); }
.d04 .d04-chip[aria-pressed="true"]:hover { background: var(--gh-brand-hover); border-color: var(--gh-brand-hover); }
.d04 .d04-editor { display: inline-flex; align-items: center; gap: 4px; animation: d04-reveal 160ms ease-out; }
.d04 .d04-num { inline-size: 3.75rem; min-inline-size: 0; min-block-size: 26px; padding: 0 6px; margin: 0;
  border: 1px solid var(--gh-control-border); border-radius: var(--gh-radius); background: var(--gh-surface); color: var(--gh-text);
  font-size: 0.8125rem; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; text-align: center; }
.d04 .d04-num--int { inline-size: 2.75rem; }
.d04 .d04-num:hover { border-color: var(--gh-text); }
.d04 .d04-num[aria-invalid="true"] { border-color: var(--gh-error); color: var(--gh-error); }
.d04 .d04-to { color: var(--gh-muted); font-size: 0.75rem; font-weight: 700; line-height: 1; }
.d04 .d04-status { font-size: 0.6875rem; font-weight: 700; line-height: 1.25; color: var(--gh-error); white-space: nowrap; }
.d04 .d04-status:empty { display: none; }
@keyframes d04-reveal { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .d04 .d04-editor { animation: none; } }
@container panel (max-width: 640px) {
  .d04 .d04-targets { grid-template-columns: minmax(0, 1fr); row-gap: 4px; }
  .d04 .d04-group + .d04-name { margin-block-start: 10px; }
  .d04 .d04-group { gap: 6px 8px; }
  .d04 .d04-chips { gap: 6px; }
}
@media (pointer: coarse) {
  .d04 .d04-chip { min-block-size: 44px; padding-inline: 10px; }
  .d04 .d04-num { min-block-size: 44px; }
}
</style>
<section class="gh-builder d04">
  <!-- KEEP -->
  <header class="gh-head">
    <h1>Slip builder</h1>
    <label class="gh-slips">Number of slips <input type="number" value="3" min="1" max="10" step="1" inputmode="numeric" aria-label="Number of slips"></label>
  </header>
  <div class="gh-panel">
    <form class="gh-form" onsubmit="return false">
      <fieldset class="gh-targets d04-targets">
        <legend class="sr-only">Your slips</legend>

        <span class="d04-name" id="d04-odds-name">Total odds<span class="sr-only"> per slip</span></span>
        <div class="d04-group" data-d04-group="odds" data-d04-kind="decimal">
          <div class="d04-chips" role="group" aria-labelledby="d04-odds-name">
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="" data-d04-max="">Any</button>
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="1.5" data-d04-max="3" aria-label="1.5 to 3">1.5–3</button>
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="3" data-d04-max="10" aria-label="3 to 10">3–10</button>
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="10" data-d04-max="50" aria-label="10 to 50">10–50</button>
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="50" data-d04-max="" aria-label="50 or more">50+</button>
            <button type="button" class="d04-chip d04-chip--custom" aria-pressed="true" aria-expanded="true" aria-controls="d04-odds-editor" data-d04-custom>Custom…</button>
          </div>
          <span class="d04-editor" id="d04-odds-editor">
            <input class="d04-num" type="number" name="totalMin" id="d04-total-min" value="2.5" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" aria-label="Minimum total odds per slip" data-d04-bound="min">
            <span class="d04-to" aria-hidden="true">–</span>
            <input class="d04-num" type="number" name="totalMax" id="d04-total-max" value="" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" aria-label="Maximum total odds per slip" data-d04-bound="max">
          </span>
          <span class="d04-status" id="d04-odds-status" role="status"></span>
        </div>

        <span class="d04-name" id="d04-matches-name">Matches<span class="sr-only"> per slip</span></span>
        <div class="d04-group" data-d04-group="matches" data-d04-kind="integer">
          <div class="d04-chips" role="group" aria-labelledby="d04-matches-name">
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="" data-d04-max="">Any</button>
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="1" data-d04-max="2" aria-label="1 to 2">1–2</button>
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="3" data-d04-max="4" aria-label="3 to 4">3–4</button>
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="5" data-d04-max="6" aria-label="5 to 6">5–6</button>
            <button type="button" class="d04-chip" aria-pressed="false" data-d04-min="7" data-d04-max="8" aria-label="7 to 8">7–8</button>
            <button type="button" class="d04-chip d04-chip--custom" aria-pressed="true" aria-expanded="true" aria-controls="d04-matches-editor" data-d04-custom>Custom…</button>
          </div>
          <span class="d04-editor" id="d04-matches-editor">
            <input class="d04-num d04-num--int" type="number" name="teamsMin" id="d04-teams-min" value="2" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" aria-label="Minimum matches per slip" data-d04-bound="min">
            <span class="d04-to" aria-hidden="true">–</span>
            <input class="d04-num d04-num--int" type="number" name="teamsMax" id="d04-teams-max" value="5" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" aria-label="Maximum matches per slip" data-d04-bound="max">
          </span>
          <span class="d04-status" id="d04-matches-status" role="status"></span>
        </div>
      </fieldset>
      <!-- KEEP (the three dialog buttons; do not restyle them) -->
      <div class="gh-options">
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match limits</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match Date &amp; Time</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog" data-edited="false">Markets <small aria-hidden="true">4</small></button>
      </div>
      <!-- KEEP -->
      <div class="gh-actions">
        <a class="gh-button" href="#">Reset</a>
        <button type="submit" class="gh-button gh-primary">Build slips</button>
      </div>
    </form>
  </div>
</section>
<script>
(function () {
  var root = document.querySelector('.d04');
  if (!root) return;

  var groups = root.querySelectorAll('[data-d04-group]');
  Array.prototype.forEach.call(groups, function (group) {
    var chips = Array.prototype.slice.call(group.querySelectorAll('.d04-chip'));
    var custom = group.querySelector('[data-d04-custom]');
    var editor = group.querySelector('.d04-editor');
    var minInput = group.querySelector('[data-d04-bound="min"]');
    var maxInput = group.querySelector('[data-d04-bound="max"]');
    var status = group.querySelector('.d04-status');
    if (!chips.length || !minInput || !maxInput) return;

    var decimals = group.getAttribute('data-d04-kind') === 'decimal' ? 2 : 0;
    var lo = parseFloat(minInput.getAttribute('min'));
    var hi = parseFloat(minInput.getAttribute('max'));
    if (isNaN(lo)) lo = -Infinity;
    if (isNaN(hi)) hi = Infinity;

    function read(input) {
      var raw = String(input.value || '').trim();
      if (raw === '') return null;
      var n = Number(raw);
      return isFinite(n) ? n : null;
    }
    function clamp(n) {
      if (n === null) return null;
      n = Math.min(hi, Math.max(lo, n));
      return Number(n.toFixed(decimals));
    }
    function same(a, b) {
      a = String(a == null ? '' : a).trim(); b = String(b == null ? '' : b).trim();
      if (a === '' || b === '') return a === b;
      return Number(a) === Number(b);
    }
    function press(chip) {
      chips.forEach(function (c) { c.setAttribute('aria-pressed', String(c === chip)); });
    }
    function openEditor(open) {
      if (editor) editor.hidden = !open;
      if (custom) custom.setAttribute('aria-expanded', String(open));
    }
    function validate() {
      var a = read(minInput), b = read(maxInput);
      var bad = a !== null && b !== null && a > b;
      minInput.setAttribute('aria-invalid', String(bad));
      maxInput.setAttribute('aria-invalid', String(bad));
      if (status) status.textContent = bad ? 'Min is above max' : '';
      return !bad;
    }
    function presetFor(minValue, maxValue) {
      for (var i = 0; i < chips.length; i++) {
        var c = chips[i];
        if (c.hasAttribute('data-d04-custom')) continue;
        if (same(c.getAttribute('data-d04-min'), minValue) && same(c.getAttribute('data-d04-max'), maxValue)) return c;
      }
      return null;
    }
    function reflect() {
      var hit = presetFor(minInput.value, maxInput.value);
      if (hit) { press(hit); openEditor(false); }
      else if (custom) { press(custom); openEditor(true); }
      validate();
    }

    chips.forEach(function (chip, index) {
      chip.addEventListener('click', function () {
        if (chip.hasAttribute('data-d04-custom')) {
          press(chip);
          openEditor(true);
          try { minInput.focus(); minInput.select(); } catch (e) { /* no-op */ }
          return;
        }
        minInput.value = chip.getAttribute('data-d04-min') || '';
        maxInput.value = chip.getAttribute('data-d04-max') || '';
        press(chip);
        openEditor(false);
        validate();
      });
      chip.addEventListener('keydown', function (event) {
        var next = null;
        if (event.key === 'ArrowRight' || event.key === 'ArrowDown') next = chips[(index + 1) % chips.length];
        else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') next = chips[(index - 1 + chips.length) % chips.length];
        else if (event.key === 'Home') next = chips[0];
        else if (event.key === 'End') next = chips[chips.length - 1];
        if (next) { event.preventDefault(); next.focus(); }
      });
    });

    [minInput, maxInput].forEach(function (input) {
      input.addEventListener('input', validate);
      input.addEventListener('change', function () {
        var n = clamp(read(input));
        input.value = n === null ? '' : String(n);
        validate();
      });
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && custom) { event.preventDefault(); custom.focus(); }
      });
    });

    reflect();
  });
})();
</script>
