<!-- 14 Mini table -->
<style>
/* 14 Mini table: a 2x2 spreadsheet-style grid. Column heads Min / Max, row heads Total odds / Matches, inputs in the cells. */
.d14 .gh-form > .d14-targets { margin: 0; border: 0; min-inline-size: 0; }
@container panel (min-width: 641px) {
  .d14 .gh-form { grid-template-columns: max-content minmax(0, 1fr); }
}

/* Table shell: one crisp outline, shared 1px inner lines, 2px radius */
.d14 .d14-table { inline-size: 20rem; max-inline-size: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--gh-control-border); border-radius: var(--gh-radius); background: var(--gh-surface); font-variant-numeric: tabular-nums; table-layout: fixed; }
.d14 .d14-table th, .d14 .d14-table td { padding: 0; border: 0; text-align: start; vertical-align: middle; }
.d14 .d14-table th:not(:last-child), .d14 .d14-table td:not(:last-child) { border-inline-end: 1px solid var(--gh-border); }
.d14 .d14-table thead > tr > *, .d14 .d14-table tbody > tr:not(:last-child) > * { border-block-end: 1px solid var(--gh-border); }

/* Header cells (top row + first column) sit on the page tint so the white cells read as editable */
.d14 .d14-table th, .d14 .d14-corner { background: var(--gh-page); }
.d14 .d14-corner { inline-size: 7rem; padding: 0 8px; font-size: 0.6875rem; font-weight: 400; line-height: 1.125rem; color: var(--gh-muted); white-space: nowrap; }
.d14 .d14-table thead th { padding: 0 8px; font-size: 0.6875rem; font-weight: 700; line-height: 1.125rem; color: var(--gh-muted); letter-spacing: 0.01em; }
.d14 .d14-table tbody th { padding: 0 8px; font-size: 0.75rem; font-weight: 700; line-height: 1.25; color: var(--gh-text); white-space: nowrap; }

/* Input cells: the input fills the cell; no own border, so the grid lines do the work */
.d14 .d14-cell { position: relative; display: flex; min-inline-size: 0; }
.d14 .d14-cell > input { flex: 1 1 auto; inline-size: 100%; min-inline-size: 0; block-size: 1.5rem; padding: 0 1.375rem 0 8px; border: 0; border-radius: 0; background: transparent; color: var(--gh-text); font-size: 0.875rem; font-weight: 600; line-height: 1.5rem; font-variant-numeric: tabular-nums; }
.d14 .d14-cell:hover > input { background: color-mix(in srgb, var(--gh-brand-soft) 45%, var(--gh-surface)); }
.d14 .d14-cell > input:focus-visible { outline-offset: -2px; background: var(--gh-surface); }
.d14 .d14-cell > input[aria-invalid="true"] { color: var(--gh-error); background: color-mix(in srgb, var(--gh-error) 7%, var(--gh-surface)); }

/* Clear-to-Any: revealed on hover / focus, hidden entirely while the cell is already Any */
.d14 .d14-clear { position: absolute; inset-block: 0; inset-inline-end: 0; display: inline-flex; align-items: center; justify-content: center; inline-size: 1.375rem; padding: 0; border: 0; border-radius: var(--gh-radius); background: transparent; color: var(--gh-muted); cursor: pointer; opacity: 0; transition: opacity 0.12s ease; }
.d14 .d14-cell:hover > .d14-clear, .d14 .d14-cell:focus-within > .d14-clear { opacity: 1; }
.d14 .d14-clear:hover { color: var(--gh-text); background: var(--gh-surface-muted); }
.d14 .d14-clear:focus-visible { opacity: 1; outline-offset: -2px; }
.d14 .d14-clear > svg { inline-size: 10px; block-size: 10px; }

/* Swap feedback: a short tint pulse on both cells when min and max trade places */
@keyframes d14-pulse { from { background-color: var(--gh-brand-soft); } to { background-color: transparent; } }
.d14 .d14-cell[data-pulse] > input { animation: d14-pulse 0.6s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .d14 .d14-cell[data-pulse] > input { animation: none; }
  .d14 .d14-clear { transition: none; }
}

/* Phone: the table spans the panel; rows grow a little */
@container panel (max-width: 640px) {
  .d14 .d14-table { inline-size: 100%; }
  .d14 .d14-corner { inline-size: 6.5rem; }
  .d14 .d14-cell > input { block-size: 2.25rem; line-height: 2.25rem; }
}

/* Touch: 44px rows and a 44px clear target that stays visible */
@media (pointer: coarse) {
  .d14 .d14-cell > input { block-size: 2.75rem; line-height: 2.75rem; padding-inline-end: 2.75rem; }
  .d14 .d14-clear { inline-size: 2.75rem; opacity: 1; }
}
</style>
<section class="gh-builder d14">
  <!-- KEEP -->
  <header class="gh-head">
    <h1>Slip builder</h1>
    <label class="gh-slips">Number of slips <input type="number" value="3" min="1" max="10" step="1" inputmode="numeric" aria-label="Number of slips"></label>
  </header>
  <div class="gh-panel">
    <form class="gh-form" onsubmit="return false">
      <fieldset class="gh-targets d14-targets">
        <legend class="sr-only">Your slips</legend>
        <table class="d14-table">
          <caption class="sr-only">Limits per slip: minimum and maximum total odds, and minimum and maximum matches. Leave a cell blank for any.</caption>
          <thead>
            <tr>
              <td class="d14-corner">Per slip</td>
              <th scope="col" id="d14-col-min">Min</th>
              <th scope="col" id="d14-col-max">Max</th>
            </tr>
          </thead>
          <tbody>
            <tr class="d14-row" data-kind="odds">
              <th scope="row" id="d14-row-odds" title="Decimal odds, 1.01 to 100000">Total odds</th>
              <td>
                <div class="d14-cell">
                  <input type="number" name="totalMin" id="d14-total-min" value="2.5" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" autocomplete="off" aria-label="Total odds per slip, minimum">
                  <button type="button" class="d14-clear" aria-label="Clear total odds minimum (any)" hidden><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                </div>
              </td>
              <td>
                <div class="d14-cell">
                  <input type="number" name="totalMax" id="d14-total-max" value="" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" autocomplete="off" aria-label="Total odds per slip, maximum">
                  <button type="button" class="d14-clear" aria-label="Clear total odds maximum (any)" hidden><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                </div>
              </td>
            </tr>
            <tr class="d14-row" data-kind="matches">
              <th scope="row" id="d14-row-matches" title="Whole number, 1 to 8">Matches</th>
              <td>
                <div class="d14-cell">
                  <input type="number" name="teamsMin" id="d14-teams-min" value="2" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" autocomplete="off" aria-label="Matches per slip, minimum">
                  <button type="button" class="d14-clear" aria-label="Clear matches minimum (any)" hidden><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                </div>
              </td>
              <td>
                <div class="d14-cell">
                  <input type="number" name="teamsMax" id="d14-teams-max" value="5" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" autocomplete="off" aria-label="Matches per slip, maximum">
                  <button type="button" class="d14-clear" aria-label="Clear matches maximum (any)" hidden><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <p class="sr-only" id="d14-live" aria-live="polite"></p>
      </fieldset>
      <!-- KEEP (the three dialog buttons; do not restyle them) -->
      <div class="gh-options">
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match limits</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match Date &amp; Time</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog" data-edited="false">Markets <small aria-hidden="true">4</small></button>
      </div>
      <!-- KEEP -->
      <div class="gh-actions">
        <a class="gh-button" href="#">Reset</a>
        <button type="submit" class="gh-button gh-primary">Build slips</button>
      </div>
    </form>
  </div>
</section>
<script>
(function () {
  var root = document.querySelector('.d14');
  if (!root) return;

  var live = root.querySelector('#d14-live');
  var say = function (text) {
    if (!live) return;
    live.textContent = '';
    window.setTimeout(function () { live.textContent = text; }, 30);
  };

  var specs = [
    { kind: 'odds', label: 'Total odds', min: 1.01, max: 100000, dp: 2 },
    { kind: 'matches', label: 'Matches', min: 1, max: 8, dp: 0 }
  ];

  /* Blank or unreadable -> null (Any). Otherwise clamp to the allowed range and round to the step. */
  var parse = function (input, spec) {
    if (input.validity && input.validity.badInput) return null;
    var raw = String(input.value).trim();
    if (raw === '') return null;
    var n = Number(raw);
    if (!isFinite(n)) return null;
    n = Math.min(spec.max, Math.max(spec.min, n));
    return Number(n.toFixed(spec.dp));
  };
  var format = function (n, dp) { return String(Number(n.toFixed(dp))); };

  specs.forEach(function (spec) {
    var row = root.querySelector('.d14-row[data-kind="' + spec.kind + '"]');
    if (!row) return;
    var cells = row.querySelectorAll('.d14-cell');
    if (cells.length < 2) return;
    var lo = cells[0].querySelector('input');
    var hi = cells[1].querySelector('input');
    if (!lo || !hi) return;
    var pair = [lo, hi];

    var syncClear = function (input, cell) {
      var button = cell.querySelector('.d14-clear');
      if (button) button.hidden = input.value === '';
    };

    /* Live flag while typing: both bounds set and min above max */
    var check = function () {
      var a = Number(lo.value), b = Number(hi.value);
      var bad = lo.value !== '' && hi.value !== '' && isFinite(a) && isFinite(b) && a > b;
      pair.forEach(function (input) {
        if (bad) input.setAttribute('aria-invalid', 'true');
        else input.removeAttribute('aria-invalid');
      });
      return bad;
    };

    var pulse = function (cell) {
      cell.removeAttribute('data-pulse');
      void cell.offsetWidth;
      cell.setAttribute('data-pulse', '');
    };

    /* Commit on change: normalise each bound, then swap if still inverted */
    var commit = function (announce) {
      pair.forEach(function (input) {
        var value = parse(input, spec);
        if (value === null) input.value = '';
        else if (Number(input.value) !== value) input.value = format(value, spec.dp);
      });
      if (check()) {
        var keep = lo.value;
        lo.value = hi.value;
        hi.value = keep;
        check();
        pulse(cells[0]);
        pulse(cells[1]);
        if (announce) say(spec.label + ' swapped: min ' + lo.value + ', max ' + hi.value + '.');
      }
      syncClear(lo, cells[0]);
      syncClear(hi, cells[1]);
    };

    pair.forEach(function (input, index) {
      var cell = cells[index];
      input.addEventListener('input', function () { syncClear(input, cell); check(); });
      input.addEventListener('change', function () { commit(true); });
      var button = cell.querySelector('.d14-clear');
      if (button) {
        button.addEventListener('click', function () {
          input.value = '';
          commit(false);
          input.focus();
          say(spec.label + ' ' + (index ? 'max' : 'min') + ' set to any.');
        });
      }
    });

    commit(false);
  });

  root.addEventListener('animationend', function (event) {
    var cell = event.target && event.target.parentNode;
    if (cell && cell.nodeType === 1 && cell.hasAttribute('data-pulse')) cell.removeAttribute('data-pulse');
  });
})();
</script>
