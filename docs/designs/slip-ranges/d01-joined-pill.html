<!-- 01 Joined pill -->
<style>
.d01 .gh-targets { margin: 0; border: 0; min-inline-size: 0; }
.d01 .d01-groups { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 12px; min-inline-size: 0; }
.d01 .d01-group { position: relative; margin: 0; padding: 0; border: 0; min-inline-size: 0; }
.d01 .d01-group[data-unit="odds"] { --d01-w: 5.25rem; }
.d01 .d01-group[data-unit="matches"] { --d01-w: 2.75rem; }
.d01 .d01-legend { display: block; margin: 0 0 3px; padding: 0; font-size: 0.6875rem; font-weight: 700; line-height: 1.3; white-space: nowrap; }
.d01 .d01-pill { display: flex; align-items: stretch; min-block-size: var(--gh-control-h); border: 1px solid var(--gh-control-border); border-radius: var(--gh-radius); background: var(--gh-surface); overflow: hidden; transition: border-color .12s; }
.d01 .d01-pill:hover { border-color: var(--gh-text); }
.d01 .d01-pill:focus-within { outline: 2px solid var(--gh-focus); outline-offset: 2px; }
.d01 .d01-pill > input { flex: 1 1 auto; inline-size: var(--d01-w, 5.25rem); min-inline-size: 0; margin: 0; padding: 4px 6px; border: 0; border-radius: 0; background: transparent; color: var(--gh-text); font-size: 0.875rem; font-weight: 700; line-height: 1.25; text-align: center; font-variant-numeric: tabular-nums; }
.d01 .d01-pill > input::placeholder { font-weight: 400; color: var(--gh-muted); }
.d01 .d01-pill > input:focus-visible { outline: none; }
.d01 .d01-pill > input:focus { background: var(--gh-brand-soft); }
.d01 .d01-dash { flex: none; display: inline-flex; align-items: center; justify-content: center; margin-block: 7px; padding-inline: 6px; border-inline: 1px solid var(--gh-border); color: var(--gh-muted); font-size: 0.875rem; font-weight: 700; line-height: 1; user-select: none; }
.d01 .d01-group[data-invalid="true"] .d01-pill, .d01 .d01-group[data-invalid="true"] .d01-pill:hover { border-color: var(--gh-error); }
.d01 .d01-group[data-invalid="true"] .d01-dash { color: var(--gh-error); }
.d01 .d01-note { position: absolute; inset-inline-start: 0; inset-block-start: calc(100% + 4px); z-index: 2; margin: 0; padding: 3px 8px; border: 1px solid var(--gh-error); border-radius: var(--gh-radius); background: var(--gh-surface); color: var(--gh-error); font-size: 0.6875rem; font-weight: 700; line-height: 1.3; white-space: nowrap; box-shadow: 0 4px 12px rgba(7,23,71,.12); }
.d01 .d01-note[data-tone="info"] { border-color: var(--gh-control-border); color: var(--gh-muted); }
.d01 .d01-note:empty { display: none; }
@container panel (min-width: 641px) {
  .d01 .gh-form { grid-template-columns: max-content minmax(0, 1fr); column-gap: 24px; }
  .d01 .gh-form > .gh-options { inline-size: 100%; max-inline-size: 32rem; justify-self: end; }
}
@container panel (max-width: 640px) {
  .d01 .d01-groups { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; }
  .d01 .d01-pill { min-block-size: 44px; }
  .d01 .d01-pill > input { flex: 1 1 0; inline-size: auto; padding-inline: 4px; font-size: 1rem; }
  .d01 .d01-note { position: static; margin-block-start: 4px; padding: 0; border: 0; box-shadow: none; white-space: normal; }
}
@media (pointer: coarse) {
  .d01 .d01-pill { min-block-size: 44px; }
}
</style>
<section class="gh-builder d01">
  <!-- KEEP -->
  <header class="gh-head">
    <h1>Slip builder</h1>
    <label class="gh-slips">Number of slips <input type="number" value="3" min="1" max="10" step="1" inputmode="numeric" aria-label="Number of slips"></label>
  </header>
  <div class="gh-panel">
    <form class="gh-form" onsubmit="return false">
      <fieldset class="gh-targets d01-targets">
        <legend class="sr-only">Your slips</legend>
        <div class="d01-groups">
          <fieldset class="d01-group" data-unit="odds" data-decimals="2" data-invalid="false">
            <legend class="d01-legend" id="d01-total-legend">Total odds per slip</legend>
            <div class="d01-pill">
              <input type="number" name="totalMin" id="d01-total-min" value="2.50" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" autocomplete="off" data-bound="min" aria-label="Minimum total odds per slip, blank for any" aria-describedby="d01-total-note">
              <span class="d01-dash" aria-hidden="true">&ndash;</span>
              <input type="number" name="totalMax" id="d01-total-max" value="" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" autocomplete="off" data-bound="max" aria-label="Maximum total odds per slip, blank for any" aria-describedby="d01-total-note">
            </div>
            <p class="d01-note" id="d01-total-note" role="status"></p>
          </fieldset>
          <fieldset class="d01-group" data-unit="matches" data-decimals="0" data-invalid="false">
            <legend class="d01-legend" id="d01-teams-legend">Matches per slip</legend>
            <div class="d01-pill">
              <input type="number" name="teamsMin" id="d01-teams-min" value="2" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" autocomplete="off" data-bound="min" aria-label="Minimum matches per slip, blank for any" aria-describedby="d01-teams-note">
              <span class="d01-dash" aria-hidden="true">&ndash;</span>
              <input type="number" name="teamsMax" id="d01-teams-max" value="5" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" autocomplete="off" data-bound="max" aria-label="Maximum matches per slip, blank for any" aria-describedby="d01-teams-note">
            </div>
            <p class="d01-note" id="d01-teams-note" role="status"></p>
          </fieldset>
        </div>
      </fieldset>
      <!-- KEEP (the three dialog buttons; do not restyle them) -->
      <div class="gh-options">
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match limits</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match Date &amp; Time</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog" data-edited="false">Markets <small aria-hidden="true">4</small></button>
      </div>
      <!-- KEEP -->
      <div class="gh-actions">
        <a class="gh-button" href="#">Reset</a>
        <button type="submit" class="gh-button gh-primary">Build slips</button>
      </div>
    </form>
  </div>
</section>
<script>
(function () {
  var root = document.querySelector('.d01');
  if (!root) return;

  function parse(value) {
    var text = String(value == null ? '' : value).trim();
    if (!text) return null;
    var number = Number(text);
    return isFinite(number) ? number : null;
  }

  var clears = [];
  var groups = root.querySelectorAll('.d01-group');

  Array.prototype.forEach.call(groups, function (group) {
    var minInput = group.querySelector('input[data-bound="min"]');
    var maxInput = group.querySelector('input[data-bound="max"]');
    var note = group.querySelector('.d01-note');
    if (!minInput || !maxInput) return;

    var decimals = group.getAttribute('data-decimals') === '2' ? 2 : 0;
    var lower = parse(minInput.getAttribute('min'));
    var upper = parse(minInput.getAttribute('max'));
    var timer = null;

    function format(number) { return decimals ? number.toFixed(decimals) : String(Math.round(number)); }
    function bound(number) { return decimals && number % 1 !== 0 ? number.toFixed(decimals) : String(number); }
    function clamp(number) {
      if (lower !== null && number < lower) number = lower;
      if (upper !== null && number > upper) number = upper;
      return decimals ? Math.round(number * 100) / 100 : Math.round(number);
    }
    function say(text, tone) {
      if (!note) return;
      if (timer) { clearTimeout(timer); timer = null; }
      note.textContent = text || '';
      if (text) note.setAttribute('data-tone', tone); else note.removeAttribute('data-tone');
      if (text && tone === 'info') {
        timer = setTimeout(function () { if (note.getAttribute('data-tone') === 'info') say('', ''); }, 2600);
      }
    }
    function check() {
      var low = parse(minInput.value), high = parse(maxInput.value);
      var invalid = low !== null && high !== null && low > high;
      group.setAttribute('data-invalid', invalid ? 'true' : 'false');
      [minInput, maxInput].forEach(function (input) {
        if (invalid) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
      });
      if (invalid) say('Min is above max', 'error');
      else if (note && note.getAttribute('data-tone') === 'error') say('', '');
      return !invalid;
    }
    function settle(input) {
      var number = parse(input.value);
      if (number === null) { input.value = ''; check(); return; }
      input.value = format(clamp(number));
      if (!check()) return;
      if (lower !== null && number < lower) say('Lowest is ' + bound(lower), 'info');
      else if (upper !== null && number > upper) say('Highest is ' + bound(upper), 'info');
    }

    [minInput, maxInput].forEach(function (input) {
      input.addEventListener('input', check);
      input.addEventListener('change', function () { settle(input); });
    });
    check();
    clears.push(function () { minInput.value = ''; maxInput.value = ''; say('', ''); check(); });
  });

  var reset = root.querySelector('.gh-actions a.gh-button');
  if (reset) {
    reset.addEventListener('click', function (event) {
      event.preventDefault();
      clears.forEach(function (clear) { clear(); });
    });
  }
})();
</script>
