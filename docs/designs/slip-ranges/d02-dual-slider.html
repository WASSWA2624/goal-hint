<script>
(function () {
  var root = document.querySelector('.d02');
  if (!root) return;

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function round2(v) { return Math.round(v * 100) / 100; }

  /* Odds: piecewise-log track anchored on human ticks so every label gets equal room. */
  var ANCHORS = [1.01, 1.5, 2, 3, 5, 10, 50, 100, 1000, 10000, 100000];
  var SEGS = ANCHORS.length - 1;
  function niceStep(v) { return v < 2 ? 0.01 : v < 5 ? 0.05 : v < 10 ? 0.1 : v < 100 ? 1 : v < 1000 ? 10 : v < 10000 ? 100 : 1000; }
  function nice(v) { var s = niceStep(v); return round2(clamp(Math.round(v / s) * s, 1.01, 100000)); }

  var ODDS = {
    lo: 1.01, hi: 100000, sMin: 0, sMax: 1000,
    fromSlider: function (s) {
      var x = clamp(s / 1000, 0, 1) * SEGS, i = Math.min(SEGS - 1, Math.floor(x)), f = x - i;
      var a = Math.log(ANCHORS[i]), b = Math.log(ANCHORS[i + 1]);
      return nice(Math.exp(a + (b - a) * f));
    },
    toSlider: function (v) {
      v = clamp(v, 1.01, 100000);
      for (var i = 0; i < SEGS; i++) {
        if (v <= ANCHORS[i + 1]) { var a = Math.log(ANCHORS[i]), b = Math.log(ANCHORS[i + 1]); return ((i + (Math.log(v) - a) / (b - a)) / SEGS) * 1000; }
      }
      return 1000;
    },
    parse: function (t) {
      t = String(t).trim().toLowerCase().replace(',', '.');
      if (!t || t === 'any') return null;
      var m = /^(\d+(?:\.\d+)?|\.\d+)\s*(k)?$/.exec(t);
      if (!m) return NaN;
      return round2(clamp(parseFloat(m[1]) * (m[2] ? 1000 : 1), 1.01, 100000));
    },
    format: function (v) { return String(round2(v)); },
    step: function (v, dir) { return round2(clamp(v + dir * niceStep(dir < 0 ? v - 1e-9 : v), 1.01, 100000)); },
    page: function (v, dir) {

  };

  var MATCHES = {
    lo: 1, hi: 8, sMin: 1, sMax: 8,
    fromSlider: function (s) { return clamp(Math.round(s), 1, 8); },
    toSlider: function (v) { return clamp(Math.round(v), 1, 8); },
    parse: function (t) {
      t = String(t).trim().toLowerCase();
      if (!t || t === 'any') return null;
      if (!/^\d+$/.test(t)) return NaN;
      return clamp(parseInt(t, 10), 1, 8);

    format: function (v) { return String(v); },
    step: function (v, dir) { return clamp(v + dir, 1, 8); },
    page: function (v, dir) { return clamp(v + dir * 2, 1, 8); }
  };

  function setup(group, cfg) {
    if (!group) return;
    var rMin = group.querySelector('.d02-range-min'), rMax = group.querySelector('.d02-range-max');
    var cMin = group.querySelector('.d02-chip-min'), cMax = group.querySelector('.d02-chip-max');
    var hMin = group.querySelector('.d02-hidden-min'), hMax = group.querySelector('.d02-hidden-max');
    var track = group.querySelector('.d02-track');
    var ticks = group.querySelectorAll('.d02-ticks > li');
    if (!rMin || !rMax || !cMin || !cMax || !track) return;

    var lo = null, hi = null;            /* null = Any */
    var editing = null, top = 'max', last = { a: 0, b: 1 };
    var span = cfg.sMax - cfg.sMin;

    function norm() {
      if (lo != null && hi != null && lo > hi) { var t = lo; lo = hi; hi = t; }
      if (lo != null && lo <= cfg.lo) lo = null;
      if (hi != null && hi >= cfg.hi) hi = null;
    }
    function ratio(v, isMin) { return v == null ? (isMin ? 0 : 1) : clamp((cfg.toSlider(v) - cfg.sMin) / span, 0, 1); }

    function setMin(v) { if (v != null && hi != null && v > hi) v = hi; lo = v; }

      cMax.style.left = b + 'px';

      if (skip !== rMax) rMax.value = cfg.sMin + last.b * span;

      group.style.setProperty('--d02-hi', String(last.b));

      if (hMax) hMax.value = hi == null ? '' : tB;

      if (editing !== cMax) setChip(cMax, tB, hi == null);

      place();

          case 'PageDown': v = cfg.page(base, -1); break;

          case 'End': v = cfg.hi; break;

    rMax.addEventListener('keydown', keys(false));

    rMin.addEventListener('focus', markTop(true));
    rMax.addEventListener('focus', markTop(false));

          if (isMin) setMin(v); else setMax(v);
          editing = null; render(); editing = chip;
          try { chip.select(); } catch (err) {}
        }
      });
      chip.addEventListener('blur', function () {
        var p = cfg.parse(chip.value);
        editing = null;
        if (p === null || !isNaN(p)) { if (isMin) lo = p; else hi = p; }   /* min > max is swapped by norm() */
        render();
      });
    }
    chipEvents(cMin, true);
    chipEvents(cMax, false);

    /* Initial state comes from the four named fields */
    function fromHidden(el, range) {
      if (el) { var p = cfg.parse(el.value); return (p === null || isNaN(p)) ? null : p; }
      return cfg.fromSlider(+range.value);
    }
    lo = fromHidden(hMin, rMin);
    hi = fromHidden(hMax, rMax);
    render();

    if (typeof ResizeObserver === 'function') { try { new ResizeObserver(function () { place(); }).observe(track); } catch (err) { window.addEventListener('resize', place); } }
    else { window.addEventListener('resize', place); }
    if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') { document.fonts.ready.then(place, function () {}); }
  }

  setup(root.querySelector('#d02-odds'), ODDS);
  setup(root.querySelector('#d02-matches'), MATCHES);
})();
</script>
