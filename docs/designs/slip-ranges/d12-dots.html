<style>
/* 12 Pips: Matches per slip as a row of eight pips (tap a start and an end, or drag across);
   Total odds as one compact joined min–max field so the pips stay the hero. */
.d12 .d12-targets { margin: 0; border: 0; min-inline-size: 0; }
.d12 .d12-grid { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; min-inline-size: 0; }
.d12 .d12-field { display: flex; flex-direction: column; gap: 4px; min-inline-size: 0; }
.d12 .d12-odds { flex: none; inline-size: 11.5rem; }
.d12 .d12-matches { flex: none; }
.d12 .d12-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-block-size: 1rem; }
.d12 .d12-side { display: inline-flex; align-items: center; gap: 8px; }
.d12 .d12-label { font-size: 0.75rem; font-weight: 700; line-height: 1.3; white-space: nowrap; }
.d12 .d12-hint, .d12 .d12-msg { font-size: 0.6875rem; font-weight: 700; line-height: 1.3; white-space: nowrap; font-variant-numeric: tabular-nums; }
.d12 .d12-hint { color: var(--gh-muted); }
.d12 .d12-hint[data-state="pending"] { color: var(--gh-link); }
.d12 .d12-msg { color: var(--gh-error); }

/* Total odds: one outline, two halves joined by "to" */
.d12 .d12-joined { display: flex; align-items: stretch; inline-size: 100%; block-size: 2.125rem; border: 1px solid var(--gh-control-border); border-radius: var(--gh-radius); background: var(--gh-surface); }
.d12 .d12-joined:focus-within { border-color: var(--gh-brand); }
.d12 .d12-joined[data-invalid="true"] { border-color: var(--gh-error); }
.d12 .d12-num { flex: 1 1 0; inline-size: 0; min-inline-size: 0; border: 0; border-radius: var(--gh-radius); padding: 4px 6px; background: transparent; font-size: 0.875rem; line-height: 1.25; text-align: center; font-variant-numeric: tabular-nums; }
.d12 .d12-num:focus-visible { outline-offset: -2px; }
.d12 .d12-num[aria-invalid="true"] { color: var(--gh-error); }
.d12 .d12-to { flex: none; display: inline-flex; align-items: center; padding-inline: 7px; border-inline: 1px solid var(--gh-border); font-size: 0.6875rem; font-weight: 700; color: var(--gh-muted); user-select: none; -webkit-user-select: none; }

/* Matches per slip: the pips */
.d12 .d12-pips { --d12-cy: 9px; --d12-w: 32px; --d12-h: 2.125rem; display: flex; align-items: flex-end; min-inline-size: 0; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.d12 .d12-pip { position: relative; display: grid; grid-template-rows: calc(var(--d12-cy) * 2) 1fr; align-items: center; justify-items: center; inline-size: var(--d12-w); block-size: var(--d12-h); margin: 0; padding: 0; border: 0; border-radius: var(--gh-radius); background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.d12 .d12-dot { position: relative; z-index: 1; inline-size: 12px; block-size: 12px; border: 1.5px solid var(--gh-control-border); border-radius: 50%; background: var(--gh-surface); transition: background-color .12s ease, border-color .12s ease, inline-size .12s ease, block-size .12s ease; }
.d12 .d12-n { font-size: 0.6875rem; font-weight: 400; line-height: 1; color: var(--gh-muted); font-variant-numeric: tabular-nums; }

/* rail between the numbered pips, and the brand line through the selected run */
.d12 .d12-pip[data-n]::before, .d12 .d12-pip[data-n]::after { content: ""; position: absolute; inset-inline-start: 50%; inline-size: 100%; block-size: 0; pointer-events: none; }
.d12 .d12-pip[data-n]:not(:last-child)::before { inset-block-start: calc(var(--d12-cy) - 0.5px); block-size: 1px; background: var(--gh-border); }
.d12 .d12-pip.is-prev:not(.is-prev-hi)::after { inset-block-start: calc(var(--d12-cy) - 1px); block-size: 2px; background: rgba(0, 102, 245, 0.3); background: color-mix(in srgb, var(--gh-brand) 30%, var(--gh-surface)); }
.d12 .d12-pip.is-in:not(.is-hi)::after { inset-block-start: calc(var(--d12-cy) - 1px); block-size: 2px; background: var(--gh-brand); }

/* states */
@media (hover: hover) { .d12 .d12-pip:hover .d12-dot { border-color: var(--gh-brand); } }
.d12 .d12-pip.is-prev .d12-dot { border-color: var(--gh-brand); background: var(--gh-brand-soft); }
.d12 .d12-pip.is-in .d12-dot { border-color: var(--gh-brand); background: var(--gh-brand); }
.d12 .d12-pip.is-lo .d12-dot, .d12 .d12-pip.is-hi .d12-dot { inline-size: 14px; block-size: 14px; }
.d12 .d12-pip.is-in .d12-n { color: var(--gh-text); font-weight: 700; }
.d12 .d12-pip.is-anchor .d12-dot { outline: 3px solid var(--gh-brand-soft); outline-offset: 0; animation: d12-ring 0.9s ease-in-out infinite alternate; }
@keyframes d12-ring {
  from { outline-color: var(--gh-brand-soft); }
  to { outline-color: rgba(0, 102, 245, 0.4); outline-color: color-mix(in srgb, var(--gh-brand) 40%, var(--gh-surface)); }

/* the "Any" pip at the start of the row */
.d12 .d12-any { margin-inline-end: 7px; }
.d12 .d12-any::after { content: ""; position: absolute; inset-inline-end: -4px; inset-block-start: calc(var(--d12-cy) - 7px); inline-size: 1px; block-size: 14px; background: var(--gh-border); pointer-events: none; }
.d12 .d12-any .d12-dot { border-style: dashed; }
.d12 .d12-any.is-in .d12-dot { border-style: solid; }

.d12 .d12-anychip[aria-pressed="true"] { border-color: var(--gh-brand); background: var(--gh-brand); color: var(--gh-surface); }

@container panel (max-width: 640px) {
  .d12 .d12-grid { flex-direction: column; align-items: stretch; gap: 12px; }
  .d12 .d12-odds { inline-size: auto; }
  .d12 .d12-pip[data-n] { flex: 1 1 0; inline-size: auto; }
  .d12 .d12-any { display: none; }
  .d12 .d12-anychip { display: inline-flex; }
}
@media (pointer: coarse) {
  .d12 .d12-pips { --d12-cy: 13px; --d12-w: 44px; --d12-h: 44px; }
  .d12 .d12-anychip::before { content: ""; position: absolute; inset: -10px -2px; }
}
@media (prefers-reduced-motion: reduce) {
  .d12 .d12-dot { transition: none; animation: none; }
}

<script>
(function () {
  var root = document.querySelector('.d12');
  if (!root) return;
  var q = function (sel) { return root.querySelector(sel); };
  var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };
  var closest = function (el, sel) { return (el && el.closest) ? el.closest(sel) : null; };

  /* ---------- Total odds: joined min-max field ---------- */
  var tMin = q('#d12-total-min'), tMax = q('#d12-total-max'), joined = q('#d12-odds-joined'), oddsMsg = q('#d12-odds-msg');
  function oddsState(el) {
    if (!el) return { empty: true, bad: false, n: null };
    if (el.validity && el.validity.badInput) return { empty: false, bad: true, n: null };
    var v = String(el.value).trim();
    if (v === '') return { empty: true, bad: false, n: null };
    var n = Number(v);
    return { empty: false, bad: !isFinite(n) || n < 1.01 || n > 100000, n: n };
  }
  function checkOdds() {
    if (!tMin || !tMax) return;
    var a = oddsState(tMin), b = oddsState(tMax);
    var order = !a.bad && !b.bad && !a.empty && !b.empty && a.n > b.n;
    var text = (a.bad || b.bad) ? 'Use 1.01 to 100000' : (order ? 'Min must be ≤ max' : '');
    tMin.setAttribute('aria-invalid', (a.bad || order) ? 'true' : 'false');
    tMax.setAttribute('aria-invalid', (b.bad || order) ? 'true' : 'false');
    if (joined) joined.setAttribute('data-invalid', text ? 'true' : 'false');
    if (oddsMsg) oddsMsg.textContent = text;
  }
  [tMin, tMax].forEach(function (el) {
    if (!el) return;
    el.addEventListener('input', checkOdds);
    el.addEventListener('change', checkOdds);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && el.value !== '') { el.value = ''; checkOdds(); e.preventDefault(); }
    });
  });
  checkOdds();

  /* ---------- Matches per slip: pips ---------- */
  var row = q('#d12-pips'), mMin = q('#d12-teams-min'), mMax = q('#d12-teams-max');
  var hint = q('#d12-matches-hint'), hintSr = q('#d12-matches-hint-sr'), anyChip = q('#d12-any-chip');
  if (!row || !mMin || !mMax) return;
  var pips = qa('#d12-pips .d12-pip[data-n]'), anyPip = q('#d12-pips .d12-any');
  var MAXN = pips.length;
  if (!MAXN) return;

  var anchor = null;     /* first pip of a two-tap selection, awaiting the other end */
  var prevSel = null;    /* selection before the anchor was set (Escape restores it) */
  var preview = null;    /* {lo, hi} shown softly while hovering / focusing with an anchor set */
  var press = null;      /* active drag */
  var suppressUntil = 0; /* swallow the click that follows a drag */

    else if (!sel) { short = 'Any'; long = 'Any number of matches per slip'; state = 'any'; }
    else if (lo === hi) { short = 'Exactly ' + lo; long = 'Exactly ' + lo + (lo === 1 ? ' match' : ' matches') + ' per slip'; }

      else for (var i = 0; i < rs.length; i++) { if (x >= rs[i].l && x <= rs[i].r) { n = rs[i].n; break; } }

  row.addEventListener('keydown', function (e) {
    var pip = closest(e.target, '.d12-pip');

      case 'Home': next = list[0]; break;
      case 'End': next = list[list.length - 1]; break;

    if (anchor === null) return;

  });

  });
