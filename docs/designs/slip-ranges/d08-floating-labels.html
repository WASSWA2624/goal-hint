<!-- 08 Floating labels -->
<style>
.d08 .d08-targets { border: 0; margin: 0; min-inline-size: 0; }
.d08 .d08-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; min-inline-size: 0; }
.d08 .d08-group { display: flex; flex-direction: column; min-inline-size: 0; }
.d08 .d08-title { display: block; margin: 0 0 4px; font-size: 0.8125rem; font-weight: 700; line-height: 1.3; white-space: nowrap; }
.d08 .d08-pair { display: flex; min-inline-size: 0; }
.d08 .d08-field { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px; inline-size: 5.5rem; min-inline-size: 0; min-block-size: 2.625rem; padding: 5px 8px 4px;
  border: 1px solid var(--gh-control-border); border-radius: var(--gh-radius); background: var(--gh-surface); cursor: text; }
.d08 .d08-field + .d08-field { margin-inline-start: -1px; }
.d08 .d08-field:first-child { border-start-end-radius: 0; border-end-end-radius: 0; }
.d08 .d08-field:last-child { border-start-start-radius: 0; border-end-start-radius: 0; }
.d08 .d08-field:hover { border-color: var(--gh-muted); z-index: 1; }
.d08 .d08-field[data-invalid="true"] { border-color: var(--gh-error); z-index: 1; }
.d08 .d08-field:focus-within { border-color: var(--gh-brand); outline: 2px solid var(--gh-focus); outline-offset: 1px; z-index: 2; }
.d08 .d08-field[data-invalid="true"]:focus-within { border-color: var(--gh-error); outline-color: var(--gh-error); }
.d08 .d08-field:has(.d08-clear:focus-visible) { outline: 0; }
.d08 .d08-tag { display: block; align-self: flex-start; font-size: 0.6875rem; font-weight: 700; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gh-muted); cursor: text; }
.d08 .d08-field:focus-within .d08-tag { color: var(--gh-brand); }
.d08 .d08-field[data-invalid="true"] .d08-tag { color: var(--gh-error); }
.d08 .d08-input { display: block; inline-size: 100%; min-inline-size: 0; margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent;
  font-size: 0.9375rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--gh-text); }
.d08 .d08-input::placeholder { font-weight: 500; }
.d08 .d08-input:focus, .d08 .d08-input:focus-visible { outline: 0; }
.d08 .d08-clear { position: absolute; inset-block-start: 2px; inset-inline-end: 2px; display: none; align-items: center; justify-content: center; inline-size: 1.25rem; block-size: 1.25rem; padding: 0;
  border: 0; border-radius: var(--gh-radius); background: transparent; color: var(--gh-muted); cursor: pointer; }
.d08 .d08-field[data-set="true"]:hover .d08-clear, .d08 .d08-field[data-set="true"]:focus-within .d08-clear { display: inline-flex; }
.d08 .d08-clear:hover { color: var(--gh-text); background: var(--gh-surface-muted); }
.d08 .d08-clear > svg { display: block; }
.d08 .d08-note { flex: 0 1 auto; display: flex; align-items: center; min-block-size: 2.625rem; margin: 0; font-size: 0.75rem; font-weight: 600; line-height: 1.3; color: var(--gh-error); }
.d08 .d08-note:empty { display: none; }

@container panel (max-width: 640px) {
  .d08 .d08-row { gap: 10px 12px; }
  .d08 .d08-group { flex: 1 1 10rem; }
  .d08 .d08-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .d08 .d08-field { inline-size: auto; }
  .d08 .d08-note { flex-basis: 100%; min-block-size: 0; }
}

@media (pointer: coarse) {
  .d08 .d08-field { min-block-size: 44px; }
  .d08 .d08-field[data-set="true"]:hover .d08-clear, .d08 .d08-field[data-set="true"]:focus-within .d08-clear { display: none; }
}
</style>
<section class="gh-builder d08">
  <header class="gh-head">
    <h1>Slip builder</h1>
    <label class="gh-slips">Number of slips <input type="number" value="3" min="1" max="10" step="1" inputmode="numeric" aria-label="Number of slips"></label>
  </header>
  <div class="gh-panel">
    <form class="gh-form" onsubmit="return false">
      <fieldset class="gh-targets d08-targets">
        <legend class="sr-only">Your slips</legend>
        <div class="d08-row">
          <div class="d08-group">
            <span class="d08-title" id="d08-odds-title">Total odds per slip</span>
            <div class="d08-pair" role="group" aria-labelledby="d08-odds-title">
              <div class="d08-field" data-set="false" data-invalid="false">
                <label class="d08-tag" for="d08-total-min" id="d08-total-min-tag">Min</label>
                <input class="d08-input" type="number" name="totalMin" id="d08-total-min" value="2.50" placeholder="Any" min="1.01" max="100000" step="0.01" inputmode="decimal" autocomplete="off" aria-labelledby="d08-odds-title d08-total-min-tag" aria-describedby="d08-note" aria-invalid="false">
                <button type="button" class="d08-clear" tabindex="-1" aria-label="Clear minimum total odds (Any)"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" focusable="false"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
              </div>
              <div class="d08-field" data-set="false" data-invalid="false">
                <label class="d08-tag" for="d08-total-max" id="d08-total-max-tag">Max</label>
                <input class="d08-input" type="number" name="totalMax" id="d08-total-max" value="" placeholder="Any" min="1.01" max="100000" step="0.01" inputmode="decimal" autocomplete="off" aria-labelledby="d08-odds-title d08-total-max-tag" aria-describedby="d08-note" aria-invalid="false">
                <button type="button" class="d08-clear" tabindex="-1" aria-label="Clear maximum total odds (Any)"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" focusable="false"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
              </div>
            </div>
          </div>
          <div class="d08-group">
            <span class="d08-title" id="d08-matches-title">Matches per slip</span>
            <div class="d08-pair" role="group" aria-labelledby="d08-matches-title">
              <div class="d08-field" data-set="false" data-invalid="false">
                <label class="d08-tag" for="d08-teams-min" id="d08-teams-min-tag">Min</label>
                <input class="d08-input" type="number" name="teamsMin" id="d08-teams-min" value="2" placeholder="Any" min="1" max="8" step="1" inputmode="numeric" autocomplete="off" aria-labelledby="d08-matches-title d08-teams-min-tag" aria-describedby="d08-note" aria-invalid="false">
                <button type="button" class="d08-clear" tabindex="-1" aria-label="Clear minimum matches (Any)"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" focusable="false"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
              </div>
              <div class="d08-field" data-set="false" data-invalid="false">
                <label class="d08-tag" for="d08-teams-max" id="d08-teams-max-tag">Max</label>
                <input class="d08-input" type="number" name="teamsMax" id="d08-teams-max" value="5" placeholder="Any" min="1" max="8" step="1" inputmode="numeric" autocomplete="off" aria-labelledby="d08-matches-title d08-teams-max-tag" aria-describedby="d08-note" aria-invalid="false">
                <button type="button" class="d08-clear" tabindex="-1" aria-label="Clear maximum matches (Any)"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" focusable="false"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
              </div>
            </div>
          </div>
          <p class="d08-note" id="d08-note" role="status" aria-live="polite"></p>
        </div>
      </fieldset>
      <div class="gh-options">
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match limits</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match Date &amp; Time</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog" data-edited="false">Markets <small aria-hidden="true">4</small></button>
      </div>
      <div class="gh-actions">
        <a class="gh-button" href="#">Reset</a>
        <button type="submit" class="gh-button gh-primary">Build slips</button>
      </div>
    </form>
  </div>
</section>
<script>
(function () {
  var root = document.querySelector('.d08');
  if (!root) return;

  var note = root.querySelector('#d08-note');
  var groups = [
    { label: 'Total odds', lo: root.querySelector('#d08-total-min'), hi: root.querySelector('#d08-total-max'),
      min: 1.01, max: 100000, integer: false, rangeMsg: 'Total odds: enter 1.01 to 100000.' },
    { label: 'Matches', lo: root.querySelector('#d08-teams-min'), hi: root.querySelector('#d08-teams-max'),
      min: 1, max: 8, integer: true, rangeMsg: 'Matches: whole numbers 1 to 8.' }
  ];

  function fieldOf(input) { return input && input.closest ? input.closest('.d08-field') : null; }

  function parse(input) {
    if (!input) return null;
    var raw = String(input.value || '').trim();
    if (raw === '') return null;
    var n = Number(raw);
    return isFinite(n) ? n : NaN;
  }

  function inRange(g, n) {
    if (n === null) return true;
    if (isNaN(n)) return false;
    if (n < g.min || n > g.max) return false;
    if (g.integer && Math.floor(n) !== n) return false;
    return true;
  }

  function mark(input, bad) {
    if (!input) return;
    input.setAttribute('aria-invalid', bad ? 'true' : 'false');
    var f = fieldOf(input);
    if (f) f.setAttribute('data-invalid', bad ? 'true' : 'false');
  }

  function setState(input) {
    if (!input) return;
    var f = fieldOf(input);
    var typing = !!(input.validity && input.validity.badInput);
    var has = String(input.value || '').trim() !== '' || typing;
    if (f) f.setAttribute('data-set', has ? 'true' : 'false');
  }

  function validate() {
    var messages = [];
    groups.forEach(function (g) {
      if (!g.lo || !g.hi) return;
      var a = parse(g.lo), b = parse(g.hi);
      var badLo = !inRange(g, a), badHi = !inRange(g, b);
      var msg = '';
      if (badLo || badHi) {
        msg = g.rangeMsg;
      } else if (a !== null && b !== null && a > b) {
        badLo = badHi = true;
        msg = g.label + ': min is above max.';
      }
      mark(g.lo, badLo);
      mark(g.hi, badHi);
      if (msg) messages.push(msg);
    });
    if (note) note.textContent = messages.join(' ');
  }

  function format(g, input) {
    var n = parse(input);
    if (n === null || isNaN(n) || !inRange(g, n)) return;
    input.value = g.integer ? String(Math.round(n)) : n.toFixed(2);
  }

  groups.forEach(function (g) {
    [g.lo, g.hi].forEach(function (input) {
      if (!input) return;
      setState(input);
      input.addEventListener('input', function () { setState(input); validate(); });
      input.addEventListener('change', function () { format(g, input); setState(input); validate(); });
    });
  });

  Array.prototype.forEach.call(root.querySelectorAll('.d08-clear'), function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var f = btn.closest ? btn.closest('.d08-field') : null;
      var input = f ? f.querySelector('input') : null;
      if (!input) return;
      input.value = '';
      setState(input);
      validate();
      input.focus();
    });
  });

  Array.prototype.forEach.call(root.querySelectorAll('.d08-field'), function (f) {
    f.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('input, button, label')) return;
      var input = f.querySelector('input');
      if (input) input.focus();
    });
  });

  validate();
})();
</script>
