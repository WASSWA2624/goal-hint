<!-- 07 Range strip -->
<style>
/* 07 Range strip: pick a range by clicking two cells, like choosing a date range. */
.d07 .gh-form > .d07-targets { margin: 0; border: 0; min-inline-size: 0; }
@container panel (min-width: 641px) {
  .d07 .gh-form { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
}
.d07 .d07-grid { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; row-gap: 6px; align-items: center; min-inline-size: 0; }
.d07 .d07-odds { grid-row: 1; }
.d07 .d07-matches { grid-row: 2; }
.d07 .d07-label { grid-column: 1; white-space: nowrap; font-size: 0.75rem; font-weight: 700; line-height: 1.2; color: var(--gh-text); }
.d07 .d07-label > small { display: block; font-size: 0.6875rem; font-weight: 400; line-height: 1.2; color: var(--gh-muted); }

/* Strip of joined cells */
.d07 .d07-strip { grid-column: 2; display: flex; flex-wrap: nowrap; min-inline-size: 0; -webkit-user-select: none; user-select: none; }
.d07 .d07-cell { position: relative; flex: 1 1 0; min-inline-size: 0; min-block-size: 2.125rem; margin: 0 0 0 -1px; padding: 0 2px;
  border: 1px solid var(--gh-control-border); border-radius: 0; background: var(--gh-surface); color: var(--gh-text);
  font-size: 0.75rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; touch-action: manipulation;
  transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease; }
.d07 .d07-cell:first-child { margin-inline-start: 0; border-start-start-radius: var(--gh-radius); border-end-start-radius: var(--gh-radius); }
.d07 .d07-cell:last-child { border-start-end-radius: var(--gh-radius); border-end-end-radius: var(--gh-radius); }
.d07 .d07-any { flex: 0 0 auto; padding-inline: 8px; color: var(--gh-muted); }
.d07 .d07-cell:hover { background: var(--gh-surface-muted); }
.d07 .d07-cell.is-in { background: var(--gh-brand-soft); color: var(--gh-link); }
.d07 .d07-cell.is-fade-l { background: linear-gradient(90deg, var(--gh-surface), var(--gh-brand-soft)); }
.d07 .d07-cell.is-fade-r { background: linear-gradient(90deg, var(--gh-brand-soft), var(--gh-surface)); }
.d07 .d07-cell.is-fade-lr { background: linear-gradient(90deg, var(--gh-surface), var(--gh-brand-soft), var(--gh-surface)); }
.d07 .d07-cell.is-in:hover { background: color-mix(in srgb, var(--gh-brand) 20%, var(--gh-surface)); }
.d07 .d07-cell.is-end, .d07 .d07-any[aria-pressed="true"] { z-index: 1; background: var(--gh-brand); border-color: var(--gh-brand); color: var(--gh-surface); }
.d07 .d07-cell.is-end:hover, .d07 .d07-any[aria-pressed="true"]:hover { background: var(--gh-brand-hover); border-color: var(--gh-brand-hover); }
.d07 .d07-cell:focus-visible { z-index: 2; }

/* Exact readouts (odds) and the live summary (matches) */
.d07 .d07-readout { grid-column: 3; display: flex; align-items: center; gap: 4px; inline-size: 8.5rem; min-inline-size: 0; }
.d07 .d07-exact { flex: 1 1 0; inline-size: 3.75rem; min-inline-size: 0; min-block-size: 2.125rem; padding: 4px; border: 1px solid var(--gh-control-border); border-radius: var(--gh-radius);
  background: var(--gh-surface); color: var(--gh-text); font-size: 0.75rem; font-weight: 700; line-height: 1.25; text-align: center; font-variant-numeric: tabular-nums; }
.d07 .d07-exact[aria-invalid="true"] { border-color: var(--gh-error); color: var(--gh-error); }
.d07 .d07-dash { flex: none; color: var(--gh-muted); font-size: 0.75rem; }
.d07 .d07-summary { font-size: 0.75rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gh-text); }

/* Phone: label + readout on one line, strip full width beneath */
@container panel (max-width: 640px) {
  .d07 .d07-grid { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
  .d07 .d07-label.d07-odds { grid-area: 1 / 1 / 2 / 2; }
  .d07 .d07-readout.d07-odds { grid-area: 1 / 2 / 2 / 3; }
  .d07 .d07-strip.d07-odds { grid-area: 2 / 1 / 3 / 3; margin-block-end: 8px; }
  .d07 .d07-label.d07-matches { grid-area: 3 / 1 / 4 / 2; }
  .d07 .d07-readout.d07-matches { grid-area: 3 / 2 / 4 / 3; }
  .d07 .d07-strip.d07-matches { grid-area: 4 / 1 / 5 / 3; }
  .d07 .d07-label > small { display: inline; margin-inline-start: 2px; }
  .d07 .d07-readout { inline-size: auto; justify-self: end; }
  .d07 .d07-exact { flex: 0 0 auto; }
  .d07 .d07-any { padding-inline: 10px; }
}
@media (pointer: coarse) {
  .d07 .d07-cell, .d07 .d07-exact { min-block-size: 44px; }
}
</style>
<section class="gh-builder d07">
  <!-- KEEP -->
  <header class="gh-head">
    <h1>Slip builder</h1>
    <label class="gh-slips">Number of slips <input type="number" value="3" min="1" max="10" step="1" inputmode="numeric" aria-label="Number of slips"></label>
  </header>
  <div class="gh-panel">
    <form class="gh-form" onsubmit="return false">
      <fieldset class="gh-targets d07-targets">
        <legend class="sr-only">Your slips</legend>
        <div class="d07-grid">
          <span class="d07-label d07-odds" id="d07-odds-label">Total odds <small>per slip</small></span>

          </span>

          <span class="d07-label d07-matches" id="d07-matches-label">Matches <small>per slip</small></span>
          <div class="d07-strip d07-matches" id="d07-matches-strip" role="group" aria-labelledby="d07-matches-label" aria-describedby="d07-matches-summary" data-pending="false">
            <button type="button" class="d07-cell d07-any" data-any aria-pressed="false" aria-label="Any number of matches">Any</button>
            <button type="button" class="d07-cell" data-value="1" aria-pressed="false">1</button>
            <button type="button" class="d07-cell" data-value="2" aria-pressed="false">2</button>
            <button type="button" class="d07-cell" data-value="3" aria-pressed="false">3</button>
            <button type="button" class="d07-cell" data-value="4" aria-pressed="false">4</button>
            <button type="button" class="d07-cell" data-value="5" aria-pressed="false">5</button>
            <button type="button" class="d07-cell" data-value="6" aria-pressed="false">6</button>
            <button type="button" class="d07-cell" data-value="7" aria-pressed="false">7</button>
            <button type="button" class="d07-cell" data-value="8" aria-pressed="false">8</button>
          </div>
          <output class="d07-readout d07-summary d07-matches" id="d07-matches-summary" aria-live="polite">2 &ndash; 5</output>
          <input type="hidden" id="d07-teams-min" name="teamsMin" value="2">
          <input type="hidden" id="d07-teams-max" name="teamsMax" value="5">
        </div>
      </fieldset>
      <!-- KEEP (the three dialog buttons; do not restyle them) -->
      <div class="gh-options">
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match limits</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match Date &amp; Time</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog" data-edited="false">Markets <small aria-hidden="true">4</small></button>
      </div>

        <button type="submit" class="gh-button gh-primary">Build slips</button>
      </div>
    </form>

<script>
(function () {
  var root = document.querySelector('.d07');
  if (!root) return;

  function all(sel, ctx) { return Array.prototype.slice.call((ctx || root).querySelectorAll(sel)); }
  function num(str) { if (str == null || String(str).trim() === '') return null; var v = parseFloat(str); return isFinite(v) ? v : null; }
  function fmt(v) { return String(Math.round(v * 100) / 100); }

  function setup(cfg) {
    var strip = root.querySelector(cfg.strip);
    var minInput = root.querySelector(cfg.min);
    var maxInput = root.querySelector(cfg.max);
    if (!strip || !minInput || !maxInput) return;
    var summary = cfg.summary ? root.querySelector(cfg.summary) : null;
    var status = cfg.status ? root.querySelector(cfg.status) : null;
    var cells = all('.d07-cell', strip);
    var anyCell = null, ticks = [];
    cells.forEach(function (c) {
      if (c.hasAttribute('data-any')) { anyCell = c; return; }
      var v = num(c.getAttribute('data-value'));
      if (v != null) ticks.push({ el: c, value: v });
    });
    if (!ticks.length) return;

    /* min/max: committed bounds (null = Any). pending: first of two clicks made; anchor/hover: tick indexes. */
    var s = { min: num(minInput.value), max: num(maxInput.value), pending: false, anchor: -1, hover: -1, invalid: false };

    function clamp(v) { return Math.min(cfg.hi, Math.max(cfg.lo, v)); }
    function write() {
      minInput.value = s.min == null ? '' : fmt(s.min);
      maxInput.value = s.max == null ? '' : fmt(s.max);
    }
    function setInvalid(flag) {
      s.invalid = flag;
      [minInput, maxInput].forEach(function (inp) { if (inp.type !== 'hidden') inp.setAttribute('aria-invalid', flag ? 'true' : 'false'); });
    }
    function text() {
      if (s.invalid) return 'Min above max';
      if (s.pending) return fmt(ticks[s.anchor].value) + ' – ?';
      if (s.min == null && s.max == null) return 'Any';
      if (s.min != null && s.max != null) return s.min === s.max ? fmt(s.min) : fmt(s.min) + ' – ' + fmt(s.max);
      if (s.min != null) return fmt(s.min) + '+';
      return 'up to ' + fmt(s.max);
    }
    function spoken() {
      if (s.invalid) return 'Minimum is above maximum.';
      if (s.pending) return 'Start at ' + fmt(ticks[s.anchor].value) + '. Pick the end, or leave it open.';
      if (s.min == null && s.max == null) return 'Any';
      if (s.min != null && s.max != null) return s.min === s.max ? 'exactly ' + fmt(s.min) : fmt(s.min) + ' to ' + fmt(s.max);
      if (s.min != null) return fmt(s.min) + ' or more';
      return 'up to ' + fmt(s.max);
    }
    function paint() {
      var n = ticks.length, i, first = -1, last = -1, inR = [];
      var preview = s.pending && s.hover >= 0 && s.hover !== s.anchor;
      var pLo = Math.min(s.anchor, s.hover), pHi = Math.max(s.anchor, s.hover);
      for (i = 0; i < n; i++) {
        var v = ticks[i].value;
        var ok = !s.invalid && !(s.min == null && s.max == null) && (s.min == null || v >= s.min) && (s.max == null || v <= s.max);
        inR.push(ok);
        if (ok) { if (first < 0) first = i; last = i; }
      }
      for (i = 0; i < n; i++) {
        var el = ticks[i].el, end, mid, fadeL = false, fadeR = false;
        var exactLo = i === first && s.min != null && ticks[i].value === s.min;
        var exactHi = i === last && s.max != null && ticks[i].value === s.max;
        var cEnd = exactLo || exactHi;
        if (preview) { end = i === pLo || i === pHi; mid = i > pLo && i < pHi; }
        else {
          end = cEnd; mid = inR[i] && !end;
          if (cfg.fade && mid) { fadeL = i === first && !exactLo; fadeR = i === last && !exactHi; }
        }
        el.classList.toggle('is-end', end);
        el.classList.toggle('is-in', mid);
        el.classList.toggle('is-fade-l', fadeL && !fadeR);
        el.classList.toggle('is-fade-r', fadeR && !fadeL);
        el.classList.toggle('is-fade-lr', fadeL && fadeR);
        el.setAttribute('aria-pressed', cEnd ? 'true' : 'false');
      }
      var anyOn = !s.invalid && s.min == null && s.max == null;
      if (anyCell) anyCell.setAttribute('aria-pressed', anyOn ? 'true' : 'false');
      strip.setAttribute('data-pending', s.pending ? 'true' : 'false');
      if (!strip.contains(document.activeElement)) {
        var home = (anyOn || first < 0) ? (anyCell || ticks[0].el) : (s.min != null ? ticks[first].el : ticks[last].el);
        cells.forEach(function (c) { c.tabIndex = c === home ? 0 : -1; });
      }
      if (summary) summary.textContent = text();
      if (status) status.textContent = spoken();
      if (cfg.hint) maxInput.setAttribute('placeholder', s.pending ? '?' : 'Any');
    }
    function focusCell(el) {
      cells.forEach(function (c) { c.tabIndex = c === el ? 0 : -1; });
      el.focus();
    }

    /* Two-click range selection on the strip */
    if (anyCell) {
      anyCell.addEventListener('click', function () {
        s.min = null; s.max = null; s.pending = false; s.hover = -1;
        setInvalid(false); write(); paint(); focusCell(anyCell);
      });
      anyCell.addEventListener('pointerenter', function () { if (s.hover !== -1) { s.hover = -1; paint(); } });
      anyCell.addEventListener('focus', function () { if (s.hover !== -1) { s.hover = -1; paint(); } });
    }
    ticks.forEach(function (t, i) {
      t.el.addEventListener('click', function () {
        if (!s.pending) { s.pending = true; s.anchor = i; s.min = t.value; s.max = null; }
        else {
          var a = Math.min(s.anchor, i), b = Math.max(s.anchor, i);
          s.min = ticks[a].value; s.max = ticks[b].value; s.pending = false;
        }
        s.hover = -1; setInvalid(false); write(); paint(); focusCell(t.el);
      });
      t.el.addEventListener('pointerenter', function () { if (s.pending) { s.hover = i; paint(); } });
      t.el.addEventListener('focus', function () { if (s.pending) { s.hover = i; paint(); } });
    });
    strip.addEventListener('pointerleave', function () { if (s.hover !== -1) { s.hover = -1; paint(); } });
    strip.addEventListener('focusout', function (e) {
      if (e.relatedTarget && strip.contains(e.relatedTarget)) return;
      if (s.pending || s.hover !== -1) { s.pending = false; s.hover = -1; paint(); }
    });
    strip.addEventListener('keydown', function (e) {
      var idx = cells.indexOf(e.target);
      if (idx < 0) return;
      var n = cells.length, next = -1;
      switch (e.key) {
        case 'ArrowRight': case 'ArrowDown': next = (idx + 1) % n; break;
        case 'ArrowLeft': case 'ArrowUp': next = (idx - 1 + n) % n; break;
        case 'Home': next = 0; break;
        case 'End': next = n - 1; break;
        case 'Escape': if (s.pending) { e.preventDefault(); s.pending = false; s.hover = -1; paint(); } return;
        default: return;
      }
      e.preventDefault();
      focusCell(cells[next]);
    });

    /* Exact readouts: type any value; min > max is flagged while typing and swapped on blur */
    if (cfg.editable) {
      var onInput = function () {
        s.pending = false; s.hover = -1;
        s.min = num(minInput.value); s.max = num(maxInput.value);
        setInvalid(s.min != null && s.max != null && s.min > s.max);
        paint();
      };
      var onChange = function () {
        var lo = num(minInput.value), hi = num(maxInput.value);
        if (lo != null) lo = clamp(lo);
        if (hi != null) hi = clamp(hi);
        if (lo != null && hi != null && lo > hi) { var t = lo; lo = hi; hi = t; }
        s.min = lo; s.max = hi; s.pending = false; s.hover = -1;
        setInvalid(false); write(); paint();
      };
      [minInput, maxInput].forEach(function (inp) {
        inp.addEventListener('input', onInput);
        inp.addEventListener('change', onChange);
      });
    }

    paint();
  }

  setup({ strip: '#d07-odds-strip', min: '#d07-odds-min', max: '#d07-odds-max', status: '#d07-odds-status', lo: 1.01, hi: 100000, fade: true, editable: true, hint: true });
  setup({ strip: '#d07-matches-strip', min: '#d07-teams-min', max: '#d07-teams-max', summary: '#d07-matches-summary', lo: 1, hi: 8, fade: false });
})();
</script>
