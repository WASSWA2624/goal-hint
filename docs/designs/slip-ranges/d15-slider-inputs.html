<!-- 15 Slider + inputs -->
<style>
/* 15 · Slider + inputs — one line per range: label · dual-thumb slider · min/max inputs. Drag a thumb to a track end to clear that bound to Any. */
.d15 .d15-targets { --d15-th: 16px; --d15-row: var(--gh-control-h); --d15-label: 9.5rem; display: grid; row-gap: 6px; margin: 0; padding-inline-start: 12px; border: 0; min-inline-size: 0; }
.d15 .d15-row { display: grid; grid-template-columns: var(--d15-label) minmax(0, 1fr) auto; column-gap: 10px; align-items: center; min-inline-size: 0; min-block-size: var(--d15-row); }
.d15 .d15-label { font-size: 0.8125rem; font-weight: 700; line-height: 1.3; color: var(--gh-text); }

/* Slider shell: the whole band is the hit area; the two native ranges only draw thumbs and carry keyboard/ARIA. */
.d15 .d15-slider { position: relative; min-inline-size: 0; min-block-size: var(--d15-row); cursor: pointer; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.d15 .d15-slider.d15-dragging { cursor: grabbing; }
.d15 .d15-track { position: absolute; inset-inline: calc(var(--d15-th) / 2); inset-block-start: calc(50% - 2px); block-size: 4px; border-radius: var(--gh-radius); background: var(--gh-border); overflow: hidden; }
.d15 .d15-slider:hover .d15-track { background: rgba(0, 102, 245, 0.18); background: color-mix(in srgb, var(--gh-brand) 18%, var(--gh-border)); }
.d15 .d15-fill { position: absolute; inset-block: 0; inset-inline-start: calc(var(--d15-lo, 0) * 100%); inline-size: calc((var(--d15-hi, 1) - var(--d15-lo, 0)) * 100%); background: var(--gh-brand); }
.d15 .d15-slider[data-any-max="true"] .d15-fill { background: linear-gradient(to right, var(--gh-brand) 55%, rgba(0, 102, 245, 0.3)); background: linear-gradient(to right, var(--gh-brand) 55%, color-mix(in srgb, var(--gh-brand) 30%, var(--gh-surface))); }
.d15 .d15-slider[data-any-min="true"] .d15-fill { background: linear-gradient(to left, var(--gh-brand) 55%, rgba(0, 102, 245, 0.3)); background: linear-gradient(to left, var(--gh-brand) 55%, color-mix(in srgb, var(--gh-brand) 30%, var(--gh-surface))); }
.d15 .d15-slider[data-any-min="true"][data-any-max="true"] .d15-fill { background: linear-gradient(to right, rgba(0, 102, 245, 0.3), var(--gh-brand) 40%, var(--gh-brand) 60%, rgba(0, 102, 245, 0.3)); background: linear-gradient(to right, color-mix(in srgb, var(--gh-brand) 30%, var(--gh-surface)), var(--gh-brand) 40%, var(--gh-brand) 60%, color-mix(in srgb, var(--gh-brand) 30%, var(--gh-surface))); }
.d15 .d15-slider[data-invalid="true"] .d15-fill { background: var(--gh-error); }

.d15 .d15-range { position: absolute; inset-inline: 0; inset-block-start: calc(50% - var(--d15-th) / 2); inline-size: 100%; block-size: var(--d15-th); margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; pointer-events: none; }
.d15 .d15-range::-webkit-slider-runnable-track { height: var(--d15-th); background: transparent; border: 0; }
.d15 .d15-range::-moz-range-track { height: var(--d15-th); background: transparent; border: 0; }
.d15 .d15-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; box-sizing: border-box; width: var(--d15-th); height: var(--d15-th); margin: 0; border: 2px solid var(--gh-brand); border-radius: var(--gh-radius); background: var(--gh-brand); }
.d15 .d15-range::-moz-range-thumb { box-sizing: border-box; width: var(--d15-th); height: var(--d15-th); border: 2px solid var(--gh-brand); border-radius: var(--gh-radius); background: var(--gh-brand); }
.d15 .d15-range[data-any="true"]::-webkit-slider-thumb { background: var(--gh-surface); }
.d15 .d15-range[data-any="true"]::-moz-range-thumb { background: var(--gh-surface); }
.d15 .d15-slider[data-invalid="true"] .d15-range::-webkit-slider-thumb { border-color: var(--gh-error); background: var(--gh-error); }
.d15 .d15-slider[data-invalid="true"] .d15-range::-moz-range-thumb { border-color: var(--gh-error); background: var(--gh-error); }
.d15 .d15-slider[data-invalid="true"] .d15-range[data-any="true"]::-webkit-slider-thumb { background: var(--gh-surface); }
.d15 .d15-slider[data-invalid="true"] .d15-range[data-any="true"]::-moz-range-thumb { background: var(--gh-surface); }
.d15 .d15-range:focus-visible { outline: none; }
.d15 .d15-range:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--gh-focus); outline-offset: 2px; }
.d15 .d15-range:focus-visible::-moz-range-thumb { outline: 2px solid var(--gh-focus); outline-offset: 2px; }

/* Min – Max readouts, editable */
.d15 .d15-inputs { display: inline-flex; align-items: center; gap: 4px; justify-self: end; }
.d15 .d15-input { inline-size: 3.75rem; min-inline-size: 0; min-block-size: var(--d15-row); padding: 2px 6px; border: 1px solid var(--gh-control-border); border-radius: var(--gh-radius); background: var(--gh-surface); color: var(--gh-text); font-size: 0.8125rem; font-weight: 700; line-height: 1.25; text-align: center; font-variant-numeric: tabular-nums; }
.d15 .d15-input::placeholder { font-weight: 400; }
.d15 .d15-input[aria-invalid="true"] { border-color: var(--gh-error); color: var(--gh-error); }
.d15 .d15-dash { color: var(--gh-muted); font-size: 0.8125rem; line-height: 1; }

/* Layout: wide → beside the buttons; mid → above them full width; phone → stacked rows. */
@container panel (min-width: 641px) {
  .d15 .gh-form { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
}
@container panel (min-width: 641px) and (max-width: 880px) {
  .d15 .gh-form { grid-template-columns: minmax(0, 1fr); }
  .d15 .gh-form > .gh-targets { padding: 12px 12px 0; }
  .d15 .gh-form > .gh-options { padding: 10px 12px 12px; }
}
@container panel (max-width: 640px) {
  .d15 .d15-targets { row-gap: 10px; }
  .d15 .d15-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label inputs" "slider slider"; row-gap: 2px; }
  .d15 .d15-label { grid-area: label; }
  .d15 .d15-inputs { grid-area: inputs; }
  .d15 .d15-slider { grid-area: slider; }
}
@media (pointer: coarse) {
  .d15 .d15-targets { --d15-row: 44px; --d15-th: 20px; }
}
</style>
<section class="gh-builder d15">
  <header class="gh-head">
    <h1>Slip builder</h1>
    <label class="gh-slips">Number of slips <input type="number" value="3" min="1" max="10" step="1" inputmode="numeric" aria-label="Number of slips"></label>
  </header>
  <div class="gh-panel">
    <form class="gh-form" onsubmit="return false">
      <fieldset class="gh-targets d15-targets">
        <legend class="sr-only">Your slips</legend>
        <div class="d15-row" role="group" aria-labelledby="d15-total-label">
          <span class="d15-label" id="d15-total-label">Total odds per slip</span>
          <div class="d15-slider" id="d15-total-slider" data-any-min="false" data-any-max="true" data-invalid="false" style="--d15-lo: 0.131; --d15-hi: 1;">
            <span class="d15-track" aria-hidden="true"><span class="d15-fill"></span></span>
            <input type="range" class="d15-range" id="d15-total-range-min" min="0" max="1000" step="1" value="131" data-any="false" aria-label="Drag minimum total odds" aria-valuetext="2.50">
            <input type="range" class="d15-range" id="d15-total-range-max" min="0" max="1000" step="1" value="1000" data-any="true" aria-label="Drag maximum total odds" aria-valuetext="Any">
          </div>
          <div class="d15-inputs">
            <input class="d15-input" type="number" id="d15-total-min" name="totalMin" value="2.50" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" aria-label="Minimum total odds" aria-invalid="false" autocomplete="off">
            <span class="d15-dash" aria-hidden="true">–</span>
            <input class="d15-input" type="number" id="d15-total-max" name="totalMax" value="" min="1.01" max="100000" step="0.01" inputmode="decimal" placeholder="Any" aria-label="Maximum total odds" aria-invalid="false" autocomplete="off">
          </div>
        </div>
        <div class="d15-row" role="group" aria-labelledby="d15-teams-label">
          <span class="d15-label" id="d15-teams-label">Matches per slip</span>
          <div class="d15-slider" id="d15-teams-slider" data-any-min="false" data-any-max="false" data-invalid="false" style="--d15-lo: 0.1429; --d15-hi: 0.5714;">
            <span class="d15-track" aria-hidden="true"><span class="d15-fill"></span></span>
            <input type="range" class="d15-range" id="d15-teams-range-min" min="1" max="8" step="1" value="2" data-any="false" aria-label="Drag minimum matches per slip" aria-valuetext="2">
            <input type="range" class="d15-range" id="d15-teams-range-max" min="1" max="8" step="1" value="5" data-any="false" aria-label="Drag maximum matches per slip" aria-valuetext="5">
          </div>
          <div class="d15-inputs">
            <input class="d15-input" type="number" id="d15-teams-min" name="teamsMin" value="2" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" aria-label="Minimum matches per slip" aria-invalid="false" autocomplete="off">
            <span class="d15-dash" aria-hidden="true">–</span>
            <input class="d15-input" type="number" id="d15-teams-max" name="teamsMax" value="5" min="1" max="8" step="1" inputmode="numeric" placeholder="Any" aria-label="Maximum matches per slip" aria-invalid="false" autocomplete="off">
          </div>
        </div>
        <p class="sr-only" id="d15-status" role="status" aria-live="polite"></p>
      </fieldset>
      <div class="gh-options">
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match limits</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog">Match Date &amp; Time</button>
        <button type="button" class="gh-trigger" aria-haspopup="dialog" data-edited="false">Markets <small aria-hidden="true">4</small></button>
      </div>
      <div class="gh-actions">
        <a class="gh-button" href="#">Reset</a>
        <button type="submit" class="gh-button gh-primary">Build slips</button>
      </div>
    </form>
  </div>
</section>
<script>
(function () {
  var root = document.querySelector('.d15');
  if (!root) return;
  var status = root.querySelector('#d15-status');
  var sayTimer = 0;
  function say(message) {
    if (!status) return;
    status.textContent = '';
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function () { status.textContent = message; }, 40);
  }

  function build(cfg) {
    var slider = root.querySelector('#d15-' + cfg.key + '-slider');
    var rMin = root.querySelector('#d15-' + cfg.key + '-range-min');
    var rMax = root.querySelector('#d15-' + cfg.key + '-range-max');
    var iMin = root.querySelector('#d15-' + cfg.key + '-min');
    var iMax = root.querySelector('#d15-' + cfg.key + '-max');
    if (!slider || !rMin || !rMax || !iMin || !iMax) return;
    var track = slider.querySelector('.d15-track') || slider;
    var P0 = cfg.P0, P1 = cfg.P1;
    var state = { pMin: P0, pMax: P1, bad: false };

    function read(input) {
      var text = String(input.value || '').trim();
      if (text === '') return null;
      var n = Number(text);
      return isFinite(n) ? n : null;
    }
    function clampV(v) { return Math.min(cfg.hi, Math.max(cfg.lo, v)); }
    function clampP(p) { return Math.min(P1, Math.max(P0, Math.round(p))); }
    function posOf(v) { return clampP(cfg.toPos(clampV(v))); }
    function outOfRange(v) { return v !== null && (v < cfg.lo || v > cfg.hi); }
    function write(input, v) { input.value = v === null ? '' : cfg.format(v); }

    function paint() {
      var span = P1 - P0 || 1;
      var lo = (Math.min(state.pMin, state.pMax) - P0) / span;
      var hi = (Math.max(state.pMin, state.pMax) - P0) / span;
      slider.style.setProperty('--d15-lo', lo.toFixed(4));
      slider.style.setProperty('--d15-hi', hi.toFixed(4));
      rMin.value = String(state.pMin);
      rMax.value = String(state.pMax);
      var anyMin = read(iMin) === null, anyMax = read(iMax) === null;
      slider.setAttribute('data-any-min', anyMin ? 'true' : 'false');
      slider.setAttribute('data-any-max', anyMax ? 'true' : 'false');
      slider.setAttribute('data-invalid', state.bad ? 'true' : 'false');
      rMin.setAttribute('data-any', anyMin ? 'true' : 'false');
      rMax.setAttribute('data-any', anyMax ? 'true' : 'false');
      rMin.setAttribute('aria-valuetext', anyMin ? 'Any' : iMin.value);
      rMax.setAttribute('aria-valuetext', anyMax ? 'Any' : iMax.value);
    }

    /* Inputs are the source of truth; thumb positions derive from them. */
    function fromInputs(commit) {
      var a = read(iMin), b = read(iMax), swapped = false;
      if (commit) {
        if (a !== null) a = cfg.norm(clampV(a));
        if (b !== null) b = cfg.norm(clampV(b));
        if (a !== null && b !== null && a > b) { var t = a; a = b; b = t; swapped = true; }
        write(iMin, a);
        write(iMax, b);
      }
      var cross = a !== null && b !== null && a > b;
      var aBad = outOfRange(a) || cross, bBad = outOfRange(b) || cross;
      iMin.setAttribute('aria-invalid', aBad ? 'true' : 'false');
      iMax.setAttribute('aria-invalid', bBad ? 'true' : 'false');
      state.bad = aBad || bBad;
      state.pMin = a === null ? P0 : posOf(a);
      state.pMax = b === null ? P1 : posOf(b);
      paint();
      if (swapped) say(cfg.name + ': minimum and maximum swapped, now ' + cfg.format(a) + ' to ' + cfg.format(b) + '.');
    }

    /* Set one side to a value (null = Any), never letting it pass the other side. */
    function setSide(which, v) {
      var a = read(iMin), b = read(iMax);
      if (which === 'min') {
        if (v !== null && b !== null && v > b) v = b;
        write(iMin, v);
      } else {
        if (v !== null && a !== null && v < a) v = a;
        write(iMax, v);
      }
      fromInputs(false);
    }
    function fromSlider(which, p) {
      p = clampP(p);
      var atEnd = which === 'min' ? p <= P0 : p >= P1;
      setSide(which, atEnd ? null : cfg.snap(cfg.fromPos(p)));
    }

    /* Typed values */
    function onType(e) {
      var input = e.currentTarget;
      if (input.validity && input.validity.badInput) return; /* mid-typing "2." — hold the previous state */
      fromInputs(false);
    }
    iMin.addEventListener('input', onType);
    iMax.addEventListener('input', onType);
    iMin.addEventListener('change', function () { fromInputs(true); });
    iMax.addEventListener('change', function () { fromInputs(true); });

    /* Keyboard on the thumbs: native for linear scales; stepped in value space for the log scale */
    rMin.addEventListener('input', function () { fromSlider('min', Number(rMin.value)); });
    rMax.addEventListener('input', function () { fromSlider('max', Number(rMax.value)); });
    function onKey(e) {
      if (!cfg.keyStep) return;
      var dir = 0, big = false;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') dir = 1;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') dir = -1;
      else if (e.key === 'PageUp') { dir = 1; big = true; }
      else if (e.key === 'PageDown') { dir = -1; big = true; }
      else return;
      e.preventDefault();
      var which = e.currentTarget === rMin ? 'min' : 'max';
      var cur = read(which === 'min' ? iMin : iMax);
      if (cur === null) cur = which === 'min' ? cfg.lo : cfg.top;
      cur = Math.min(cfg.top, Math.max(cfg.lo, cur));
      var next = cfg.keyStep(cur, dir, big);
      if (which === 'min' && next <= cfg.lo) next = null;
      if (which === 'max' && next >= cfg.top) next = null;
      setSide(which, next);
    }
    rMin.addEventListener('keydown', onKey);
    rMax.addEventListener('keydown', onKey);

    /* Pointer: the whole band is the target; the nearest thumb follows the pointer. */
    var dragging = false, pending = false, active = null, startX = 0;
    function posFromEvent(e) {
      var rect = track.getBoundingClientRect();
      if (!rect.width) return P0;
      var f = (e.clientX - rect.left) / rect.width;
      f = Math.min(1, Math.max(0, f));
      return P0 + f * (P1 - P0);
    }
    function focusRange(which) {
      var el = which === 'min' ? rMin : rMax;
      try { el.focus({ preventScroll: true }); } catch (err) { el.focus(); }
    }
    slider.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var p = posFromEvent(e);
      var tol = (P1 - P0) * 0.01;
      var dMin = Math.abs(p - state.pMin), dMax = Math.abs(p - state.pMax);
      dragging = true; pending = false; active = null; startX = e.clientX;
      if (Math.abs(state.pMin - state.pMax) <= tol && Math.min(dMin, dMax) <= tol * 4) {
        pending = true; /* thumbs stacked: decide by the first move direction */
      } else {
        if (dMin < dMax) active = 'min';
        else if (dMax < dMin) active = 'max';
        else active = p < state.pMin ? 'min' : 'max';
        fromSlider(active, p);
        focusRange(active);
      }
      slider.classList.add('d15-dragging');
      if (slider.setPointerCapture) { try { slider.setPointerCapture(e.pointerId); } catch (err) {} }
      e.preventDefault();
    });
    slider.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      if (pending) {
        var dx = e.clientX - startX;
        if (Math.abs(dx) < 3) return;
        pending = false;
        active = dx < 0 ? 'min' : 'max';
        focusRange(active);
      }
      if (active) fromSlider(active, posFromEvent(e));
    });
    function endDrag() {
      if (!dragging) return;
      if (pending) focusRange(state.pMin > (P0 + P1) / 2 ? 'min' : 'max');
      dragging = false; pending = false; active = null;
      slider.classList.remove('d15-dragging');
    }
    slider.addEventListener('pointerup', endDrag);
    slider.addEventListener('pointercancel', endDrag);

    fromInputs(false);
  }

  var LN = Math.log(1000 / 1.01);
  build({
    key: 'total', name: 'Total odds', lo: 1.01, hi: 100000, top: 1000, P0: 0, P1: 1000,
    toPos: function (v) { return Math.round(1000 * Math.log(v / 1.01) / LN); },
    fromPos: function (p) { return 1.01 * Math.exp(LN * p / 1000); },
    snap: function (v) { return v >= 100 ? Math.round(v) : Math.round(v * 100) / 100; },
    norm: function (v) { return Math.round(v * 100) / 100; },
    format: function (v) { return v >= 100 ? String(Math.round(v * 100) / 100) : v.toFixed(2); },
    keyStep: function (cur, dir, big) {
      var mag = cur < 10 ? 0.1 : cur < 100 ? 1 : 10;
      if (big) mag *= 10;
      var cents = Math.round(cur * 100), step = Math.round(mag * 100);
      var next = dir > 0 ? (Math.floor(cents / step + 1e-9) + 1) * step : (Math.ceil(cents / step - 1e-9) - 1) * step;
      return next / 100;
    }
  });
  build({
    key: 'teams', name: 'Matches', lo: 1, hi: 8, top: 8, P0: 1, P1: 8,
    toPos: function (v) { return Math.round(v); },
    fromPos: function (p) { return Math.round(p); },
    snap: function (v) { return Math.round(v); },
    norm: function (v) { return Math.round(v); },
    format: function (v) { return String(Math.round(v)); }
  });
})();
</script>
