<style>
:root { color-scheme:light; --page:#edf7ff; --paper:#fff; --ink:#05234e; --muted:#536b88; --line:#c5d8ef; --control:#aec8e8; --blue:#0065f8; --tint:#edf4ff; --disabled:#f0f3f7; --backdrop:#071c3e80; }

[hidden] { display:none!important; }

button,input,select { font:inherit; color:inherit; border-radius:0; }
button,select,input[type=checkbox] { cursor:pointer; }

input[type=checkbox] { margin:0; width:16px; height:16px; flex:none; accent-color:var(--blue); }
label { min-width:0; }
.top { position:sticky; inset-block-start:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line); }
.top-inner { max-width:1540px; padding:13px 24px; margin:auto; display:flex; align-items:center; gap:10px; }

.design-label { display:flex; align-items:center; gap:8px; }

.counter { min-width:43px; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums; }
.gallery { max-width:1540px; margin:22px auto; padding:0 24px 40px; }
.concept-heading { display:flex; align-items:baseline; gap:14px; margin-bottom:18px; }

.pair { display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:24px; align-items:start; }
.preview-label { color:var(--muted); font-size:12px; margin-bottom:8px; }
.preview { min-width:0; }
.surface { --space:10px; background:var(--page); border-top:2px solid #18a2ff; padding:var(--space); min-width:0; }

.fp { display:grid; align-items:center; gap:8px; min-width:0; }
.fp-heading,.search-row { display:flex; align-items:center; gap:10px; min-width:0; }

.period > span { font-size:11px; }

.search::before { content:'⌕'; flex:none; color:var(--muted); font-size:22px; line-height:1; }
.search input:not([type=checkbox]) { border:0; background:transparent; padding-inline:0; }
.options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; min-width:0; }
.option { display:flex; align-items:center; justify-content:center; gap:5px; min-width:0; padding:6px; font-size:12px; line-height:1.25; min-height:38px; }
.option > span { min-width:0; }
.filter-count { display:inline-flex; align-items:center; justify-content:center; flex:none; min-width:17px; height:17px; padding:1px 3px; background:var(--tint); color:var(--blue); font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
.option[data-edited=true] { background:var(--tint); border-color:#8db7ee; }
.footer { display:flex; flex-wrap:nowrap; align-items:center; gap:6px; min-width:0; }
.picks { display:flex; flex:1; align-items:center; gap:6px; min-height:36px; font-size:12px; white-space:nowrap; }
.footer > button,.sort-button { padding-inline:10px; font-size:12px; white-space:nowrap; }
.reset { color:var(--muted); }
.sort { position:relative; flex:none; }

.sort-button[data-active=true] { color:var(--blue); background:var(--tint); }
.sort-menu { position:absolute; z-index:12; top:calc(100% + 4px); left:0; width:168px; padding:4px; border:1px solid var(--control); background:var(--paper); box-shadow:0 4px 14px #071c3e17; }
.sort-menu button { display:flex; align-items:center; gap:7px; width:100%; min-height:36px; padding:7px 6px; text-align:left; border:0; font-size:12px; font-weight:400; }
.sort-menu button[aria-checked=true] { color:var(--blue); background:var(--tint); }
.sort-menu .checkmark { width:12px; flex:none; }
.mobile { container-type:inline-size; }

.mobile .fp-heading,.mobile .search-row { gap:7px; }
.mobile .period { width:131px; }
.mobile .period > span { display:none; }
.mobile .period select { font-size:12px; }
.mobile .search input { font-size:16px; }
.mobile input:not([type=checkbox]),.mobile select { min-height:40px; }
.mobile .option { min-height:44px; font-size:12px; padding:5px 3px; }
.mobile .footer { gap:4px; }
.mobile .picks { flex:none; min-height:40px; gap:5px; }
.mobile .sort { flex:1; min-width:0; }
.mobile .footer > button,.mobile .sort-button { min-height:40px; font-size:12px; padding-inline:6px; }
.mobile .sort-button { gap:4px; }

[data-concept=search] .search-row .period { width:166px; }

.preview-status { min-height:20px; padding-top:5px; font-size:11px; color:var(--muted); }
.footnote { margin:20px 0 0; color:var(--muted); font-size:12px; }

.field { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }

.checks-search { margin:0 0 7px; }

@container(max-width:340px) {

@media(max-width:1100px) { .pair { grid-template-columns:minmax(0,1fr) 360px; gap:16px; } .desktop .period { width:146px; } .desktop .period > span { display:none; } }

<body class="desktop-gallery">
<header class="top">
  <div class="top-inner">
    <div class="top-title">Desktop refinements · 10 samples<small>Compact Stack · Mobile retained unchanged</small></div>
    <label class="design-label" for="design"><span>Design</span><select id="design" aria-label="Choose design"></select></label>
    <button id="previous" aria-label="Previous design" type="button">Previous</button>
    <span class="counter" id="counter" aria-live="polite"></span>
    <button id="next" aria-label="Next design" type="button">Next</button>
  </div>
</header>
<main class="gallery">
  <div class="concept-heading"><h1 id="concept-name"></h1><p id="concept-description"></p></div>
  <div id="sample" class="pair"></div>
  <p class="footnote">Desktop design samples. Explore the dialogs, period choices and sorting. The mobile design is unchanged.</p>
</main>
<dialog id="settings" aria-labelledby="dialog-title">
  <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" aria-label="Close dialog">×</button></div>
  <div class="dialog-body" id="dialog-body"></div>
  <div class="dialog-actions"><button type="button" id="cancel-dialog">Cancel</button><button type="button" class="primary" id="save-dialog">Done</button></div>
</dialog>
<script>
(() => {
  'use strict';
  const concepts = [
    ['stack','Crisp Outline','Clean white controls with precise borders and a clear primary action.'],
    ['search','Soft Surface','Subtle field surfaces with quieter outlines.'],
    ['joined','Connected Sections','One continuous strip for the optional sections.'],
    ['connected','Defined Header','A restrained heading band gives the controls a clear starting point.'],
    ['quiet','Framed Workspace','A single frame and stronger field definition.'],
    ['framed','Quiet Rules','Minimal framing with simple horizontal rules.'],
    ['inset','Compact Professional','Tighter geometry with full-size, readable labels.'],
    ['slim','Neutral Contrast','Stronger neutral controls with blue reserved for emphasis.'],
    ['dense','Action Shelf','One calm surface groups the four footer controls.'],
    ['tap','Aligned Fields','Text-led controls with consistent counts and dropdown cues.'],
  ];
  const desktopFinishes=['crisp','soft','connected','header','framed','rules','compact','neutral','shelf','aligned'];
  const periods = [['last30','Last 30 days'],['last7','Last 7 days'],['last3','Last 3 days'],['yesterday','Yesterday'],['today','Today'],['tomorrow','Tomorrow'],['custom','Custom dates']];
  const sorts = ['Latest first','Earliest first','Highest chance','Lowest chance'];
  const marketNames = ['Match result','Double chance','Total goals (2.5)','Both teams to score'];
  const leagueNames = ['Premier League','La Liga','Serie A','Bundesliga','Ligue 1','Uganda Premier League'];
  const countryNames = ['England','Spain','Italy','Germany','France','Uganda'];
  const defaults = () => ({ search:'',period:'last30',dateFrom:'2026-09-25',dateTo:'2026-10-24',timeFrom:'00:00',timeTo:'23:59',zone:'eat',leagues:[],countries:[],markets:[...marketNames],probMin:'',probMax:'',picks:false,sort:'Latest first' });
  const clone = value => JSON.parse(JSON.stringify(value));
  const states = concepts.map(defaults);
  const selector = document.getElementById('design');
  const sample = document.getElementById('sample');
  const dialog = document.getElementById('settings');
  const dialogBody = document.getElementById('dialog-body');
  let index = 0, active = null, dialogDraft = null;
  const escape = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  const optionHtml = (items,selected) => items.map(item => { const [value,label] = Array.isArray(item) ? item : [item,item]; return `<option value="${escape(value)}" ${selected===value?'selected':''}>${escape(label)}</option>`; }).join('');
  const dateAfter = (value,days) => { const date = new Date(`${value}T12:00:00Z`); date.setUTCDate(date.getUTCDate()+days); return date.toISOString().slice(0,10); };
  function setPeriod(state,period) {
    state.period = period;
    if(period==='custom') return;
    const offsets={last30:[-29,0],last7:[-6,0],last3:[-2,0],yesterday:[-1,-1],today:[0,0],tomorrow:[1,1]}[period];
    if(!offsets) return;
    state.dateFrom=dateAfter('2026-10-24',offsets[0]);
    state.dateTo=dateAfter('2026-10-24',offsets[1]);
  }
  function edited(group,state) {
    if(group==='dates') return state.dateFrom!=='2026-09-25'||state.dateTo!=='2026-10-24'||state.timeFrom!=='00:00'||state.timeTo!=='23:59'||state.zone!=='eat';
    if(group==='competitions') return state.leagues.length>0||state.countries.length>0;
    return state.markets.length!==4||state.probMin!==''||state.probMax!=='';
  }
  // Shared stroke geometry from the app's existing icon set.
  function icon(name) {
    const shapes={
      search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      dates:'<rect x="3" y="5" width="18" height="16"/><path d="M7 3v4M17 3v4M3 11h18"/>',
      competitions:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',
      limits:'<path d="M4 7h4M12 7h8M4 17h8M16 17h4M8 4v6M16 14v6"/>',
      chevron:'<path d="m6 9 6 6 6-6"/>',
      reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/>',
      filter:'<path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8L4 5Z"/>',
    };
    return `<svg class="control-icon icon-${name} ${['dates','competitions','limits'].includes(name)?'icon-leading':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${shapes[name]}</svg>`;
  }
  function trigger(group,label,state,device) {
    const count=group==='dates' ? Number(state.dateFrom!=='2026-09-25'||state.dateTo!=='2026-10-24')+Number(state.timeFrom!=='00:00'||state.timeTo!=='23:59'||state.zone!=='eat')
      : group==='competitions' ? state.leagues.length+state.countries.length : state.markets.length+Number(state.probMin!==''||state.probMax!=='');
    const description=group==='dates' ? `${count} active ${count===1?'range':'ranges'}`
      : group==='competitions' ? count?`${count} selected ${count===1?'competition or country':'competitions and countries'}`:'All leagues and countries'
      : `${state.markets.length} selected markets${state.probMin!==''||state.probMax!==''?', 1 active probability range':''}`;
    return `<button class="option" type="button" data-dialog="${group}" data-edited="${edited(group,state)}" aria-haspopup="dialog" aria-label="${escape(label)}, ${escape(description)}" title="${escape(description)}">${device==='desktop'?icon(group):''}<span${device==='desktop'?' class="option-label"':''}>${escape(label)}</span>${count?`<b class="filter-count" aria-hidden="true">${count}</b>`:''}${device==='desktop'?icon('chevron'):''}</button>`;
  }
  function screen(device) {
    const state = states[index],periodInSearch=device==='mobile'&&['search','joined'].includes(concepts[index][0]);
    const period=`<div class="period"><span>Period</span><select name="period" aria-label="Prediction period">${optionHtml(periods,state.period)}</select></div>`;
    const sortOptions=sorts.map(value=>`<button type="button" role="menuitemradio" tabindex="-1" aria-checked="${state.sort===value}" data-sort-option="${escape(value)}"><span class="checkmark" aria-hidden="true">${state.sort===value?'✓':''}</span>${escape(value)}</button>`).join('');
    return `<section class="preview ${device}" ${device==='desktop'?`data-finish="${desktopFinishes[index]}" `:''}aria-label="${device==='desktop'?'Desktop':'Mobile'} preview"><div class="preview-label">${device==='desktop'?'Desktop':'Mobile'}</div><div class="surface"><form class="fp" data-device="${device}">
      <div class="fp-heading"><h2>Football Predictions</h2>${periodInSearch?'':period}</div>
      <div class="search-row"><label class="search">${device==='desktop'?icon('search'):''}<span class="sr">Team or league</span><input type="search" name="search" aria-label="Team or league" maxlength="120" placeholder="Team or league" value="${escape(state.search)}"></label>${periodInSearch?period:''}</div>
      <div class="options">${trigger('dates','Match Date & Time',state,device)}${trigger('competitions','Leagues & Countries',state,device)}${trigger('limits','Markets & Limits',state,device)}</div>
      <div class="footer">
        <label class="picks"><input type="checkbox" name="picks" ${state.picks?'checked':''}>Picks only</label>
        <div class="sort"><input type="hidden" name="sort" value="${escape(state.sort)}"><button type="button" class="sort-button" data-sort-toggle data-active="${state.sort!=='Latest first'}" aria-haspopup="menu" aria-expanded="false" aria-controls="sort-${device}" aria-label="Sort by: ${escape(state.sort)}" title="${escape(state.sort)}">${device==='desktop'?`<span>Sort by</span><b class="sort-current">${escape(state.sort)}</b>${icon('chevron')}`:'Sort by <span aria-hidden="true">⌄</span>'}</button><div class="sort-menu" id="sort-${device}" role="menu" aria-label="Sort predictions" hidden>${sortOptions}</div></div>
        <button class="reset" type="button" data-reset>${device==='desktop'?icon('reset'):''}Reset</button>
        <button class="primary" type="submit">${device==='desktop'?icon('filter'):''}Apply filters</button>
      </div>
    </form></div><div class="preview-status" aria-live="polite"></div></section>`;
  }
  function render() {
    const concept = concepts[index];
    sample.dataset.concept = concept[0];
    sample.innerHTML = screen('desktop') + screen('mobile');
    document.getElementById('concept-name').textContent = `${index+1}. ${concept[1]}`;
    document.getElementById('concept-description').textContent = concept[2];
    document.getElementById('counter').textContent = `${index+1} / 10`;
    selector.value = concept[0];
    document.getElementById('previous').disabled = index===0;
    document.getElementById('next').disabled = index===9;
  }
  function choose(value) {
    const found = concepts.findIndex(item=>item[0]===value);
    const next = found<0?0:found;
    if(dialog.open) closeDialog();
    index = next; history.replaceState(null,'',`#${concepts[index][0]}`); render();
  }
  selector.innerHTML = concepts.map((item,number)=>`<option value="${item[0]}">${number+1}. ${item[1]}</option>`).join('');
  selector.addEventListener('change',()=>choose(selector.value));
  document.getElementById('previous').addEventListener('click',()=>choose(concepts[Math.max(0,index-1)][0]));
  document.getElementById('next').addEventListener('click',()=>choose(concepts[Math.min(9,index+1)][0]));
  window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));
  function copyControls(target) {
    const form = target.closest('form');
    if(!form) return;
    const state = states[index];
    state.search = form.elements.search.value;
    state.picks = form.elements.picks.checked;
    state.sort = form.elements.sort.value;
    if(target.name==='period'&&target.value!=='custom') setPeriod(state,target.value);
    sample.querySelectorAll('form').forEach(other=>{
      if(other===form) return;
      other.elements.search.value=state.search; other.elements.picks.checked=state.picks; other.elements.sort.value=state.sort; other.elements.period.value=state.period;
    });
  }
  sample.addEventListener('input',event=>copyControls(event.target));
  sample.addEventListener('change',event=>{
    const target=event.target,device=target.closest('form')?.dataset.device;
    copyControls(target);
    if(target.name==='period') {
      render();
      if(target.value==='custom') openDialog('dates',device);
      else sample.querySelector(`form[data-device="${device}"] [name="period"]`)?.focus();
    }
  });
  sample.addEventListener('submit',event=>{
    event.preventDefault(); copyControls(event.target.elements.search);
    sample.querySelectorAll('.preview-status').forEach(element=>element.textContent='Filters applied to this preview.');
  });
  sample.addEventListener('click',event=>{
    const button=event.target.closest('button'); if(!button) return;
    const device=button.closest('form')?.dataset.device;
    if(button.hasAttribute('data-reset')) { states[index]=defaults(); render(); sample.querySelector(`form[data-device="${device}"] [data-reset]`)?.focus(); return; }
    if(button.hasAttribute('data-sort-toggle')) {
      const menu=button.nextElementSibling,wasOpen=button.getAttribute('aria-expanded')==='true';
      closeSortMenus();
      if(!wasOpen) { menu.hidden=false; button.setAttribute('aria-expanded','true'); menu.querySelector('[aria-checked="true"]')?.focus(); }
      return;
    }
    if(button.dataset.sortOption) {
      states[index].sort=button.dataset.sortOption; render();
      sample.querySelector(`form[data-device="${device}"] [data-sort-toggle]`)?.focus(); return;
    }
    if(button.dataset.dialog) openDialog(button.dataset.dialog,button.closest('form').dataset.device);
  });
  function closeSortMenus() {
    sample.querySelectorAll('[data-sort-toggle]').forEach(button=>button.setAttribute('aria-expanded','false'));
    sample.querySelectorAll('.sort-menu').forEach(menu=>menu.hidden=true);
  }
  document.addEventListener('click',event=>{if(!event.target.closest('.sort'))closeSortMenus();});
  sample.addEventListener('focusout',event=>{
    const sort=event.target.closest('.sort');
    if(sort&&!sort.contains(event.relatedTarget))closeSortMenus();
  });
  sample.addEventListener('keydown',event=>{
    const sort=event.target.closest('.sort'); if(!sort)return;
    const menu=sort.querySelector('.sort-menu'),button=sort.querySelector('[data-sort-toggle]');
    if(event.key==='Escape') { event.preventDefault(); closeSortMenus(); button.focus(); return; }
    if(!['ArrowDown','ArrowUp','Home','End'].includes(event.key))return;
    event.preventDefault(); menu.hidden=false; button.setAttribute('aria-expanded','true');
    const items=Array.from(menu.querySelectorAll('button')),current=items.indexOf(document.activeElement);
    const next=event.key==='Home'?0:event.key==='End'?items.length-1:event.key==='ArrowDown'?(current+1)%items.length:current<0?items.length-1:(current-1+items.length)%items.length;
    items[next].focus();
  });
  const field=(label,name,type='number',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${escape(dialogDraft[name]??'')}" ${type==='number'?'placeholder="Any" step="any"':''} ${extra}></label>`;
  const check=(name,value,checked)=>`<label class="check"><input type="checkbox" name="${name}" value="${escape(value)}" ${checked?'checked':''}>${escape(value)}</label>`;
  function openDialog(group,device) {
    active={group,device}; dialogDraft=clone(states[index]);
    dialog.classList.toggle('phone-dialog',device==='mobile');
    document.getElementById('dialog-title').textContent={dates:'Match Date & Time',competitions:'Leagues & Countries',limits:'Markets & Limits'}[group];
    if(group==='dates') dialogBody.innerHTML=`<div class="fields">${field('From date','dateFrom','date')}${field('To date','dateTo','date')}${field('From time','timeFrom','time')}${field('To time','timeTo','time')}<label class="field full">Timezone<select name="zone">${optionHtml([['eat','EAT · Africa/Kampala'],['local','My local timezone']],dialogDraft.zone)}</select></label></div>`;
    if(group==='competitions') dialogBody.innerHTML=[['leagues','Leagues',leagueNames],['countries','Countries',countryNames]].map(([name,label,names])=>`<fieldset><legend>${label}</legend><input class="checks-search" type="search" data-search-list="${name}" aria-label="Search ${label.toLowerCase()}" placeholder="Search ${label.toLowerCase()}"><label class="check"><input type="checkbox" data-all="${name}" ${dialogDraft[name].length===0?'checked':''}>All ${label.toLowerCase()}</label><div class="check-grid" data-list="${name}">${names.map(value=>check(name,value,dialogDraft[name].includes(value))).join('')}</div></fieldset>`).join('');
    if(group==='limits') dialogBody.innerHTML=`<fieldset><legend>Markets</legend>${marketNames.map(value=>check('markets',value,dialogDraft.markets.includes(value))).join('')}</fieldset><fieldset><legend>Probability %</legend><div class="fields">${field('Min','probMin','number','min="0" max="100"')}${field('Max','probMax','number','min="0" max="100"')}</div></fieldset><fieldset disabled><legend>Odds · unavailable</legend><div class="fields"><label class="field">Min<input type="number" placeholder="Any" disabled></label><label class="field">Max<input type="number" placeholder="Any" disabled></label></div></fieldset>`;
    dialog.showModal();
    dialogBody.querySelector('input,select')?.focus();
  }
  function closeDialog() {
    const previous=active; dialog.close(); active=null; dialogDraft=null;
    sample.querySelector(`form[data-device="${previous?.device}"] [data-dialog="${previous?.group}"]`)?.focus();
  }
  dialogBody.addEventListener('input',event=>{
    const target=event.target;
    if(target.dataset.searchList) {
      const list=dialogBody.querySelector(`[data-list="${target.dataset.searchList}"]`);
      list.querySelectorAll('label').forEach(label=>label.hidden=!label.textContent.toLowerCase().includes(target.value.toLowerCase())); return;
    }
    if(target.name&&target.type!=='checkbox') dialogDraft[target.name]=target.value;
  });
  dialogBody.addEventListener('change',event=>{
    const target=event.target;
    if(target.dataset.all) { dialogDraft[target.dataset.all]=[]; dialogBody.querySelectorAll(`input[name="${target.dataset.all}"]`).forEach(input=>input.checked=false); target.checked=true; return; }
    if(target.type==='checkbox'&&target.name) {
      dialogDraft[target.name]=Array.from(dialogBody.querySelectorAll(`input[name="${target.name}"]:checked`),input=>input.value);
      const all=dialogBody.querySelector(`[data-all="${target.name}"]`); if(all) all.checked=dialogDraft[target.name].length===0;
    } else if(target.name) dialogDraft[target.name]=target.value;
  });
  function saveDialog() {
    dialogBody.querySelector('.error')?.remove();
    let error='';
    if(active.group==='dates') {
      const days=(new Date(dialogDraft.dateTo)-new Date(dialogDraft.dateFrom))/86400000;
      if(!dialogDraft.dateFrom||!dialogDraft.dateTo||!Number.isFinite(days)||days<0||days>365) error='Choose a valid date range of up to 366 days.';
      else if(!dialogDraft.timeFrom||!dialogDraft.timeTo||dialogDraft.timeFrom>dialogDraft.timeTo) error='Choose a valid daily time range.';
      const before=states[index];
      if(dialogDraft.dateFrom!==before.dateFrom||dialogDraft.dateTo!==before.dateTo) dialogDraft.period='custom';
    }
    if(active.group==='limits') {
      const min=dialogDraft.probMin===''?0:Number(dialogDraft.probMin),max=dialogDraft.probMax===''?100:Number(dialogDraft.probMax);
      if(!dialogDraft.markets.length) error='Select at least one market.';
      else if(!Number.isFinite(min)||!Number.isFinite(max)||min<0||max>100||min>max) error='Enter a probability range between 0 and 100%.';
      if(!error) { if(min===0) dialogDraft.probMin=''; if(max===100) dialogDraft.probMax=''; }
    }
    if(error) { const notice=document.createElement('p'); notice.className='error'; notice.role='alert'; notice.textContent=error; dialogBody.prepend(notice); return; }
    const previous={...active};
    states[index]=clone(dialogDraft); dialog.close(); active=null; dialogDraft=null; render();
    sample.querySelector(`form[data-device="${previous.device}"] [data-dialog="${previous.group}"]`)?.focus();
  }
  document.getElementById('close-dialog').addEventListener('click',closeDialog);
  document.getElementById('cancel-dialog').addEventListener('click',closeDialog);
  document.getElementById('save-dialog').addEventListener('click',saveDialog);
  dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
  dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const bounds=dialog.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)closeDialog();});
  dialog.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.tagName==='INPUT'&&event.target.type!=='search'){event.preventDefault();saveDialog();}});
  choose(location.hash.slice(1)||'stack');
})();
</script>
</body>
</html>
