@media(max-width:850px) { #slips-designs .gh-pair { grid-template-columns:1fr; } #slips-designs .gh-preview-phone { width:100%; max-width:390px; justify-self:center; } .gh-browser-toolbar { padding:12px 16px; } .gh-browser-toolbar strong { flex-basis:100%; } #slips-designs { padding:0 16px; margin-block:16px; } }
@media(max-width:500px) { .gh-browser-toolbar-inner { gap:8px; } .gh-browser-toolbar label { flex:1; min-width:0; } .gh-browser-toolbar select { width:100%; min-width:0; } .gh-browser-toolbar button { padding-inline:10px; } .gh-browser-toolbar .gh-browser-counter { display:none; } }
@media(max-width:500px) { .gh-browser-toolbar label { font-size:0; gap:0; } .gh-browser-toolbar button { width:34px; padding:0; font-size:0; } #gh-browser-previous::after { content:'‹'; font-size:22px; } #gh-browser-next::after { content:'›'; font-size:22px; } }
</style>
<header class="gh-browser-toolbar" aria-label="Design preview controls">
  <div class="gh-browser-toolbar-inner">
    <strong>Essentials + Dialogs · 10 variants</strong>
    <label for="gh-browser-design">Design <select id="gh-browser-design" aria-label="Choose design"></select></label>
    <button type="button" id="gh-browser-previous" aria-label="Previous design">Previous</button>
    <span class="gh-browser-counter" id="gh-browser-counter" aria-live="polite">2 / 10</span>
    <button type="button" id="gh-browser-next" aria-label="Next design">Next</button>
  </div>
</header>

<div id="slips-designs" class="gh-browser-gallery" aria-label="Ten slip builder section designs for desktop and mobile">
  <section data-variant="Balanced" aria-label="Balanced essentials and dialogs"><div class="gh-pair" data-design="dialogs"></div></section>
  <section data-variant="Compact Stack" aria-label="Compact Stack essentials and dialogs" hidden><div class="gh-pair" data-design="stack"></div></section>
  <section data-variant="Unified Rail" aria-label="Unified Rail essentials and dialogs" hidden><div class="gh-pair" data-design="unified"></div></section>
  <section data-variant="Range Matrix" aria-label="Range Matrix essentials and dialogs" hidden><div class="gh-pair" data-design="matrix"></div></section>
  <section data-variant="Stacked Ranges" aria-label="Stacked Ranges essentials and dialogs" hidden><div class="gh-pair" data-design="rows"></div></section>
  <section data-variant="Count Rail" aria-label="Count Rail essentials and dialogs" hidden><div class="gh-pair" data-design="count"></div></section>
  <section data-variant="Inline Builder" aria-label="Inline Builder essentials and dialogs" hidden><div class="gh-pair" data-design="inline"></div></section>
  <section data-variant="Open Surface" aria-label="Open Surface essentials and dialogs" hidden><div class="gh-pair" data-design="open"></div></section>
  <section data-variant="Connected Options" aria-label="Connected Options essentials and dialogs" hidden><div class="gh-pair" data-design="connected"></div></section>
  <section data-variant="Action Band" aria-label="Action Band essentials and dialogs" hidden><div class="gh-pair" data-design="band"></div></section>
</div>

<template id="sb-targets">
  <div class="sb-targets">
    <label class="sb-label sb-count"><span>Slips</span><input name="slips" type="number" min="1" max="10" value="3" aria-label="Number of slips"></label>
    <div class="sb-field"><strong>Total odds / slip</strong><div class="sb-range"><label>Min<input name="totalMin" type="number" placeholder="Any" step=".01" aria-label="Minimum total odds"></label><label>Max<input name="totalMax" type="number" placeholder="Any" step=".01" aria-label="Maximum total odds"></label></div></div>
    <div class="sb-field"><strong>Picks / slip</strong><div class="sb-range"><label>Min<input name="teamsMin" type="number" placeholder="Any" min="1" max="8" aria-label="Minimum picks per slip"></label><label>Max<input name="teamsMax" type="number" placeholder="Any" min="1" max="8" aria-label="Maximum picks per slip"></label></div></div>
  </div>
</template>
<template id="sb-rules">
  <div class="sb-rules">
    <div class="sb-field"><strong>Individual odds</strong><div class="sb-range"><label>Min<input name="oddsMin" type="number" placeholder="Any" step=".01" aria-label="Minimum individual odds"></label><label>Max<input name="oddsMax" type="number" placeholder="Any" step=".01" aria-label="Maximum individual odds"></label></div></div>
    <div class="sb-field"><strong>Probability %</strong><div class="sb-range"><label>Min<input name="probMin" type="number" placeholder="Any" min="0" max="100" aria-label="Minimum probability"></label><label>Max<input name="probMax" type="number" placeholder="Any" min="0" max="100" aria-label="Maximum probability"></label></div></div>
  </div>
</template>
<template id="sb-kickoff">
  <div class="sb-schedule">
    <label class="sb-label"><span>From date</span><input name="dateFrom" type="date" aria-label="From date"></label>
    <label class="sb-label"><span>To date</span><input name="dateTo" type="date" aria-label="To date"></label>
    <label class="sb-label"><span>From time</span><input name="timeFrom" type="time" aria-label="From time"></label>
    <label class="sb-label"><span>To time</span><input name="timeTo" type="time" aria-label="To time"></label>
  </div>
</template>
<template id="sb-markets">
  <div class="sb-markets">
    <div class="sb-market" data-market="Match result"><label><input type="checkbox" checked data-enable-market>Match result</label><details class="sb-market-picker"><summary class="cursor-interaction" aria-label="Choose match results"><span>Automatic</span><span class="sb-arrow" aria-hidden="true">⌄</span></summary><div class="sb-menu"><label><input type="checkbox" checked data-auto>Automatic</label><label><input type="checkbox" value="Home win">Home win</label><label><input type="checkbox" value="Draw">Draw</label><label><input type="checkbox" value="Away win">Away win</label></div></details></div>
    <div class="sb-market" data-market="Double chance"><label><input type="checkbox" checked data-enable-market>Double chance</label><details class="sb-market-picker"><summary class="cursor-interaction" aria-label="Choose double chance results"><span>Automatic</span><span class="sb-arrow" aria-hidden="true">⌄</span></summary><div class="sb-menu"><label><input type="checkbox" checked data-auto>Automatic</label><label><input type="checkbox" value="Home or draw">Home or draw</label><label><input type="checkbox" value="Away or draw">Away or draw</label><label><input type="checkbox" value="Home or away">Home or away</label></div></details></div>
    <div class="sb-market" data-market="Total goals (2.5)"><label><input type="checkbox" checked data-enable-market>Total goals (2.5)</label><details class="sb-market-picker"><summary class="cursor-interaction" aria-label="Choose total goals results"><span>Automatic</span><span class="sb-arrow" aria-hidden="true">⌄</span></summary><div class="sb-menu"><label><input type="checkbox" checked data-auto>Automatic</label><label><input type="checkbox" value="Over 2.5">Over 2.5</label><label><input type="checkbox" value="Under 2.5">Under 2.5</label></div></details></div>
    <div class="sb-market" data-market="Both teams to score"><label><input type="checkbox" checked data-enable-market>Both teams to score</label><details class="sb-market-picker"><summary class="cursor-interaction" aria-label="Choose both teams to score results"><span>Automatic</span><span class="sb-arrow" aria-hidden="true">⌄</span></summary><div class="sb-menu"><label><input type="checkbox" checked data-auto>Automatic</label><label><input type="checkbox" value="Yes">Yes</label><label><input type="checkbox" value="No">No</label></div></details></div>
  </div>
</template>
<template id="sb-footer">
  <footer class="sb-footer"><button type="reset" class="sb-reset">Reset</button><button type="submit" class="sb-build">Build slips</button></footer>
</template>
<template id="sb-reuse">
  <label class="sb-reuse"><input name="reuse" type="checkbox">Reuse matches across slips</label>
</template>
<script>
(() => {
  const root=document.getElementById('slips-designs');
  const part=name=>document.getElementById(`sb-${name}`).innerHTML;
  const group=(label,content,extra='')=>`<fieldset ${extra}><legend>${label}</legend>${content}</fieldset>`;
  const disclosure=(key,title,summary,content,open=false)=>`<details class="sb-disclosure" data-criteria="${key}" ${open?'open':''}><summary class="cursor-interaction"><strong>${title}</strong><span data-summary="${key}">${summary}</span><span class="sb-arrow" aria-hidden="true">⌄</span></summary><div class="sb-disclosure-content">${content}</div></details>`;
  const target=()=>part('targets'), rules=()=>part('rules'), kickoff=()=>part('kickoff'), markets=()=>part('markets');
  const footer=()=>part('footer');
  const dialogDefaults=Object.freeze({slips:'3',totalMin:'1.01',totalMax:'100000',teamsMin:'1',teamsMax:'8',oddsMin:'1.01',oddsMax:'1000',probMin:'0',probMax:'100',dateFrom:'2026-10-24',dateTo:'2026-11-23',timeFrom:'00:00',timeTo:'23:59'});
  const dialogState=new WeakMap();
  function settleDialog(popup,result) {
    const state=dialogState.get(popup);if(!state||state.settled)return;
    if(result!=='apply')state.inputs.forEach(({input,value,checked,disabled})=>{input.value=value;input.checked=checked;input.disabled=disabled;});
    popup.querySelectorAll('.sb-market-picker').forEach(refreshPicker);
    popup.querySelectorAll('.sb-market').forEach(row=>{const picker=row.querySelector('.sb-market-picker');picker.setAttribute('aria-disabled',String(!row.querySelector('[data-enable-market]').checked));picker.open=true;});
    state.settled=true;sync(popup.closest('form'));
  }
  function closeDialog(popup,result) {settleDialog(popup,result);popup.close(result);}
  function dialog(kind,title,content,id,zone='') {
    return `<dialog class="sb-dialog" id="${id}-${kind}" aria-labelledby="${id}-${kind}-title" data-dialog="${kind}"><header class="sb-dialog-head"><h2 id="${id}-${kind}-title">${title}</h2>${zone?`<span class="sb-zone">${zone}</span>`:''}<button type="button" class="sb-dialog-close" data-dialog-cancel aria-label="Close ${title}">×</button></header><div class="sb-dialog-body">${content}</div><footer class="sb-dialog-actions"><button type="button" class="sb-reset" data-dialog-cancel>Cancel</button><button type="button" class="sb-build" data-dialog-apply>Apply</button></footer></dialog>`;
  }
  function dialogBody(id,kind) {
    let essentials=target().replace(/<label class="sb-label sb-count">[\s\S]*?<\/label>/,'');
    let count='';
    if(kind==='unified')essentials=target();
    if(kind==='count')count='<div class="sb-integrated-count"><label>Slips<input name="slips" type="number" value="3" min="1" max="10" aria-label="Number of slips"></label></div>';
    if(kind==='inline')essentials=essentials.replace('<div class="sb-targets">','<div class="sb-targets"><label class="sb-inline-count"><span class="sb-inline-build">Build</span><input name="slips" type="number" value="3" min="1" max="10" aria-label="Number of slips"><span class="sb-inline-slips">slips</span></label>');
    if(kind==='matrix')essentials='<div class="sb-mini-matrix"><span>Range / slip</span><span>Min</span><span>Max</span><span class="sb-matrix-label">Total odds</span><input name="totalMin" type="number" step=".01" aria-label="Minimum total odds"><input name="totalMax" type="number" step=".01" aria-label="Maximum total odds"><span class="sb-matrix-label">Picks</span><input name="teamsMin" type="number" aria-label="Minimum picks per slip"><input name="teamsMax" type="number" aria-label="Maximum picks per slip"></div>';
    const buttons=[['rules','Match limits'],['kickoff','Kickoff'],['markets','Markets']].map(([key,label])=>`<button type="button" class="sb-option" data-open-dialog="${key}" aria-haspopup="dialog" aria-controls="${id}-${key}"><span>${label}</span><span class="sb-option-state" hidden>Edited</span></button>`).join('');
    const marketChoices=markets().replaceAll('<details class="sb-market-picker">','<details class="sb-market-picker" data-inline open>')+`<div class="sb-dialog-reuse">${part('reuse')}</div>`;
    return `<div class="sb-dialog-layout">${count}${essentials}<div class="sb-dialog-options">${buttons}</div></div>${footer(false)}${dialog('rules','Match limits',rules(),id)}${dialog('kickoff','Kickoff',kickoff(),id,'EAT')}${dialog('markets','Markets & results',marketChoices,id)}`;
  }
  function fullGrid() {return `<div class="sb-content"><div class="sb-compact-grid">${group('Your slips',target())}${group('Match limits',rules())}${group('Kickoff · EAT',kickoff())}</div><div class="sb-markets-wrap">${group('Markets & results',markets())}</div></div>`;}
  function options(includeMarkets=true) {return disclosure('rules','Match limits','Any odds · Any probability',rules())+disclosure('kickoff','Kickoff · EAT','Any date · All day',kickoff())+(includeMarkets?disclosure('markets','Markets','All 4 · Automatic',markets()):'');}
  function columns() {return `<div class="sb-content"><div class="sb-columns"><div>${group('Your slips',target())}${group('Match limits',rules())}</div><div>${group('Kickoff · EAT',kickoff())}${group('Markets & results',markets())}</div></div></div>`;}
  function matrix() {
    const rows=[['Total odds / slip','totalMin','totalMax'],['Picks / slip','teamsMin','teamsMax'],['Individual odds','oddsMin','oddsMax'],['Probability %','probMin','probMax']];
    return `<div class="sb-content"><div class="sb-matrix-top"><div><label class="sb-count-line">Number of slips<input name="slips" type="number" value="3" min="1" max="10" aria-label="Number of slips"></label><div class="sb-range-table"><span>Range</span><span>Min</span><span>Max</span>${rows.map(row=>`<span>${row[0]}</span><input name="${row[1]}" type="number" placeholder="Any" aria-label="Minimum ${row[0]}"><input name="${row[2]}" type="number" placeholder="Any" aria-label="Maximum ${row[0]}">`).join('')}</div></div><div>${group('Kickoff · EAT',kickoff())}</div></div><div class="sb-markets-wrap">${group('Markets & results',markets())}</div></div>`;
  }
  function tabbed(id,guided=false) {
    const panels=guided?[['targets','1 · Targets',target()],['rules','2 · Limits',rules()],['matches','3 · Kickoff & markets',group('Kickoff · EAT',kickoff())+`<div class="sb-markets-wrap">${group('Markets & results',markets())}</div>`],['review','4 · Review','<div class="sb-review" data-review></div>']]:[['targets','Your slips',target()],['rules','Match limits',rules()],['kickoff','Kickoff · EAT',kickoff()],['markets','Markets',markets()]];
    return `<div class="sb-tabs" role="tablist" aria-label="${guided?'Builder steps':'Criteria categories'}">${panels.map((p,i)=>`<button type="button" role="tab" id="${id}-tab-${p[0]}" aria-controls="${id}-panel-${p[0]}" aria-selected="${i===0}" data-tab="${p[0]}">${p[1]}</button>`).join('')}</div>${panels.map((p,i)=>`<div class="sb-tab-panel" role="tabpanel" aria-labelledby="${id}-tab-${p[0]}" id="${id}-panel-${p[0]}" data-panel="${p[0]}" ${i?'hidden':''}>${p[2]}</div>`).join('')}`;
  }
  function body(kind,id) {
    if(kind==='grid')return fullGrid()+footer();
    if(kind==='dialogs')return dialogBody(id);
    if(kind==='split')return columns()+footer();
    if(kind==='settings')return disclosure('targets','Your slips','3 slips · Any odds · Any picks',target())+options()+footer();
    if(kind==='matrix')return matrix()+footer();
    if(kind==='tabs')return tabbed(id)+footer();
    if(kind==='sentence')return `<div class="sb-sentence"><label>Build <input name="slips" type="number" value="3" min="1" max="10" aria-label="Number of slips"> slips</label><div class="sb-sentence-range"><span>Total odds</span><input name="totalMin" type="number" placeholder="Any" aria-label="Minimum total odds"><span>–</span><input name="totalMax" type="number" placeholder="Any" aria-label="Maximum total odds"></div><div class="sb-sentence-range"><span>Picks / slip</span><input name="teamsMin" type="number" placeholder="Any" aria-label="Minimum picks"><span>–</span><input name="teamsMax" type="number" placeholder="Any" aria-label="Maximum picks"></div></div>${options()}${footer()}`;
    if(kind==='markets')return `<div class="sb-market-first">${group('Markets & results',markets())}</div><div class="sb-content sb-essential">${target()}</div>${options(false)}${footer()}`;
    if(kind==='quick')return `<div class="sb-quick-summary"><b data-quick-count>3 slips</b><span class="sb-quick-values" data-quick-values>Total odds: Any · Picks: Any</span><button class="sb-edit" type="button" aria-expanded="false" data-edit>Edit criteria<span class="sb-arrow" aria-hidden="true">⌄</span></button></div><div class="sb-quick-panel" data-edit-panel hidden>${fullGrid()}</div>${footer()}`;
    if(kind==='guided')return tabbed(id,true)+footer().replace('<button type="reset" class="sb-reset">Reset</button>','<button type="button" class="sb-back" data-back hidden>Back</button><button type="reset" class="sb-reset">Reset</button>').replace('<button type="submit" class="sb-build">Build slips</button>','<button type="button" class="sb-next" data-next>Continue</button>');
    return '';
  }
  root.querySelectorAll('[data-design]').forEach(pair=>{
    const kind=pair.dataset.design;
    [false,true].forEach(mobile=>{
      const wrapper=document.createElement('div');
      wrapper.className=mobile?'gh-preview-phone':'gh-preview-desktop';
      const id=`builder-${kind}-${mobile?'mobile':'desktop'}`;
      const countInBody=['unified','count','inline'].includes(kind);
      const countHeading=countInBody?'':`<label class="sb-title-count">Slips<input name="slips" type="number" value="3" min="1" max="10" aria-label="Number of slips" form="${id}-form"></label>`;
      const heading=`<div class="sb-title-row"><h1>Slip builder</h1>${countHeading}</div>`;
      wrapper.innerHTML=`<div class="gh-preview-label">${mobile?'Mobile':'Desktop'}</div><section class="sb sb-dialogs sb-v-${kind}${mobile?' sb-mobile':''}" aria-label="${pair.parentElement.dataset.variant} ${mobile?'mobile':'desktop'} slip builder">${heading}<form id="${id}-form" class="sb-form" novalidate>${dialogBody(id,kind)}</form></section>`;
      {
        wrapper.querySelectorAll('input[name]').forEach(input=>{
          if(!(input.name in dialogDefaults))return;
          input.value=dialogDefaults[input.name];input.defaultValue=dialogDefaults[input.name];input.removeAttribute('placeholder');
          const bounds={slips:[1,10],totalMin:[1.01,100000],totalMax:[1.01,100000],teamsMin:[1,8],teamsMax:[1,8],oddsMin:[1.01,1000],oddsMax:[1.01,1000],probMin:[0,100],probMax:[0,100]}[input.name];
          if(bounds){input.min=String(bounds[0]);input.max=String(bounds[1]);}
        });
        wrapper.querySelectorAll('dialog').forEach(popup=>{
          popup.addEventListener('cancel',()=>settleDialog(popup,'cancel'));
          popup.addEventListener('close',()=>{
            if(popup.open)return;
            const state=dialogState.get(popup);
            settleDialog(popup,popup.returnValue);state?.trigger.focus({preventScroll:true});
          });
          popup.addEventListener('click',event=>{
            if(event.target!==popup)return;
            const rect=popup.getBoundingClientRect();
            if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog(popup,'cancel');
          });
        });
      }
      pair.appendChild(wrapper);
    });
  });
  const observer=new ResizeObserver(entries=>entries.forEach(entry=>entry.target.classList.toggle('sb-mobile',entry.contentRect.width<540)));
  root.querySelectorAll('.gh-preview-desktop .sb').forEach(section=>observer.observe(section));
  function draft(form) {
    const get=name=>form.elements.namedItem(name)?.value||'';
    const range=(lo,hi,suffix='')=>!lo&&!hi?'Any':`${lo||'Any'}${lo?suffix:''}–${hi||'Any'}${hi?suffix:''}`;
    const date=value=>value?new Date(value+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}):'Any';
    const from=get('dateFrom'),to=get('dateTo');
    const enabled=Array.from(form.querySelectorAll('.sb-market')).filter(row=>row.querySelector('[data-enable-market]').checked);
    const custom=enabled.filter(row=>row.querySelector('.sb-market-picker input:not([data-auto]):checked')).length;
    return {count:get('slips')||'3',total:range(get('totalMin'),get('totalMax')),picks:range(get('teamsMin'),get('teamsMax')),odds:range(get('oddsMin'),get('oddsMax')),probability:range(get('probMin'),get('probMax'),'%'),dates:from||to?(from===to?date(from):`${date(from)}–${date(to)}`):'Any date',time:get('timeFrom')||get('timeTo')?range(get('timeFrom'),get('timeTo')):'All day',markets:`${enabled.length===4?'All 4':enabled.length+' markets'} · ${custom?custom+' custom':'Automatic'}`};
  }
  function sync(form) {
    const d=draft(form);
    const summaries={targets:`${d.count} slips · ${d.total} odds · ${d.picks} picks`,rules:`${d.odds} odds · ${d.probability} probability`,kickoff:`${d.dates} · ${d.time}`,markets:d.markets};
    form.querySelectorAll('[data-summary]').forEach(span=>span.textContent=summaries[span.dataset.summary]);
    const quickCount=form.querySelector('[data-quick-count]'),quickValues=form.querySelector('[data-quick-values]');
    if(quickCount)quickCount.textContent=`${d.count} slips`;
    if(quickValues)quickValues.textContent=`Total odds: ${d.total} · Picks: ${d.picks}`;
    const review=form.querySelector('[data-review]');
    if(review)review.innerHTML=[['Slips',d.count],['Total odds / slip',d.total],['Picks / slip',d.picks],['Individual odds',d.odds],['Probability',d.probability],['Kickoff · EAT',`${d.dates} · ${d.time}`],['Markets & results',d.markets]].map(([k,v])=>`<div><strong>${k}</strong>${v}</div>`).join('');
    form.querySelectorAll('[data-open-dialog]').forEach(button=>{
      const popup=form.querySelector(`[data-dialog="${button.dataset.openDialog}"]`);
      const changed=Array.from(popup.querySelectorAll('input')).some(input=>input.type==='checkbox'?input.checked!==input.defaultChecked:input.value!==input.defaultValue);
      button.dataset.changed=String(changed);button.querySelector('.sb-option-state').hidden=!changed;
    });
  }
  function refreshPicker(picker) {
    const selected=Array.from(picker.querySelectorAll('input:not([data-auto]):checked'));
    picker.querySelector('summary > span').textContent=selected.length===0?'Automatic':selected.length===1?selected[0].value:`${selected.length} results`;
  }
  function selectTab(form,key) {
    form.querySelectorAll('[data-tab]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===key)));
    form.querySelectorAll('[data-panel]').forEach(panel=>panel.hidden=panel.dataset.panel!==key);
    const next=form.querySelector('[data-next]');
    if(next){next.textContent=key==='review'?'Build slips':'Continue';form.querySelector('[data-back]').hidden=key==='targets';}
    sync(form);
  }
  root.addEventListener('click',event=>{
    const form=event.target.closest('form');if(!form)return;
    const disabledPicker=event.target.closest('.sb-market-picker[aria-disabled=true]');if(disabledPicker){event.preventDefault();return;}
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.openDialog) {
      const popup=form.querySelector(`[data-dialog="${button.dataset.openDialog}"]`);
      dialogState.set(popup,{trigger:button,settled:false,inputs:Array.from(popup.querySelectorAll('input')).map(input=>({input,value:input.value,checked:input.checked,disabled:input.disabled}))});
      popup.querySelector('.sb-error')?.remove();popup.returnValue='cancel';
      const app=form.closest('.sb'),bounds=app.getBoundingClientRect();
      const mobile=app.classList.contains('sb-mobile');
      const width=Math.min(mobile?360:470,window.innerWidth-24);
      popup.style.width=`${width}px`;
      popup.style.left=`${Math.max(12,Math.min(bounds.left+(bounds.width-width)/2,window.innerWidth-width-12))}px`;
      popup.showModal();
      popup.style.top=`${Math.max(12,Math.min(bounds.top+26,(window.innerHeight-popup.getBoundingClientRect().height)/2))}px`;
    }
    if(button.hasAttribute('data-dialog-cancel'))closeDialog(button.closest('dialog'),'cancel');
    if(button.hasAttribute('data-dialog-apply')) {
      const popup=button.closest('dialog');
      popup.querySelector('.sb-error')?.remove();
      const inputs=Array.from(popup.querySelectorAll('input[type=number]'));
      const invalid=inputs.find(input=>input.value===''||!input.checkValidity());
      const value=name=>form.elements.namedItem(name)?.value;
      let issue=invalid?'Enter a value within the allowed range.':'';
      if(popup.dataset.dialog==='rules'&&(Number(value('oddsMin'))>Number(value('oddsMax'))||Number(value('probMin'))>Number(value('probMax'))))issue='Minimum must be less than or equal to maximum.';
      if(popup.dataset.dialog==='kickoff') {
        const from=value('dateFrom'),to=value('dateTo');
        if(!from||!to||to<from||(new Date(to)-new Date(from))/86400000>30)issue='Choose a date range of up to 31 days.';
        if(!value('timeFrom')||!value('timeTo')||value('timeFrom')>value('timeTo'))issue='Choose a start time before the end time.';
      }
      if(popup.dataset.dialog==='markets'&&!popup.querySelector('[data-enable-market]:checked'))issue='Choose at least one market.';
      if(issue){popup.querySelector('.sb-dialog-body').insertAdjacentHTML('afterbegin',`<p class="sb-error" role="alert">${issue}</p>`);invalid?.focus();}
      else closeDialog(popup,'apply');
    }
    if(button.dataset.tab)selectTab(form,button.dataset.tab);
    if(button.hasAttribute('data-edit')){
      const panel=form.querySelector('[data-edit-panel]');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));button.firstChild.textContent=panel.hidden?'Edit criteria':'Close criteria';
    }
    if(button.hasAttribute('data-next')||button.hasAttribute('data-back')){
      const keys=['targets','rules','matches','review'];const current=form.querySelector('[data-tab][aria-selected=true]').dataset.tab;
      const index=keys.indexOf(current);
      if(button.hasAttribute('data-back'))selectTab(form,keys[Math.max(0,index-1)]);
      else if(index<keys.length-1)selectTab(form,keys[index+1]);
      else{button.disabled=true;button.textContent='Building…';setTimeout(()=>{button.disabled=false;button.textContent='Build slips';},450);}
    }
  });
  root.addEventListener('change',event=>{
    const input=event.target,form=input.form||input.closest('form');if(!form)return;
    const picker=input.closest('.sb-market-picker');
    if(picker){
      if(input.hasAttribute('data-auto'))picker.querySelectorAll('input:not([data-auto])').forEach(box=>box.checked=false);
      else picker.querySelector('[data-auto]').checked=false;
      const selected=Array.from(picker.querySelectorAll('input:not([data-auto]):checked'));
      if(!selected.length)picker.querySelector('[data-auto]').checked=true;
      refreshPicker(picker);
    }
    if(input.hasAttribute('data-enable-market')){
      const field=input.closest('.sb-market').querySelector('.sb-market-picker');field.setAttribute('aria-disabled',String(!input.checked));if(!field.hasAttribute('data-inline')&&!input.checked)field.open=false;
      field.querySelectorAll('input').forEach(box=>box.disabled=!input.checked);
    }
    sync(form);
  });
  root.addEventListener('input',event=>{const form=event.target.form||event.target.closest('form');if(form)sync(form);});
  root.addEventListener('reset',event=>{
    const form=event.target;
    if(form.closest('.sb-dialogs')) {
      event.preventDefault();
      Array.from(form.elements).filter(input=>input instanceof HTMLInputElement).forEach(input=>{
        if(input.type==='checkbox')input.checked=input.defaultChecked;else input.value=input.defaultValue;input.disabled=false;
      });
      form.querySelectorAll('.sb-market-picker').forEach(picker=>{refreshPicker(picker);picker.setAttribute('aria-disabled','false');picker.open=true;});
      form.querySelectorAll('.sb-error').forEach(error=>error.remove());sync(form);return;
    }
    setTimeout(()=>{
      form.querySelectorAll('.sb-market-picker').forEach(picker=>{picker.querySelector('summary > span').textContent='Automatic';picker.setAttribute('aria-disabled','false');picker.querySelectorAll('input').forEach(input=>input.disabled=false);picker.open=picker.hasAttribute('data-inline');});
      form.querySelector('.sb-error')?.remove();sync(form);
      if(form.querySelector('[data-next]'))selectTab(form,'targets');
    },0);
  });
  root.addEventListener('submit',event=>{
    event.preventDefault();const form=event.target;
    const pairs=[['totalMin','totalMax'],['teamsMin','teamsMax'],['oddsMin','oddsMax'],['probMin','probMax']];
    form.querySelector('.sb-error')?.remove();
    const invalid=pairs.find(([a,b])=>form.elements.namedItem(a)?.value&&form.elements.namedItem(b)?.value&&Number(form.elements.namedItem(a).value)>Number(form.elements.namedItem(b).value));
    if(invalid){form.insertAdjacentHTML('afterbegin','<p class="sb-error" role="alert">Minimum must be less than or equal to maximum.</p>');return;}
    const button=form.querySelector('.sb-footer > .sb-build');button.disabled=true;button.textContent='Building…';setTimeout(()=>{button.disabled=false;button.textContent='Build slips';},450);
  });
  document.addEventListener('click',event=>{
    root.querySelectorAll('.sb-market-picker[open]:not([data-inline])').forEach(picker=>{if(!picker.contains(event.target))picker.open=false;});
  });
})();
</script>

<script>
(() => {
  const gallery = document.getElementById('slips-designs');
  const designs = Array.from(gallery.querySelectorAll(':scope > section[data-variant]'));
  const select = document.getElementById('gh-browser-design');
  const counter = document.getElementById('gh-browser-counter');
  const previous = document.getElementById('gh-browser-previous');
  const next = document.getElementById('gh-browser-next');
  const designKey = section => section.querySelector('[data-design]').dataset.design;
  designs.forEach(section => {
    const option = document.createElement('option');
    option.value = designKey(section);
    option.textContent = section.dataset.variant;
    select.appendChild(option);
  });
  let index = designs.findIndex(section => designKey(section) === location.hash.slice(1));
  if (index < 0) index = designs.findIndex(section => designKey(section) === 'dialogs');
  function show(value) {
    index = (value + designs.length) % designs.length;
    designs.forEach((section, position) => section.hidden = position !== index);
    select.value = designKey(designs[index]);
    counter.textContent = `${index + 1} / ${designs.length}`;
    history.replaceState(null, '', `#${select.value}`);
    document.title = `${designs[index].dataset.variant} · Essentials + Dialogs`;
  }
  select.addEventListener('change', () => show(designs.findIndex(section => designKey(section) === select.value)));
  previous.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  show(index);
})();

</script>

<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
